async function gdFindFile(){
  const res=await fetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${GD_FILENAME}'&fields=files(id,name)`,
    {headers:{Authorization:'Bearer '+_gdToken}}
  );
  if(!res.ok)return null;
  const d=await res.json();
  return d.files&&d.files.length?d.files[0].id:null;
}

async function gdSyncDown(fromLogin=false){
  if(!_gdToken){toast('先にGoogleログインしてください');return;}
  try{
    toast('クラウドから読み込み中…');
    const fid=await gdFindFile();
    if(!fid){
      // ファイルなし＝初回→ローカルをアップロード
      await gdSyncUp(true);
      toast('クラウドに初回バックアップしました');
      return;
    }
    _gdFileId=fid;
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,
      {headers:{Authorization:'Bearer '+_gdToken}}
    );
    if(!res.ok)throw new Error('download failed');
    const d=await res.json();
    if(d.instances&&Array.isArray(d.instances)){
      UD=d;
      if(!UD.customSwords)UD.customSwords=[];
      if(!UD.events)UD.events=[];
      if(!UD.notes)UD.notes=[];
      save();ra();
      toast(fromLogin?'クラウドからデータを読み込みました':'同期しました ↓');
    }
  }catch(e){toast('同期失敗：'+e.message);}
}

async function gdSyncUp(silent=false){
  if(!_gdToken){toast('先にGoogleログインしてください');return;}
  try{
    if(!silent)toast('クラウドへ保存中…');
    const body=JSON.stringify(UD);
    const fid=_gdFileId||(await gdFindFile());
    if(fid){
      // 上書き
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{
        method:'PATCH',
        headers:{Authorization:'Bearer '+_gdToken,'Content-Type':'application/json'},
        body
      });
      _gdFileId=fid;
    }else{
      // 新規作成
      const meta={name:GD_FILENAME,parents:['appDataFolder']};
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file',new Blob([body],{type:'application/json'}));
      const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
        method:'POST',
        headers:{Authorization:'Bearer '+_gdToken},
        body:form
      });
      const d=await res.json();_gdFileId=d.id;
    }
    if(!silent)toast('クラウドへ保存しました ↑');
  }catch(e){toast('保存失敗：'+e.message);}
}

function gdStatus(){return _gdToken?'ログイン中':'未ログイン';}

// ── 同期UI共通 ─────────────────────────────────────────
let _lastSyncTime=null; // 最終同期時刻（Date）
let _autoSyncTimer=null;

function fmtSyncTime(d){
  if(!d)return '';
  const now=new Date();
  const diff=Math.floor((now-d)/60000);
  if(diff<1)return 'たった今';
  if(diff<60)return `${diff}分前`;
  return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}

// PCヘッダーの同期エリア更新
function updatePcSyncHdr(){
  const area=document.getElementById('pcSyncArea');
  if(!area)return;
  if(!_gdToken){
    area.innerHTML=`<button class="btn sm" onclick="gdSignIn()" style="border-color:var(--gold);color:var(--gold)">☁ 同期ログイン</button>`;
    return;
  }
  // 最終同期時刻を永続化から復元
  if(!_lastSyncTime){
    const saved=localStorage.getItem('_lastSyncTime');
    if(saved)_lastSyncTime=new Date(saved);
  }
  const timeStr=_lastSyncTime?`<div style="font-size:9px;color:var(--text3);text-align:center">${fmtSyncTime(_lastSyncTime)}</div>`:'';
  const mode=ST.syncMode||'manual';
  const syncing=area.dataset.syncing==='1';
  if(mode==='auto'){
    area.innerHTML=`
      ${timeStr}
      <div style="display:flex;gap:4px">
        <button class="btn sm" onclick="gdSyncUp()" style="${syncing?'color:var(--gold);border-color:var(--gold)':'color:var(--kiwame);border-color:var(--kiwame)'}">☁ ${syncing?'同期中…':'同期済'}</button>
        <button class="btn sm" onclick="gdSignOut()" style="border-color:rgba(255,100,100,.5);color:rgba(255,160,160,.9)">ログアウト</button>
      </div>`;
  }else{
    area.innerHTML=`
      ${timeStr}
      <div style="display:flex;gap:4px">
        <button class="btn sm" onclick="gdSyncUpWithCheck()" style="color:var(--kiwame);border-color:var(--kiwame)">☁ ⬆ 保存</button>
        <button class="btn sm" onclick="gdSyncDown()">⬇ 読み込む</button>
        <button class="btn sm" onclick="gdSignOut()" style="border-color:rgba(255,100,100,.5);color:rgba(255,160,160,.9)">ログアウト</button>
      </div>`;
  }
}

// スマホ2行目☁ボタンのラベル更新
function updateMobileHdr2Sync(){
  const btn=document.getElementById('mobileHdr2Sync');
  if(!btn)return;
  if(!_gdToken){btn.textContent='☁ 未接続';btn.style.color='';return;}
  const mode=ST.syncMode||'manual';
  btn.textContent=mode==='auto'?'☁ 同期済':'☁ 同期';
  btn.style.color='var(--kiwame)';
}

// 同期完了後に呼ぶ共通処理
function onSyncDone(){
  _lastSyncTime=new Date();
  localStorage.setItem('_lastSyncTime',_lastSyncTime.toISOString());
  updatePcSyncHdr();
  updateMobileHdr2Sync();
  renderCloudPopup();
}

// ── タイムスタンプ警告 ──────────────────────────────────
async function gdGetCloudModified(){
  if(!_gdToken||!_gdFileId)return null;
  try{
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files/${_gdFileId}?fields=modifiedTime`,
      {headers:{Authorization:'Bearer '+_gdToken}}
    );
    if(!res.ok)return null;
    const d=await res.json();
    return d.modifiedTime?new Date(d.modifiedTime):null;
  }catch{return null;}
}

async function gdSyncUpWithCheck(){
  if(!_gdToken){toast('先にGoogleログインしてください');return;}
  if(ST.syncWarnDisabled){await gdSyncUp();return;}
  const cloudMod=await gdGetCloudModified();
  if(cloudMod&&_lastSyncTime&&cloudMod>_lastSyncTime){
    showTimestampWarn(cloudMod);
  }else{
    await gdSyncUp();
  }
}

function showTimestampWarn(cloudMod){
  const localStr=_lastSyncTime
    ?_lastSyncTime.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
    :'（不明）';
  const cloudStr=cloudMod.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  showM(`<div class="modal-title">⚠ クラウドに新しいデータがあります</div>
  <div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.7">クラウドのデータが手元より新しいです。このまま上書き保存すると、クラウドの変更が失われます。</div>
  <div style="background:var(--bg2);border-radius:var(--r);padding:8px 12px;font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.8">
    手元の最終同期：${localStr}<br>
    クラウドの更新：${cloudStr}
  </div>
  <label class="cbr" style="margin-bottom:14px">
    <input type="checkbox" id="warnNeverChk"> 今後この警告を表示しない
  </label>
  <div class="mact" style="gap:8px">
    <button class="btn" onclick="cM()">キャンセル</button>
    <button class="btn danger" onclick="onWarnOverwrite()">上書きして保存</button>
  </div>`);
}

async function onWarnOverwrite(){
  const chk=document.getElementById('warnNeverChk');
  if(chk&&chk.checked){ST.syncWarnDisabled=true;saveST();}
  cM();
  await gdSyncUp();
}

// ── B案：自動同期 ───────────────────────────────────────
function scheduleAutoSync(){
  if((ST.syncMode||'manual')!=='auto'||!_gdToken)return;
  clearTimeout(_autoSyncTimer);
  // 同期中ステータスを即座に反映
  const area=document.getElementById('pcSyncArea');
  if(area)area.dataset.syncing='1';
  updatePcSyncHdr();
  _autoSyncTimer=setTimeout(async()=>{
    await gdSyncUp(true);
    if(area)area.dataset.syncing='0';
    updatePcSyncHdr();
  },4000);
}

// ── 同期関数のwrap（タイムスタンプ更新・PC表示更新） ──────
const _origGdSyncUp=gdSyncUp;
gdSyncUp=async function(silent=false){
  await _origGdSyncUp(silent);
  onSyncDone();
};
const _origGdSyncDown=gdSyncDown;
gdSyncDown=async function(fromLogin=false){
  await _origGdSyncDown(fromLogin);
  onSyncDone();
};

// ── INIT ───────────────────────────────────────────────
// mobileMode互換初期化
if(!ST.mobileMode){ST.mobileMode=ST.mobile?'mobile':'auto';}
load();applyTheme();applyMode();initScrollTop();ra();
// PCヘッダー同期エリア初期化
updatePcSyncHdr();
// B案：起動時に自動でクラウドから読み込む
if((ST.syncMode||'manual')==='auto'&&_gdToken){
  gdSyncDown(false);
}
</script>
