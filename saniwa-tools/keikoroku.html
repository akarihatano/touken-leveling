let hlNote=null;
let hlEvent=[]; // 強調中の期間メモid（複数選択可）
// 折りたたみ開閉状態（localStorage保持）。キー例: 'mgrEndedEv'(管理タブ終了イベント), 'sideEndedEv'(補助リスト), 'noteMonth:2026-06'
let _foldState=(()=>{try{return JSON.parse(localStorage.getItem('tl_fold_v1'))||{};}catch(e){return {};}})();
function isFolded(key,defClosed){return Object.prototype.hasOwnProperty.call(_foldState,key)?_foldState[key]:!!defClosed;}
function toggleFold(key,defClosed){_foldState[key]=!isFolded(key,defClosed);try{localStorage.setItem('tl_fold_v1',JSON.stringify(_foldState));}catch(e){}}
function saveFold(key,isOpen){_foldState[key]=!isOpen;try{localStorage.setItem('tl_fold_v1',JSON.stringify(_foldState));}catch(e){}}
// 期間メモの開催状態判定: 'active'(開催中) / 'future'(予定) / 'ended'(終了)
function evPhase(ev){var t=todayStr();if(ev.endDate&&ev.endDate<t)return 'ended';if(ev.startDate&&ev.startDate>t)return 'future';return 'active';}
// 入手順：同日内の手動並べ替え
let _gendayReorder=false; // 並べ替えモード（保存しない）
function toggleGendayReorder(){_gendayReorder=!_gendayReorder;ra();}
// この個体の同日グループが2件以上か（矢印を出すか判定）
function gendaySiblings(inst){return inst&&inst.genday?UD.instances.filter(i=>i.genday===inst.genday):[];}
function showReorderUI(inst){return _gendayReorder&&(ST.sort==='gendayAsc'||ST.sort==='gendayDesc')&&inst&&inst.genday&&gendaySiblings(inst).length>=2;}
// 画面上の方向(dir:-1=前/←/↑, +1=後/→/↓)で同日内を入れ替え
function moveGenday(instId,dir){
  const inst=UD.instances.find(i=>i.id===instId);if(!inst||!inst.genday)return;
  let grp=UD.instances.filter(i=>i.genday===inst.genday);
  grp.sort((a,b)=>((a.gendayOrder||0)-(b.gendayOrder||0))||(a.masterBaseNo-b.masterBaseNo));
  const realDir=(ST.sort==='gendayDesc')?-dir:dir; // 降順表示中は画面方向を反転
  const idx=grp.findIndex(i=>i.id===instId);const j=idx+realDir;
  if(j<0||j>=grp.length)return;
  const t=grp[idx];grp[idx]=grp[j];grp[j]=t;
  grp.forEach((i,k)=>{i.gendayOrder=k;}); // 0,1,2…に正規化
  save();ra();
}
let _evSort=(()=>{const s=ST.evSort;return(s&&s.field)?s:{field:'start',dir:1};})();  // 期間メモのソート
let _noteSort=(()=>{const s=ST.noteSort;return(s&&typeof s.dir==='number')?s:{dir:1};})(); // 日メモのソート

function drawChart(selectedInsts){
  if(_gChart){_gChart.destroy();_gChart=null;}
  const oldTip=document.getElementById('g-custom-tooltip');if(oldTip)oldTip.remove();
  const canvas=document.getElementById('gCanvas');
  if(!canvas)return;
  const allInsts=selectedInsts||sortInsts(_gSelIds.map(id=>UD.instances.find(i=>i.id===id)).filter(Boolean),_gChipSort);
  if(!allInsts.length)return;
  // 期間フィルター
  const now=new Date();
  let filterFrom=null;
  if(_gPeriod==='1w'){filterFrom=new Date(now);filterFrom.setDate(filterFrom.getDate()-7);}
  else if(_gPeriod==='1m'){filterFrom=new Date(now);filterFrom.setMonth(filterFrom.getMonth()-1);}
  else if(_gPeriod==='3m'){filterFrom=new Date(now);filterFrom.setMonth(filterFrom.getMonth()-3);}
  else if(_gPeriod==='6m'){filterFrom=new Date(now);filterFrom.setMonth(filterFrom.getMonth()-6);}
  const fromStr=filterFrom?filterFrom.toISOString().slice(0,10):null;
  // 日付軸：history + イベント + メモ（期間フィルター適用）
  const dateSet=new Set(allInsts.flatMap(i=>i.history.map(h=>h.date)));
  activeEVS().forEach(ev=>{if(ev.startDate)dateSet.add(ev.startDate);if(ev.endDate)dateSet.add(ev.endDate);});
  activeNTS().forEach(n=>{if(n.date)dateSet.add(n.date);});
  let allDates=[...dateSet].sort();
  if(fromStr)allDates=allDates.filter(d=>d>=fromStr);
  if(!allDates.length)return;
  _gAllDates=allDates; // タッチ操作用に保存

  // 資材帳方式: 補間で日付→ピクセル（allDatesにない日付でも正確に配置）
  function gX(chart,d){
    const sc=chart.scales.x;
    const i=allDates.indexOf(d);
    if(i>=0)return sc.getPixelForValue(i);
    // 補間: 前後の最近傍から日数で補完
    let bi=-1,bd=Infinity;
    allDates.forEach((l,j)=>{const df=Math.abs(+new Date(l)-+new Date(d));if(df<bd){bd=df;bi=j;}});
    if(bi<0)return null;
    const step=allDates.length>1?sc.getPixelForValue(1)-sc.getPixelForValue(0):0;
    return sc.getPixelForValue(bi)+(+new Date(d)-+new Date(allDates[bi]))/86400000*step;
  }

  const dark=resolveThemeAttr().endsWith('-dark');
  const gridCol=dark?'rgba(200,180,140,.12)':'rgba(100,80,50,.1)';
  const textCol=dark?'#a09070':'#7a6a58';

  const hoverHighlightPlugin={
    id:'hoverHighlight',
    beforeUpdate(chart){
      chart.data.datasets.forEach(ds=>{
        if(ds._origBC===undefined){ds._origBC=ds.borderColor;ds._origBW=ds.borderWidth;}
      });
      if(!ST.hoverHighlight){
        chart.data.datasets.forEach(ds=>{ds.borderColor=ds._origBC;ds.borderWidth=ds._origBW;});
        return;
      }
      const hovered=chart._hoveredIdx;
      chart.data.datasets.forEach((ds,idx)=>{
        if(hovered==null||hovered===-1){
          ds.borderColor=ds._origBC;ds.borderWidth=ds._origBW;
        }else if(idx===hovered){
          ds.borderColor=ds._origBC;ds.borderWidth=(ds._origBW||2)+1.5;
        }else{
          ds.borderColor=fadeColor(ds._origBC,0.2);ds.borderWidth=ds._origBW;
        }
      });
    }
  };
  const evtPlugin={
    id:'evtBg',
    beforeDraw(chart){
      const{ctx,chartArea,scales}=chart;
      if(!scales.x||!chartArea)return;
      ctx.save();

      const events=activeEVS();
        const LABEL_ZONE_TOP=60;
      const LABEL_ROW_H=13;
      // measureText用にフォントを先に設定（正確な文字幅を取得するため）
      ctx.font='10px sans-serif';

      // ── 1パス目：テキスト幅ベースで行を割り当て ──
      // イベントを開始x座標順に処理してgreedyに行を決める
      const rowEnds=new Array(8).fill(-Infinity); // 各行の現在のテキスト右端
      const evMeta=events.map(ev=>{
        const x1=gX(chart,ev.startDate);
        const x2=gX(chart,ev.endDate);
        if(x1==null||x2==null)return null;
        if(x2<chartArea.left||x1>chartArea.right)return null;
        const cx1=Math.max(chartArea.left,Math.min(x1,chartArea.right));
        const cx2=Math.max(chartArea.left,Math.min(x2,chartArea.right));
        if(cx2-cx1<1)return null;
        const lx=Math.max(cx1+3,chartArea.left+2);
        if(lx>=chartArea.right-10)return null;
        const textW=ctx.measureText(ev.name).width+8; // ブラウザ実測値
        // 最も低い行でテキストが収まる行を探す
        let row=0;
        while(row<7&&rowEnds[row]>lx-3)row++;
        rowEnds[row]=lx+textW;
        return{ev,cx1,cx2,lx,row,x1,x2};
      }).filter(Boolean);

      // ── 2パス目：帯とラベルを描画 ──
      evMeta.forEach(({ev,cx1,cx2,lx,row,x1,x2})=>{
        const hl=hlEvent.includes(ev.id);
        // 帯
        ctx.fillStyle=hl?ev.color+'50':ev.color+'28';
        ctx.fillRect(cx1,chartArea.top,cx2-cx1,chartArea.bottom-chartArea.top);
        // 枠線
        ctx.strokeStyle=hl?ev.color+'cc':ev.color+'88';
        ctx.lineWidth=hl?2:1;ctx.setLineDash([]);
        if(x1>=chartArea.left&&x1<=chartArea.right){ctx.beginPath();ctx.moveTo(cx1,chartArea.top);ctx.lineTo(cx1,chartArea.bottom);ctx.stroke();}
        if(x2>=chartArea.left&&x2<=chartArea.right){ctx.beginPath();ctx.moveTo(cx2,chartArea.top);ctx.lineTo(cx2,chartArea.bottom);ctx.stroke();}
        // ラベル（paddingゾーン＝折れ線エリア上）
        const ly=chartArea.top-LABEL_ZONE_TOP+12+(row*LABEL_ROW_H);
        ctx.fillStyle=hl?ev.color:ev.color+'cc';
        ctx.font=(hl?'bold ':'')+'10px sans-serif';
        ctx.textAlign='left';
        if(_gEvtLabelMode==='normal'){
          ctx.fillText(ev.name,lx,ly);
        }else if(_gEvtLabelMode==='vertical'){
          const vx=Math.max(cx1+2,chartArea.left)+8;
          if(vx<chartArea.right-4){
            ctx.save();
            ctx.translate(vx,chartArea.top+4);
            ctx.rotate(Math.PI/2);
            ctx.textAlign='left';
            ctx.font=(hl?'bold ':'')+'9px sans-serif';
            const maxLen=chartArea.bottom-chartArea.top-8;
            const text=ev.name.length*9>maxLen?ev.name.slice(0,Math.floor(maxLen/9))+'…':ev.name;
            ctx.fillText(text,0,0);
            ctx.restore();
          }
        }
      });
      // メモ縦線
      activeNTS().forEach(n=>{
        const x=gX(chart,n.date);
        if(x==null||x<chartArea.left||x>chartArea.right)return;
        const hl=hlNote===n.date;
        ctx.strokeStyle=hl?'rgba(200,200,255,.95)':'rgba(140,135,160,.6)';
        ctx.lineWidth=hl?2.5:1;
        ctx.setLineDash(hl?[]:[3,3]);
        ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke();
        ctx.setLineDash([]);
        // 三角マーカー
        ctx.fillStyle=hl?'rgba(200,200,255,.95)':'rgba(140,135,160,.8)';
        ctx.beginPath();ctx.moveTo(x-6,chartArea.top);ctx.lineTo(x+6,chartArea.top);ctx.lineTo(x,chartArea.top+9);ctx.closePath();ctx.fill();
      });
      ctx.restore();
    }
  };

  const datasets=[];
  allInsts.forEach((inst,idx)=>{
    const b=BM[inst.masterBaseNo];
    const nm=(inst.nickname||(b?b[1]:'?'))+(inst.isKiwame?' 極':'');
    const col=getInstColor(inst.id); // チップ色と一致させる
    const sorted=[...inst.history].sort((a,bb)=>a.date.localeCompare(bb.date));
    if(_gAxisMode==='gain'){
      // 増加経験値モード：直前の記録との差分を棒グラフで表示
      const gainData=allDates.map(d=>{
        const i=sorted.findIndex(x=>x.date===d);
        if(i<=0)return null; // 記録なし or 初回記録（前回値が存在しない）
        return Math.round((sorted[i].cumExp-sorted[i-1].cumExp)/10000);
      });
      datasets.push({
        type:'bar',
        label:nm+' 増加Exp',
        data:gainData,
        backgroundColor:col+'aa',
        borderColor:col,
        borderWidth:1,
        yAxisID:'yGain',
      });
    }else{
      const tension=ST.smoothLine?0.3:0;
      const ptRExp=ST.alwaysShowPoints?4:0;
      const ptRLv=ST.alwaysShowPoints?(ST.subtleLv?2:3):0;
      const lvCol=ST.subtleLv?col+'88':col;
      datasets.push({
        label:nm+' Exp',
        data:allDates.map(d=>{const h=sorted.find(x=>x.date===d);return h?Math.round(h.cumExp/10000):null;}),
        borderColor:col,backgroundColor:col+'22',borderWidth:2.5,
        pointBackgroundColor:col,pointBorderColor:col,
        pointHoverBackgroundColor:col,pointHoverBorderColor:col,
        tension:tension,pointRadius:ptRExp,pointHoverRadius:6,yAxisID:'yExp',fill:false,spanGaps:true,
      });
      datasets.push({
        label:nm+' Lv',
        data:allDates.map(d=>{const h=sorted.find(x=>x.date===d);return h?h.level:null;}),
        borderColor:lvCol,backgroundColor:'transparent',
        pointBackgroundColor:lvCol,pointBorderColor:lvCol,
        pointHoverBackgroundColor:lvCol,pointHoverBorderColor:lvCol,
        borderDash:[5,4],borderWidth:ST.subtleLv?1:2,
        tension:tension,pointRadius:ptRLv,pointHoverRadius:5,
        yAxisID:'yLv',fill:false,spanGaps:true,
      });
    }
  });

  const labels=allDates.map(d=>{const[y,m,dd]=d.split('-');return m+'/'+dd;});

  // 全データセット（常にExp・Lv両方）を描画、_gHiddenDatasetsで個別表示制御
  datasets.forEach(ds=>{ds.hidden=_gHiddenDatasets.has(ds.label);});

  _gChart=new Chart(canvas,{
    type:'line',data:{labels,datasets},plugins:[evtPlugin,hoverHighlightPlugin],
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:60}}, // 期間メモラベル専用ゾーン（折れ線と完全分離）
      interaction:{mode:ST.tooltipNearest?'nearest':'index',intersect:false},
      onHover(event,elements,chart){
        const nearestEls=chart.getElementsAtEventForMode(event,'nearest',{intersect:false},true);
        let nearestIdx=nearestEls&&nearestEls.length>0?nearestEls[0].datasetIndex:-1;
        // 最近傍がLvデータセットなら、同じ刀のExpデータセットに翻訳（同一刀として扱う）
        if(nearestIdx>=0){
          const ds=chart.data.datasets[nearestIdx];
          if(ds&&ds.label&&ds.label.endsWith(' Lv')){
            const baseName=ds.label.slice(0,-3);
            const expDs=chart.data.datasets.find(d=>d.label===baseName+' Exp');
            if(expDs){
              const expIdx=chart.data.datasets.indexOf(expDs);
              if(chart.isDatasetVisible(expIdx))nearestIdx=expIdx;
            }
          }
        }
        chart._nearestDsIdx=nearestIdx; // tooltip強調用（常時追跡）
        if(!ST.hoverHighlight){
          if(chart._hoveredIdx!=null&&chart._hoveredIdx!==-1){chart._hoveredIdx=-1;chart.update('none');}
          return;
        }
        if(chart._hoveredIdx!==nearestIdx){chart._hoveredIdx=nearestIdx;chart.update('none');}
      },
      onClick(event,elements,chart){
        // メモ縦線クリック判定
        const rect=canvas.getBoundingClientRect();
        const x=event.native?event.native.clientX-rect.left:event.x;
        let nearest=null,minDist=14;
        activeNTS().forEach(n=>{
          const nx=gX(chart,n.date);
          if(nx==null)return;
          const dist=Math.abs(x-nx);
          if(dist<minDist){minDist=dist;nearest=n.date;}
        });
        if(nearest)setHlNote(nearest);
      },
      scales:_gAxisMode==='gain'?{
        x:{...(_gPanMin!==null?{min:_gPanMin,max:_gPanMax}:{}),grid:{color:gridCol},ticks:{color:textCol,font:{size:10},maxTicksLimit:14}},
        yGain:{type:'linear',position:'left',beginAtZero:true,
          title:{display:true,text:'増加経験値（万）',color:textCol,font:{size:10}},
          grid:{color:gridCol},ticks:{color:textCol,font:{size:10},callback:v=>v+'万'}
        },
      }:{
        x:{...(_gPanMin!==null?{min:_gPanMin,max:_gPanMax}:{}),grid:{color:gridCol},ticks:{color:textCol,font:{size:10},maxTicksLimit:14}},
        yExp:{type:'linear',position:'left',
          title:{display:true,text:'累積経験値（万）',color:textCol,font:{size:10}},
          grid:{color:gridCol},ticks:{color:textCol,font:{size:10},callback:v=>v+'万'}
        },
        yLv:{type:'linear',position:'right',min:1,
          title:{display:true,text:'Lv',color:textCol,font:{size:10}},
          grid:{display:false,color:gridCol},ticks:{color:textCol,font:{size:10}}
        },
      },
      plugins:{
        legend:{
          display:!!ST.showLegend,
          position:'bottom',
          labels:{
            color:textCol,
            font:{size:currentIsMobile()?9:10},
            boxWidth:currentIsMobile()?8:12,
            padding:currentIsMobile()?4:8,
          },
          onClick(e,legendItem,legend){
            // デフォルトのhide/show動作＋_gHiddenDatasetsに保存
            const label=legendItem.text;
            const chart=legend.chart;
            const idx=legendItem.datasetIndex;
            const meta=chart.getDatasetMeta(idx);
            meta.hidden=!meta.hidden;
            if(meta.hidden)_gHiddenDatasets.add(label);
            else _gHiddenDatasets.delete(label);
            chart.update();
          }
        },
        tooltip:{
          enabled:false,
          external:(ctx)=>{
            const {chart,tooltip}=ctx;
            const elId='g-custom-tooltip';
            let el=document.getElementById(elId);
            if(!el){
              el=document.createElement('div');
              el.id=elId;
              el.style.cssText='position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:100;min-width:100px;max-width:300px;';
              const par=chart.canvas.parentNode;
              par.style.position=par.style.position||'relative';
              par.appendChild(el);
            }
            if(tooltip.opacity===0){el.style.opacity='0';return;}
            const nearestIdx=chart._nearestDsIdx!=null?chart._nearestDsIdx:-1;
            const title=(tooltip.title&&tooltip.title[0])||'';
            const items=tooltip.dataPoints||[];
            const colors=tooltip.labelColors||[];
            const rows=items.map((item,i)=>{
              const isNearest=ST.tooltipHighlightNearest&&nearestIdx!==-1&&item.datasetIndex===nearestIdx;
              const col=(colors[i]&&colors[i].backgroundColor)||item.dataset.borderColor;
              const line=(tooltip.body&&tooltip.body[i]&&tooltip.body[i].lines&&tooltip.body[i].lines[0])||'';
              if(!line)return '';
              return `<div style="display:flex;align-items:center;gap:6px;padding:1px 0;${isNearest?'font-weight:700;':''}">
                <span style="display:inline-block;width:10px;height:10px;background:${col};border-radius:2px;flex-shrink:0"></span>
                <span>${line}</span></div>`;
            }).join('');
            el.innerHTML=`<div style="color:var(--text3);font-size:10px;margin-bottom:4px">${title}</div>${rows}`;
            el.style.opacity='1';
            const par=chart.canvas.parentNode;
            const pw=par.offsetWidth;const ph=par.offsetHeight;
            let x=tooltip.caretX+14;let y=tooltip.caretY-el.offsetHeight/2;
            if(x+el.offsetWidth>pw-10)x=tooltip.caretX-el.offsetWidth-14;
            if(y<0)y=0;if(y+el.offsetHeight>ph)y=ph-el.offsetHeight;
            el.style.left=x+'px';el.style.top=y+'px';
          },
          filter:(item)=>{
            // 「最も近い一振りのみ表示」モード時はフィルターしない（label側で統合表示）
            if(ST.tooltipNearest)return true;
            // ExpとLvが両方表示中の場合、Lv側はExp側でまとめて表示するのでスキップ
            if(!item.dataset.label||!item.dataset.label.endsWith(' Lv'))return true;
            const baseName=item.dataset.label.slice(0,-3);
            const datasets=item.chart.data.datasets;
            const expDs=datasets.find(ds=>ds.label===baseName+' Exp');
            if(!expDs)return true;
            const expIdx=datasets.indexOf(expDs);
            return !item.chart.isDatasetVisible(expIdx); // Expが非表示の時のみLvを表示
          },
          callbacks:{
            labelColor:ctx=>{
              // Lvを経由した場合もExpの色で揃える（同一刀として一貫表示）
              let ds=ctx.dataset;
              if(ds.label&&ds.label.endsWith(' Lv')){
                const baseName=ds.label.slice(0,-3);
                const expDs=ctx.chart.data.datasets.find(d=>d.label===baseName+' Exp');
                if(expDs)ds=expDs;
              }
              return {backgroundColor:ds.borderColor,borderColor:ds.borderColor};
            },
            label:ctx=>{
            const v=ctx.parsed.y;if(v==null)return null;
            if(ctx.dataset.yAxisID==='yGain'){
              return ctx.dataset.label.replace(' 増加Exp','')+'  +'+Math.round(v)+'万exp';
            }
            // Exp+Lv統合表示：表示中のものだけスラッシュ区切りで並べる
            let baseName;
            if(ctx.dataset.label.endsWith(' Exp'))baseName=ctx.dataset.label.slice(0,-4);
            else if(ctx.dataset.label.endsWith(' Lv'))baseName=ctx.dataset.label.slice(0,-3);
            else baseName=ctx.dataset.label;
            const datasets=ctx.chart.data.datasets;
            const expDs=datasets.find(ds=>ds.label===baseName+' Exp');
            const lvDs=datasets.find(ds=>ds.label===baseName+' Lv');
            const expIdx=expDs?datasets.indexOf(expDs):-1;
            const lvIdx=lvDs?datasets.indexOf(lvDs):-1;
            const expVisible=expDs&&ctx.chart.isDatasetVisible(expIdx);
            const lvVisible=lvDs&&ctx.chart.isDatasetVisible(lvIdx);
            const expVal=expVisible?expDs.data[ctx.dataIndex]:null;
            const lvVal=lvVisible?lvDs.data[ctx.dataIndex]:null;
            const parts=[];
            if(expVal!=null)parts.push(Math.round(expVal)+'万exp');
            if(lvVal!=null)parts.push('Lv.'+lvVal);
            return baseName+'  '+parts.join(' / ');
          }}
        }
      }
    }
  });
  attachChartTouch(_gChart,()=>_gAllDates,(mn,mx)=>{_gPanMin=mn;_gPanMax=mx;});
}

// ══ 審神者タブ ════════════════════════════════════════════
const SANIWA_MAX_LV=450;
function saniwaSorted(){return [...(UD.saniwaLog||[])].sort((a,b)=>a.date.localeCompare(b.date));}
function saniwaLatest(){const s=saniwaSorted();return s.length?s[s.length-1]:null;}
// 同日記録は上書き。レベル下限1（上限なし＝今後のレベル上限引き上げに対応）
function saniwaRecord(date,level){
  level=parseInt(String(level).replace(/[^\d]/g,''),10);
  if(!date||isNaN(level)||level<1){toast('レベルを正しく入力してください');return false;}
  if(!UD.saniwaLog)UD.saniwaLog=[];
  const idx=UD.saniwaLog.findIndex(r=>r.date===date);
  if(idx>=0)UD.saniwaLog[idx].level=level;
  else UD.saniwaLog.push({date,level});
  UD.saniwaLog.sort((a,b)=>a.date.localeCompare(b.date));
  save();
  return true;
}
function saniwaPlus1(){
  const cur=saniwaLatest();
  const base=cur?cur.level:0;
  if(saniwaRecord(todayStr(),base+1)){renderGraphBody();toast('審神者 Lv.'+(base+1)+' を記録しました');}
}
function saniwaManualRecord(){
  const d=document.getElementById('sn-recdate').value;
  const lv=document.getElementById('sn-level').value;
  if(saniwaRecord(d,lv)){renderGraphBody();toast('記録しました');}
}
function saniwaDelete(date){
  showCF(fmtDate(date)+' の記録を削除しますか？','削除',()=>{
    UD.saniwaLog=(UD.saniwaLog||[]).filter(r=>r.date!==date);
    save();cM();renderGraphBody();toast('削除しました');
  });
}
function setSaniwaPeriod(p){_gPeriod=p;_saniwaPanMin=null;_saniwaPanMax=null;renderGraphBody();}

function renderGSaniwa(body){
  try{
  if(_saniwaChart){_saniwaChart.destroy();_saniwaChart=null;}
  const log=saniwaSorted();
  const latest=saniwaLatest();
  const curLv=latest?latest.level:null;
  const curDate=latest?fmtDate(latest.date):'';
  const periodBtns=PERIODS.map(p=>`<button class="btn sm ${_gPeriod===p.k?'on':''}" onclick="setSaniwaPeriod('${p.k}')">${p.l}</button>`).join('')
    +(_saniwaPanMin!==null?`<button class="btn sm" onclick="_saniwaPanMin=null;_saniwaPanMax=null;renderGraphBody()" title="ズームリセット" style="margin-left:4px">🔍×</button>`:'');
  const evtLabelBtns=[{k:'normal',l:'通常'},{k:'none',l:'非表示'},{k:'vertical',l:'縦書き'}]
    .map(m=>`<button class="btn sm ${_gEvtLabelMode===m.k?'on':''}" onclick="setEvtLabelMode('${m.k}')">${m.l}</button>`).join('');

  const header=`
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px">
    <div>
      <div style="font-size:12px;color:var(--text2)">審神者　現在</div>
      <div style="font-size:30px;font-weight:700;color:var(--text);line-height:1.1">${curLv!=null?'Lv.<span style="font-size:36px">'+curLv+'</span>':'<span style="font-size:18px;color:var(--text3)">未記録</span>'}</div>
      ${curLv!=null?`<div style="font-size:11px;color:var(--text3)">最終記録 ${curDate}</div>`:''}
    </div>
    <button class="btn" onclick="saniwaPlus1()" style="height:44px;padding:0 18px;font-size:15px;font-weight:600;color:var(--kiwame);border-color:var(--kiwame)">＋ 今日 +1 Lv</button>
    <div style="display:flex;align-items:flex-end;gap:6px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r)">
      <div>
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px">日付</div>
        <button type="button" class="cal-pick-btn" onclick="openCalPicker('sn-recdate',this)"><span id="sn-recdate-text">${todayStr()}</span> <span style="font-size:11px;opacity:.5">📅</span></button>
        <input type="hidden" id="sn-recdate" value="${todayStr()}">
      </div>
      <div>
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px">Lv</div>
        <input class="finput" id="sn-level" type="text" ${currentIsMobile()?'inputmode="numeric"':''} value="${curLv!=null?curLv:''}" placeholder="例 123" style="width:64px" lang="ja" oninput="fmtN(this,event)" oncompositionend="fmtN(this)">
      </div>
      <button class="btn sm" onclick="saniwaManualRecord()" style="height:32px">記録</button>
    </div>
  </div>`;

  const noData=!log.length?`<div class="no-data">📝 まだ記録がありません。<br>「＋ 今日 +1 Lv」か、日付＋Lvを入力して「記録」で追加できます。</div>`:'';
  const listRows=log.length?[...log].reverse().map(r=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:12px;border-bottom:1px solid var(--border)"><div style="min-width:70px;color:var(--text3)">${fmtDate(r.date)}</div><div style="flex:1;font-weight:600;color:var(--text)">Lv.${r.level}</div><button class="btn sm danger" style="padding:1px 8px;font-size:10px" onclick="saniwaDelete('${r.date}')">削除</button></div>`).join(''):`<div style="font-size:11px;color:var(--text3)">記録なし</div>`;

  body.innerHTML=
    header
    +`<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;flex-wrap:wrap"><span style="font-size:10px;color:var(--text3);margin-right:2px">期間メモ表示：</span>${evtLabelBtns}</div>`
    +`<div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px">${periodBtns}</div>`
    +`<div class="saniwa-chart-wrap">${noData}<canvas id="snCanvas" style="display:${log.length?'block':'none'}"></canvas></div>`
    +`<div style="margin-top:10px"><div class="gsect" style="margin-bottom:4px">記録一覧（同じ日に記録すると上書き）</div>${listRows}</div>`
    +`<div style="font-size:11px;color:var(--text3);margin-top:8px">💡 期間メモ・日メモは刀グラフと共通です。「期間メモ・日メモ」タブから追加・編集できます。</div>`;

  if(log.length) setTimeout(drawSaniwaChart,10);
  }catch(e){console.error('renderGSaniwa error:',e);if(body)body.innerHTML='<div style="padding:12px;color:var(--text2);font-size:12px">表示エラーが発生しました。</div>';}
}

function drawSaniwaChart(){
  if(_saniwaChart){_saniwaChart.destroy();_saniwaChart=null;}
  const canvas=document.getElementById('snCanvas');
  if(!canvas)return;
  const log=saniwaSorted();
  if(!log.length)return;
  const now=new Date();
  let filterFrom=null;
  if(_gPeriod==='1w'){filterFrom=new Date(now);filterFrom.setDate(filterFrom.getDate()-7);}
  else if(_gPeriod==='1m'){filterFrom=new Date(now);filterFrom.setMonth(filterFrom.getMonth()-1);}
  else if(_gPeriod==='3m'){filterFrom=new Date(now);filterFrom.setMonth(filterFrom.getMonth()-3);}
  else if(_gPeriod==='6m'){filterFrom=new Date(now);filterFrom.setMonth(filterFrom.getMonth()-6);}
  const fromStr=filterFrom?filterFrom.toISOString().slice(0,10):null;
  const dateSet=new Set(log.map(r=>r.date));
  activeEVS().forEach(ev=>{if(ev.startDate)dateSet.add(ev.startDate);if(ev.endDate)dateSet.add(ev.endDate);});
  activeNTS().forEach(n=>{if(n.date)dateSet.add(n.date);});
  let allDates=[...dateSet].sort();
  if(fromStr)allDates=allDates.filter(d=>d>=fromStr);
  if(!allDates.length)return;
  _saniwaAllDates=allDates;

  function gX(chart,d){
    const sc=chart.scales.x;
    const i=allDates.indexOf(d);
    if(i>=0)return sc.getPixelForValue(i);
    let bi=-1,bd=Infinity;
    allDates.forEach((l,j)=>{const df=Math.abs(+new Date(l)-+new Date(d));if(df<bd){bd=df;bi=j;}});
    if(bi<0)return null;
    const step=allDates.length>1?sc.getPixelForValue(1)-sc.getPixelForValue(0):0;
    return sc.getPixelForValue(bi)+(+new Date(d)-+new Date(allDates[bi]))/86400000*step;
  }
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#378ADD';
  const dark=resolveThemeAttr().endsWith('-dark');
  const gridCol=dark?'rgba(200,180,140,.12)':'rgba(100,80,50,.1)';
  const textCol=dark?'#a09070':'#7a6a58';

  // 期間メモ・日メモ overlay（刀グラフと共通の挙動・共通データ）
  const evtPlugin={
    id:'snEvtBg',
    beforeDraw(chart){
      const{ctx,chartArea,scales}=chart;
      if(!scales.x||!chartArea)return;
      ctx.save();
      const events=activeEVS();
      const LABEL_ZONE_TOP=60,LABEL_ROW_H=13;
      ctx.font='10px sans-serif';
      const rowEnds=new Array(8).fill(-Infinity);
      const evMeta=events.map(ev=>{
        const x1=gX(chart,ev.startDate),x2=gX(chart,ev.endDate);
        if(x1==null||x2==null)return null;
        if(x2<chartArea.left||x1>chartArea.right)return null;
        const cx1=Math.max(chartArea.left,Math.min(x1,chartArea.right));
        const cx2=Math.max(chartArea.left,Math.min(x2,chartArea.right));
        if(cx2-cx1<1)return null;
        const lx=Math.max(cx1+3,chartArea.left+2);
        if(lx>=chartArea.right-10)return null;
        const textW=ctx.measureText(ev.name).width+8;
        let row=0;while(row<7&&rowEnds[row]>lx-3)row++;rowEnds[row]=lx+textW;
        return{ev,cx1,cx2,lx,row,x1,x2};
      }).filter(Boolean);
      evMeta.forEach(({ev,cx1,cx2,lx,row,x1,x2})=>{
        const hl=hlEvent.includes(ev.id);
        ctx.fillStyle=hl?ev.color+'50':ev.color+'28';
        ctx.fillRect(cx1,chartArea.top,cx2-cx1,chartArea.bottom-chartArea.top);
        ctx.strokeStyle=hl?ev.color+'cc':ev.color+'88';
        ctx.lineWidth=hl?2:1;ctx.setLineDash([]);
        if(x1>=chartArea.left&&x1<=chartArea.right){ctx.beginPath();ctx.moveTo(cx1,chartArea.top);ctx.lineTo(cx1,chartArea.bottom);ctx.stroke();}
        if(x2>=chartArea.left&&x2<=chartArea.right){ctx.beginPath();ctx.moveTo(cx2,chartArea.top);ctx.lineTo(cx2,chartArea.bottom);ctx.stroke();}
        const ly=chartArea.top-LABEL_ZONE_TOP+12+(row*LABEL_ROW_H);
        ctx.fillStyle=hl?ev.color:ev.color+'cc';
        ctx.font=(hl?'bold ':'')+'10px sans-serif';ctx.textAlign='left';
        if(_gEvtLabelMode==='normal'){ctx.fillText(ev.name,lx,ly);}
        else if(_gEvtLabelMode==='vertical'){
          const vx=Math.max(cx1+2,chartArea.left)+8;
          if(vx<chartArea.right-4){ctx.save();ctx.translate(vx,chartArea.top+4);ctx.rotate(Math.PI/2);ctx.textAlign='left';ctx.font=(hl?'bold ':'')+'9px sans-serif';const maxLen=chartArea.bottom-chartArea.top-8;const text=ev.name.length*9>maxLen?ev.name.slice(0,Math.floor(maxLen/9))+'…':ev.name;ctx.fillText(text,0,0);ctx.restore();}
        }
      });
      activeNTS().forEach(n=>{
        const x=gX(chart,n.date);
        if(x==null||x<chartArea.left||x>chartArea.right)return;
        const hl=hlNote===n.date;
        ctx.strokeStyle=hl?'rgba(200,200,255,.95)':'rgba(140,135,160,.6)';
        ctx.lineWidth=hl?2.5:1;ctx.setLineDash(hl?[]:[3,3]);
        ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle=hl?'rgba(200,200,255,.95)':'rgba(140,135,160,.8)';
        ctx.beginPath();ctx.moveTo(x-6,chartArea.top);ctx.lineTo(x+6,chartArea.top);ctx.lineTo(x,chartArea.top+9);ctx.closePath();ctx.fill();
      });
      ctx.restore();
    }
  };

  const labels=allDates.map(d=>{const[y,m,dd]=d.split('-');return m+'/'+dd;});
  const data=allDates.map(d=>{const r=log.find(x=>x.date===d);return r?r.level:null;});
  // Y軸上限：基本は450。記録値が450を超える場合は50刻みで自動拡張（将来のレベル上限引き上げに対応）
  const maxLv=log.reduce((m,r)=>Math.max(m,r.level||0),0);
  const yMax=maxLv>SANIWA_MAX_LV?Math.ceil(maxLv/50)*50:SANIWA_MAX_LV;
  const tension=ST.smoothLine?0.3:0;
  const ptR=ST.alwaysShowPoints?4:0;

  _saniwaChart=new Chart(canvas,{
    type:'line',
    data:{labels,datasets:[{
      label:'審神者 Lv',data,
      borderColor:accent,backgroundColor:accent+'22',borderWidth:2.5,
      pointBackgroundColor:accent,pointBorderColor:accent,pointHoverBackgroundColor:accent,pointHoverBorderColor:accent,
      tension:tension,pointRadius:ptR,pointHoverRadius:6,fill:false,spanGaps:true,
    }]},
    plugins:[evtPlugin],
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:60}},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>ctx.parsed.y!=null?'審神者 Lv.'+ctx.parsed.y:null}}
      },
      scales:{
        x:{grid:{color:gridCol},ticks:{color:textCol,maxRotation:0,autoSkip:true,maxTicksLimit:10},
           min:_saniwaPanMin!=null?_saniwaPanMin:undefined,max:_saniwaPanMax!=null?_saniwaPanMax:undefined},
        y:{min:0,max:yMax,grid:{color:gridCol},ticks:{color:textCol,stepSize:50}}
      }
    }
  });
  attachChartTouch(_saniwaChart,()=>_saniwaAllDates,(mn,mx)=>{_saniwaPanMin=mn;_saniwaPanMax=mx;});
}

      }

// ── タッチ操作（スワイプ/ピンチ）共通ハンドラ ─────────────────
// chart: Chart.jsインスタンス
// getAllDates: ()=>日付配列
// onSaveRange: (min,max)=>保存コールバック
function attachChartTouch(chart,getAllDates,onSaveRange){
  if(!chart||!chart.canvas)return;
  const canvas=chart.canvas;
  let t1x=null,t1y=null,t2x=null;
  let startMin=null,startMax=null,startDist=null;
  let isHorizontal=null; // null=未判定, true=横, false=縦

  function getCurRange(){
    const dates=getAllDates();
    const total=dates.length;
    const xsc=chart.scales&&chart.scales.x;
    if(!xsc)return{min:0,max:total-1,total};
    // Chart.js4: category scaleではmin/maxがオプション値、実際の表示範囲はmin/max
    const mn=Math.max(0,Math.round(xsc.min??0));
    const mx=Math.min(total-1,Math.round(xsc.max??(total-1)));
    return{min:mn,max:mx,total};
  }

  function applyRange(min,max){
    const total=getAllDates().length;
    min=Math.max(0,min);
    max=Math.min(total-1,max);
    if(max-min<1)return;
    if(!chart.options||!chart.options.scales||!chart.options.scales.x)return;
    chart.options.scales.x.min=Math.round(min);
    chart.options.scales.x.max=Math.round(max);
    try{chart.update('none');}catch(e){}
  }

  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      const r=getCurRange();
      t1x=e.touches[0].clientX; t1y=e.touches[0].clientY;
      t2x=null; startDist=null;
      startMin=r.min; startMax=r.max;
      isHorizontal=null;
      // touchstartではpreventDefaultしない（縦スクロールを妨げないため）
    }else if(e.touches.length===2){
      const r=getCurRange();
      t1x=e.touches[0].clientX; t1y=e.touches[0].clientY;
      t2x=e.touches[1].clientX;
      startDist=Math.abs(t1x-t2x);
      startMin=r.min; startMax=r.max;
      isHorizontal=null;
      e.preventDefault(); // ピンチは常にpreventDefault
    }
  },{passive:false});

  canvas.addEventListener('touchmove',e=>{
    if(e.touches.length>=2&&startDist!==null){
      // ピンチズーム
      e.preventDefault();
      const d=Math.abs(e.touches[0].clientX-e.touches[1].clientX);
      if(d<5)return;
      const scale=startDist/d; // >1=ズームイン（指を閉じる）, <1=ズームアウト
      const center=(startMin+startMax)/2;
      const range=startMax-startMin;
      const newRange=Math.max(2,Math.min(getAllDates().length-1,range*scale));
      applyRange(center-newRange/2,center+newRange/2);
    }else if(e.touches.length===1&&t1x!==null){
      // 方向判定（初回のみ）
      const dx=e.touches[0].clientX-t1x;
      const dy=e.touches[0].clientY-t1y;
      if(isHorizontal===null){
        if(Math.abs(dx)>8||Math.abs(dy)>8){
          isHorizontal=Math.abs(dx)>Math.abs(dy);
        }
      }
      if(!isHorizontal)return; // 縦スクロールは親に任せる
      e.preventDefault();
      // スワイプパン
      const w=canvas.clientWidth||300;
      const range=startMax-startMin;
      if(range<=0)return;
      const perPx=range/w;
      const shift=-dx*perPx;
      const total=getAllDates().length;
      const newMin=Math.max(0,Math.min(total-1-range,startMin+shift));
      applyRange(newMin,newMin+range);
    }
  },{passive:false});

  canvas.addEventListener('touchend',e=>{
    if(e.touches.length===0){
      // 指が全部離れたら状態を保存
      const xsc=chart.scales&&chart.scales.x;
      if(xsc&&(xsc.min!=null||xsc.max!=null)){
        const total=getAllDates().length;
        const mn=Math.max(0,Math.round(xsc.min??0));
        const mx=Math.min(total-1,Math.round(xsc.max??(total-1)));
        // 全範囲ならnullに戻す
        if(mn<=0&&mx>=total-1) onSaveRange(null,null);
        else onSaveRange(mn,mx);
      }
      t1x=null;t1y=null;t2x=null;startDist=null;startMin=null;startMax=null;isHorizontal=null;
    }else if(e.touches.length===1){
      // 2本→1本: ピンチ終了、現在位置から再スワイプ可能に
      const r=getCurRange();
      t1x=e.touches[0].clientX; t1y=e.touches[0].clientY;
      t2x=null; startDist=null;
      startMin=r.min; startMax=r.max;
      isHorizontal=null;
    }
  },{passive:false});

  canvas.addEventListener('touchcancel',()=>{
    t1x=null;t1y=null;t2x=null;startDist=null;startMin=null;startMax=null;isHorizontal=null;
  });
}
function openInstPick(){

function renderInstPickControls(){

    {k:'updated',l:'更新順'},{k:'type',l:'種類順'},{k:'no',l:'No順'},
    {k:'lvAsc',l:'Lv↑'},{k:'lvDesc',l:'Lv↓'},
  ].map(s=>`<button class="btn sm ${_pickSort===s.k?'on':''}" onclick="setPickSort('${s.k}')">${s.l}</button>`).join('');

   +`<button class="btn sm ${_pickKiwame==='ki'?'on':''}" onclick="setPickKiwame('ki')">極のみ</button>`;

    typeBtns.innerHTML=`<button class="btn sm ${isAll?'on':''}" onclick="setPickTypesAll()">全種</button>`
      +TO.map(t=>{

function setPickSort(s){_pickSort=s;renderInstPickControls();renderInstPickList();}
function setPickKiwame(v){_pickKiwame=v;renderInstPickControls();renderInstPickList();}
function setPickTypesAll(){_pickTypes=null;renderInstPickControls();renderInstPickList();}
function togglePickType(t){
  if(_pickTypes===null){
    _pickTypes=[t];
  } else {
    const idx=_pickTypes.indexOf(t);
    if(idx>=0){
      _pickTypes.splice(idx,1);
      if(_pickTypes.length===0)_pickTypes=null;
    } else {
      _pickTypes.push(t);
      if(TO.every(type=>_pickTypes.includes(type)))_pickTypes=null;
    }
  }
  renderInstPickControls();renderInstPickList();
}

function renderInstPickList(){
  const q=(document.getElementById('instPickSearch').value||'').trim().toLowerCase();
  const el=document.getElementById('instPickList');
  if(!UD.instances.length){el.innerHTML=`<div class="no-data">刀が登録されていません</div>`;return;}
  let insts=sortInsts(UD.instances,_pickSort);
  // 極/初フィルター
  if(_pickKiwame==='ki')insts=insts.filter(i=>i.isKiwame);
  else if(_pickKiwame==='sho')insts=insts.filter(i=>!i.isKiwame);
  // 刀種フィルター（複数選択対応）
  if(_pickTypes!==null)insts=insts.filter(i=>_pickTypes.includes(getInstType(i)));
  // テキスト検索
  if(q)insts=insts.filter(i=>{
    const nm=(i.nickname||getInstBaseName(i))+(i.isKiwame?' 極':'');
    return nm.toLowerCase().includes(q)||getInstType(i).includes(q);
  });
  const rows=insts.map(i=>{
    const nm=(i.nickname||getInstBaseName(i))+(i.isKiwame?' 極':'');
    const type=getInstType(i);
    const col=getInstColor(i.id);
    const sel=_gSelIds.includes(i.id);
    const hasRec=i.history&&i.history.length>0;
    const lastDate=hasRec?lastUpdatedDate(i):'';
    return`<div onclick="instPickToggle('${i.id}')" style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer;background:${sel?'rgba(0,0,0,.04)':'transparent'}">
      <div style="width:12px;height:12px;border-radius:50%;background:${col};flex-shrink:0;border:2px solid ${sel?col:'var(--border2)'}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:${sel?600:400};color:${sel?'var(--accent)':'var(--text)'}">${nm}</div>
        <div style="font-size:10px;color:var(--text3)">${type}${lastDate?' · '+fmtDate(lastDate):'　記録なし'}</div>
      </div>
      <span style="font-size:16px;color:${sel?'var(--accent)':'var(--border2)'}">${sel?'☑':'☐'}</span>
    </div>`;
  }).join('');
  el.innerHTML=rows||`<div class="no-data">該当なし</div>`;
}
function renderInstPickSelected(){
  const el=document.getElementById('instPickSelected');
  if(!el)return;
  const chips=[..._gSelIds].map(id=>{
    const i=UD.instances.find(x=>x.id===id);if(!i)return'';
    const b=BM[i.masterBaseNo];
    const nm=(i.nickname||(b?b[1]:'?'))+(i.isKiwame?' 極':'');

    return`<span class="inst-chip sel" style="background:${col};border-color:${col};font-size:11px">${nm}<span onclick="instPickToggle('${id}')" style="margin-left:3px;opacity:.8;cursor:pointer">×</span></span>`;
  }).join('');
  el.innerHTML=chips||`<span style="font-size:11px;color:var(--text3)">なし</span>`;
}
function instPickToggle(id){
  const idx=_gSelIds.indexOf(id);

  renderInstPickList();
  renderInstPickSelected();

function instPickSelAll(){
  let targets=sortInsts(UD.instances.filter(i=>i.history&&i.history.length),_pickSort);

function addHistRec(){
  const id=document.getElementById('h-inst').value;
  const date=document.getElementById('h-date').value;
  const exp=parseInt(document.getElementById('h-exp').value)||0;
  const lv=parseInt(document.getElementById('h-lv').value)||1;
  const note=document.getElementById('h-note').value.trim();
  if(!date){toast('日付を入力してください');return;}
  if(!exp){toast('累積経験値を入力してください');return;}
  const inst=UD.instances.find(i=>i.id===id);if(!inst)return;
  if(!inst.history)inst.history=[];
  const existing=inst.history.findIndex(h=>h.date===date);
  const rec={date,cumExp:exp,level:lv,note,auto:false};
  if(existing>=0)inst.history[existing]=rec;
  else inst.history.push(rec);
  inst.history.sort((a,b)=>a.date.localeCompare(b.date));
  // 最新値をinstに反映
  const latest=inst.history[inst.history.length-1];
  inst.cumExp=latest.cumExp;inst.level=latest.level;
  _gSelIds.push(id); // グラフに自動選択（重複回避）
  if(_gSelIds.filter(x=>x===id).length>1)_gSelIds.splice(_gSelIds.indexOf(id),1);
  _gRecentInstId=id; // 最近記録した刀として記録
  save();
  // グラフタブへ移動
  _gTab='chart';
  renderGraphBody();
  toast('記録を追加しました');
}

function delHistRec(instId,date){
  const inst=UD.instances.find(i=>i.id===instId);if(!inst)return;
  inst.history=inst.history.filter(h=>h.date!==date);
  if(inst.history.length){
    const latest=inst.history[inst.history.length-1];

// ── Google Sign-In ライブラリ読み込み完了を待機 ──
async function waitForGoogleAccounts(maxWaitMs=5000){
  const startTime=Date.now();
  while(!window.google||!window.google.accounts||!window.google.accounts.oauth2){
    if(Date.now()-startTime>maxWaitMs){
      console.error('Google Sign-In library failed to load');
      throw new Error('Google Sign-In library timeout');
    }
    await new Promise(resolve=>setTimeout(resolve,100));
  }
}

function gdSignIn(){
  // Google Sign-In ライブラリが利用可能か確認
  if(!window.google||!window.google.accounts||!window.google.accounts.oauth2){
    // ライブラリが未ロードの場合、非同期で再試行
    waitForGoogleAccounts().then(()=>gdSignIn()).catch(()=>{
      toast('Google Sign-In ライブラリの読み込みに失敗しました（リロードしてください）');
    });
    return;
  }
  
  // Firefox でサードパーティクッキー制限がある場合の警告
  const isFirefox=/Firefox/.test(navigator.userAgent);
  
  const client=google.accounts.oauth2.initTokenClient({
    client_id:GD_CLIENT_ID,
    scope:GD_SCOPE,
    callback:(resp)=>{
      if(resp.error){
        console.error('[Google Auth Error]',resp.error);
        if(isFirefox&&resp.error==='popup_closed_by_user'){
          toast('Firefoxでクッキーが許可されていない可能性があります。設定で確認してください。');
        }else{
          toast('Googleログイン失敗：'+resp.error);
        }
        return;
      }
      _gdToken=resp.access_token;
      sessionStorage.setItem('gd_token',_gdToken);
      saveST();
      updatePcSyncHdr();
      updateMobileHdr2Sync();
      // A案・B案 両方：ログイン後にクラウドとの差分をチェック（gdStartupCheck内で判断）
      toast('Googleログインしました');
      gdStartupCheck();
    }
  });
  client.requestAccessToken();
}

function gdSignOut(){

// ── サイレントリフレッシュ：UIなしで新しいトークンを取得 ──
// ユーザーがGoogleにログインしたままで、かつ過去にこのアプリを許可していれば成功する。
// 失敗時はreject→従来の「再ログインしてください」フローへフォールバック。
function gdSilentRefresh(){
  return new Promise((resolve,reject)=>{
    if(!window.google||!window.google.accounts||!window.google.accounts.oauth2){
      reject(new Error('Library not loaded'));return;
    }
    let done=false;
    const timer=setTimeout(()=>{
      if(!done){done=true;reject(new Error('timeout'));}
    },3000);
    try{
      const client=google.accounts.oauth2.initTokenClient({
        client_id:GD_CLIENT_ID,
        scope:GD_SCOPE,
        callback:(resp)=>{
          if(done)return;done=true;clearTimeout(timer);
          if(resp.error){reject(new Error(resp.error));return;}
          _gdToken=resp.access_token;
          sessionStorage.setItem('gd_token',_gdToken);
          resolve(_gdToken);
        },
        error_callback:(err)=>{
          if(done)return;done=true;clearTimeout(timer);
          reject(new Error((err&&err.type)||'silent_failed'));
        }
      });
      client.requestAccessToken({prompt:''});
    }catch(e){
      if(done)return;done=true;clearTimeout(timer);
      reject(e);
    }
  });
}

async function gdFetch(url,opts,isRetry){
  try{
    const o=Object.assign({},opts,{headers:Object.assign({},opts.headers,{'Authorization':'Bearer '+_gdToken})});
    const res=await fetch(url,o);
    if(res.status===401&&!isRetry){
      // サイレントリフレッシュを試行（成功すれば新トークンで再試行、失敗時のみ再ログイン要求）
      try{
        await gdSilentRefresh();
        updatePcSyncHdr();updateMobileHdr2Sync();
        return gdFetch(url,opts,true);
      }catch(refreshErr){
        console.warn('Silent refresh failed:',refreshErr.message);
        _gdToken=null;
        sessionStorage.removeItem('gd_token');
        ra();updatePcSyncHdr();updateMobileHdr2Sync();
        toast('セッションが切れました。再ログインしてください');
        throw new Error('401 Unauthorized');
      }
    }
    return res;
  }catch(e){
    // Firefoxでのネットワークエラーやコンテンツセキュリティポリシーエラーを検出
    console.error('[Google Drive Sync Error]',e);
    if(e.message.includes('Failed to fetch')||e.message.includes('NetworkError')){
      console.warn('Firefox CORS or network issue detected');
      throw new Error('ネットワークエラーまたはセキュリティ設定により通信に失敗：'+e.message);
    }
    throw e;
  }
}

async function gdFindFile(){
  try{
    const res=await gdFetch(
      `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${GD_FILENAME}'&fields=files(id,name)`,
      {headers:{}}
    );
    if(!res.ok){
      console.error('[gdFindFile] HTTP Error:',res.status,res.statusText);
      return null;
    }
    const d=await res.json();
    return d.files&&d.files.length?d.files[0].id:null;
  }catch(e){
    console.error('[gdFindFile] Error:',e);
    return null;
  }
}

async function gdSyncDown(fromLogin=false){
  if(!_gdToken){toast('先にGoogleログインしてください');return false;}
  try{
    toast('クラウドから読み込み中…');
    const fid=await gdFindFile();
    if(!fid){
      // ファイルなし＝初回→ローカルをアップロード
      const ok=await gdSyncUp(true);
      toast(ok===false?'クラウドへの保存に失敗しました':'クラウドに初回バックアップしました');
      return ok!==false;
    }
    _gdFileId=fid;
    const res=await gdFetch(
      `https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,
      {headers:{}}
    );
    if(!res.ok){
      console.error('[gdSyncDown] HTTP Error:',res.status,res.statusText);
      throw new Error('download failed: '+res.status+' '+res.statusText);
    }
    let d;
    try{d=await res.json();}catch(pe){
      console.error('[gdSyncDown] JSON parse error:',pe);
      toast('クラウドのデータを読み取れませんでした（ローカルを使用）');
      return false;
    }
    if(!d||!Array.isArray(d.instances)){
      // データが壊れている／想定外フォーマット
      toast('クラウドのデータが読み込めない形式でした（ローカルを使用）');
      return false;
    }
    const localUpdatedAt=UD.updatedAt||0;
    const cloudUpdatedAt=d.updatedAt||0;
    // B案の再ログイン時のみupdatedAt比較でinstances保護。手動「⬇ 読み込む」は常に全読み込み
    if(fromLogin&&localUpdatedAt>cloudUpdatedAt){
      // ローカルの方が新しい→instancesは上書きしない（events/notesのみマージ）
      if(d.events&&Array.isArray(d.events)){
        const evKF=ev=>ev.name+'||'+(ev.start||ev.startDate||'')+'||'+(ev.end||ev.endDate||'');
        const evMap={};
        (UD.events||[]).forEach(ev=>{evMap[evKF(ev)]=ev;});
        d.events.forEach(ev=>{
          const norm={name:ev.name,start:ev.start||ev.startDate||'',end:ev.end||ev.endDate||'',
            color:ev.color||'#8888ff',updatedAt:ev.updatedAt||0,deleted:!!ev.deleted,source:ev.source||''};
          const k=evKF(norm);
          if(!evMap[k]||(norm.updatedAt||0)>(evMap[k].updatedAt||0))evMap[k]=norm;
        });
        UD.events=Object.values(evMap).map(ev=>{if(!ev.id)ev.id='ev'+Date.now()+Math.random().toString(36).slice(2);if(!ev.memo)ev.memo='';if(ev.start&&!ev.startDate)ev.startDate=ev.start;if(ev.end&&!ev.endDate)ev.endDate=ev.end;return ev;});
      }
      if(d.notes&&Array.isArray(d.notes)){
        const ntKF=n=>n.date+'||'+n.text;
        const ntMap={};
        (UD.notes||[]).forEach(n=>{ntMap[ntKF(n)]=n;});
        d.notes.forEach(n=>{
          const norm={date:n.date,text:n.text,updatedAt:n.updatedAt||0,deleted:!!n.deleted,source:n.source||''};
          const k=ntKF(norm);
          if(!ntMap[k]||(norm.updatedAt||0)>(ntMap[k].updatedAt||0))ntMap[k]=norm;
        });
        UD.notes=Object.values(ntMap).map(n=>{if(!n.id)n.id='n'+Date.now()+Math.random().toString(36).slice(2);return n;});
      }
      loadShared();
      save();ra();
      toast('ローカルの方が新しいため、クラウドへの保存をおすすめします');
    }else{
      // クラウドの方が新しい（または同じ）→丸ごと読み込み（updatedAtはクラウドの値を保持）
      applyCloudData(d);
      toast(fromLogin?'クラウドからデータを読み込みました':'同期しました ↓');
    }
    return true;
  }catch(e){
    console.error('[gdSyncDown] Error:',e);
    toast('同期失敗：'+e.message);
    return false;
  }
}

async function gdSyncUp(silent=false){
  if(!_gdToken){toast('先にGoogleログインしてください');return false;}
  try{
    if(!silent)toast('クラウドへ保存中…');
    // 保存前にDriveからevents/notesをフェッチしてupdatedAtマージ
    const fid=_gdFileId||(await gdFindFile());
    if(fid){
      try{
        const fetchRes=await gdFetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,{headers:{}});
        if(fetchRes.ok){
          const cloudUD=await fetchRes.json();
          // events: updatedAtマージ
          if(cloudUD.events&&Array.isArray(cloudUD.events)){
            const evKF=ev=>ev.name+'||'+(ev.start||ev.startDate||'')+'||'+(ev.end||ev.endDate||'');
            const evMap={};
            (UD.events||[]).forEach(ev=>{evMap[evKF(ev)]=ev;});
            cloudUD.events.forEach(ev=>{
              const norm={name:ev.name,start:ev.start||ev.startDate||'',end:ev.end||ev.endDate||'',
                color:ev.color||'#8888ff',updatedAt:ev.updatedAt||0,deleted:!!ev.deleted,source:ev.source||''};
              const k=evKF(norm);
              if(!evMap[k]||(norm.updatedAt||0)>(evMap[k].updatedAt||0))evMap[k]=norm;
            });
            UD.events=Object.values(evMap).map(ev=>{if(!ev.id)ev.id='ev'+Date.now()+Math.random().toString(36).slice(2);if(!ev.memo)ev.memo='';if(ev.start&&!ev.startDate)ev.startDate=ev.start;if(ev.end&&!ev.endDate)ev.endDate=ev.end;return ev;});
          }
          // notes: updatedAtマージ
          if(cloudUD.notes&&Array.isArray(cloudUD.notes)){
            const ntKF=n=>n.date+'||'+n.text;
            const ntMap={};
            (UD.notes||[]).forEach(n=>{ntMap[ntKF(n)]=n;});
            cloudUD.notes.forEach(n=>{
              const norm={date:n.date,text:n.text,updatedAt:n.updatedAt||0,deleted:!!n.deleted,source:n.source||''};
              const k=ntKF(norm);
              if(!ntMap[k]||(norm.updatedAt||0)>(ntMap[k].updatedAt||0))ntMap[k]=norm;
            });
            UD.notes=Object.values(ntMap).map(n=>{if(!n.id)n.id='n'+Date.now()+Math.random().toString(36).slice(2);return n;});
          }
        }
      }catch(e){
        /* マージ失敗時はそのままアップロード */
        console.warn('[gdSyncUp] Merge failed, uploading anyway:',e);
      }
      // 上書き
      const up=await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(UD)
      });
      if(!up.ok)throw new Error('upload failed: '+up.status+' '+up.statusText);
      _gdFileId=fid;
    }else{
      // 新規作成
      const meta={name:GD_FILENAME,parents:['appDataFolder']};
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file',new Blob([JSON.stringify(UD)],{type:'application/json'}));
      const res=await gdFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
        method:'POST',
        headers:{},
        body:form
      });
      if(!res.ok)throw new Error('create failed: '+res.status+' '+res.statusText);
      const d=await res.json();
      if(!d||!d.id)throw new Error('create failed: no file id');
      _gdFileId=d.id;
    }
    if(!silent)toast('クラウドへ保存しました ↑');
    return true;
  }catch(e){
    console.error('[gdSyncUp] Error:',e);
    toast('保存失敗：'+e.message);
    return false;
  }
}

// ── クラウドデータを丸ごと適用（updatedAtはクラウドの値を保持） ──
function applyCloudData(d){
  UD=d;
  if(!UD.customSwords)UD.customSwords=[];
  if(!UD.events)UD.events=[];
  if(!UD.notes)UD.notes=[];
  if(!UD.saniwaLog)UD.saniwaLog=[];
  loadShared();
  // save()は_appReady時にupdatedAtをDate.now()で上書きし、自動同期も走らせてしまうため
  // ここでは直接localStorageへ保存（クラウドのupdatedAtをそのまま維持）
  localStorage.setItem(SK,JSON.stringify(UD));
  saveShared();
  ra();
}

// ── 起動時／ログイン時のクラウド差分チェック ──
// クラウドが新しい→ダイアログで読込確認（推奨）/ クラウドが古い→ダイアログでローカル保持確認（推奨）
// 「今後表示しない」ON時は安全な自動判断（新しければ読込・古ければローカル保持）
let _startupDlgData=null;
async function gdStartupCheck(){
  if(!_gdToken)return;
  try{
    const fid=await gdFindFile();
    if(!fid){
      // クラウドにファイルが無い＝初回。ローカルをアップロードしておく
      const ok=await gdSyncUp(true);
      if(ok)toast('クラウドに初回バックアップしました');
      return;
    }
    _gdFileId=fid;
    const res=await gdFetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,{headers:{}});
    if(!res.ok)return; // 取得できなければ黙って続行（ローカルを使用）
    let d;
    try{d=await res.json();}catch(pe){toast('クラウドのデータを読み取れませんでした（ローカルを使用）');return;}
    if(!d||!Array.isArray(d.instances)){toast('クラウドのデータが読み込めない形式でした（ローカルを使用）');return;}
    const localT=UD.updatedAt||0;
    const cloudT=d.updatedAt||0;
    const localCount=(UD.instances||[]).length;
    const cloudCount=d.instances.length;
    const disabled=!!ST.startupCheckDisabled;
    const auto=(ST.syncMode||'manual')==='auto';
    if(cloudT===localT){
      // タイムスタンプ一致＝同期済み。ただしローカルが空でクラウドにデータがある場合はクラウド優先
      // （updatedAt未保存の旧データ同士が 0===0 になるケースの保険）
      if(localCount===0&&cloudCount>0){
        if(disabled){applyCloudData(d);onSyncDone();toast('クラウドのデータを読み込みました');}
        else showStartupSyncDialog('newer',d,cloudT,localT);
      }
      return; // それ以外は何もしない
    }
    if(cloudT>localT){
      // クラウドが新しい → 読み込み確認（OFFなら自動読込）
      if(disabled){applyCloudData(d);onSyncDone();toast('クラウドの新しいデータを読み込みました');}
      else showStartupSyncDialog('newer',d,cloudT,localT);
    }else{
      // ローカルの方が新しい
      if(auto){
        // B案：自動でクラウドへ保存（安全：クラウドは遅れているだけ）
        const ok=await gdSyncUp(true);
        if(ok)toast('ローカルのデータをクラウドに保存しました');
      }else if(!disabled){
        // A案：確認ダイアログ（ローカル保持が推奨）
        showStartupSyncDialog('older',d,cloudT,localT);
      }
      // A案・確認OFF時はローカルを保持して何もしない
    }
  }catch(e){
    console.warn('[gdStartupCheck]',e);
  }
}

function fmtSyncTime(d){
  if(!d)return '';
  const now=new Date();
  const diff=Math.floor((now-d)/60000);
  if(diff<1)return 'たった今';
  if(diff<60)return `${diff}分前`;
  return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}

function renderGenCal(){
  var container=document.getElementById('gen-cal-container');
  var monthEl=document.getElementById('gen-cal-month');
  if(!container||!monthEl)return;
  var y=_genCalDate.getFullYear(),m=_genCalDate.getMonth();
  var mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var nowY=new Date().getFullYear();
  var minY=2015; // 刀剣乱舞 サービス開始年
  var loY=Math.min(minY,y),hiY=Math.max(nowY,y);
  var yOpts='';for(var yy=hiY;yy>=loY;yy--){yOpts+='<option value="'+yy+'"'+(yy===y?' selected':'')+'>'+yy+'年</option>';}
  var mOpts='';for(var mm=0;mm<12;mm++){mOpts+='<option value="'+mm+'"'+(mm===m?' selected':'')+'>'+mNames[mm]+'</option>';}
  monthEl.innerHTML='<select class="cal-sel" onchange="setGenCalYear(this.value)" onclick="event.stopPropagation()">'+yOpts+'</select><select class="cal-sel" onchange="setGenCalMonth(this.value)" onclick="event.stopPropagation()">'+mOpts+'</select>';
  var firstDay=new Date(y,m,1);
  var cur=new Date(firstDay);
  cur.setDate(cur.getDate()-firstDay.getDay());
  var inp=document.getElementById(_genCalTarget);
  var sel=inp&&inp.value?inp.value:'';
  var today=todayStr();
  var html='<div class="cal-grid">';
  ['日','月','火','水','木','金','土'].forEach(function(dow,i){
    html+='<div class="cal-dow" style="'+(i===0?'color:#e8764a':i===6?'color:#5b9fe8':'')+'">'+dow+'</div>';
  });
  for(var i=0;i<42;i++){
    var ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    var cls='cal-day'+(cur.getMonth()!==m?' other':'')+(cur.getDay()===6?' sat':cur.getDay()===0?' sun':'')+(ds===today?' today':'')+(ds===sel?' selected':'');
    html+='<button class="'+cls+'" onclick="selectGenDate(\''+ds+'\');event.stopPropagation()">'+cur.getDate()+'</button>';
    cur.setDate(cur.getDate()+1);
  }
  html+='</div>';
  if(['ie-genday'].includes(_genCalTarget)){
    html+='<div style="text-align:center;margin-top:8px;border-top:1px solid var(--border);padding-top:8px"><button class="btn sm" onclick="clearGenDate();event.stopPropagation()" style="font-size:11px">クリア（未設定に戻す）</button></div>';
  }
  container.innerHTML=html;
}

if((ST.syncMode||'manual')==='auto'&&_gdToken){
  gdSyncDown(false);
}
</script>
<div id="gen-cal-picker" style="display:none;position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:12px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);min-width:252px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <button class="btn" onclick="shiftGenCalMonth(-1);event.stopPropagation()" style="padding:4px 8px;font-size:12px">◀</button>
    <span id="gen-cal-month" style="flex:1;text-align:center;display:flex;gap:4px;justify-content:center;align-items:center"></span>
    <button class="btn" onclick="shiftGenCalMonth(1);event.stopPropagation()" style="padding:4px 8px;font-size:12px">▶</button>
  </div>
  <div id="gen-cal-container"></div>
</div>
</body>
</html>
