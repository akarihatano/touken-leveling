<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>バーの見え方</title>
<style>body{margin:0;font-family:'Noto Sans JP',-apple-system,sans-serif;background:#20242c;color:#e8e6e1}
.p{padding:14px;background:#171a20;border-bottom:1px solid #2e343e}
.b{padding:8px 14px;margin:0 6px 6px 0;font-size:12px;border-radius:7px;border:1px solid #39414e;background:#232833;color:#c9d1dc;font-family:inherit}
.b.on{background:#c8a84b;border-color:#c8a84b;color:#1a1200;font-weight:700}
.n{font-size:11px;color:#8d97a5;padding:12px 14px;line-height:1.8}</style></head><body>
<div class="p">
<button class="b on" id="ba" onclick="pick(1)">A：記録が見えている人</button>
<button class="b" id="bb" onclick="pick(0)">B：記録が無い人</button>
</div>
<div class="n">実ファイル（稽古録）から取り出したそのままのコードです。判定だけ外して、どちらも見られるようにしています。</div>
<!-- ═══ SNSアプリの中で開いている人への案内 ═══════════════════
     Xなどのアプリ内でリンクを開くと、ブラウザ本体とは別の場所に
     データが保存される。同じ道具を開いても記録が見えず、
     Googleログインも通らないことがある。
     ここは案内を出すだけで、動きは何も変えない。 -->
<div id="iab-bar" style="display:none"></div>
<script>
window.iabShow=function(){
  var KEY='saniwa_iab_hide';
  function isInApp(){ return true;
    var ua=navigator.userAgent||'';
    /* ①名乗っているアプリ ②AndroidのWebView ③iOSのWKWebView（Safari/の名乗りが無い） */
    if(/FBAN|FBAV|FB_IAB|Instagram|\bLine\/|MicroMessenger|KAKAOTALK/.test(ua))return true;
    if(/;\s*wv\)/.test(ua))return true;
    if(/iPhone|iPad|iPod/.test(ua)&&ua.indexOf('AppleWebKit')>=0&&!/Safari\//.test(ua))return true;
    return false;
  }
  function hidden(){ return false; }
  function hasData(){ return window.__A; }
  function close(never){
    if(never){ try{ localStorage.setItem(KEY,'1'); }catch(e){} }
    var el=document.getElementById('iab-bar');
    if(el)el.style.display='none';
  }
  window.iabClose=function(){
    var c=document.getElementById('iab-never');
    close(c&&c.checked);
  };
  function show(){
    var el=document.getElementById('iab-bar');
    if(!el)return;
    var body = hasData()
      ? '<p style="margin:0 0 10px">ここでの記録は、<b>いま開いているアプリ（Xなど）の中</b>だけに保存されています。'
        +'この道具ではなくそのアプリが管理している場所なので、アプリ側の都合でまとめて消えることがあります。</p>'
        +'<p style="margin:0 0 10px"><b>いま画面に記録が見えているなら、先に書き出し（エクスポート）を取ってください。</b>'
        +'そのファイルを、SafariやChromeで開いた同じ道具に読み込めば、そのまま続けられます。</p>'
      : '<p style="margin:0 0 10px">このままでは記録が保存されない、以前の記録が見えない、Googleとつながらない、といったことが起きます。</p>'
        +'<p style="margin:0"><b>メニューの「ブラウザで開く」から、SafariやChromeで開き直してください。</b>以前の記録がそのまま見えることがあります。</p>';
    el.innerHTML=
      '<div style="max-width:640px;margin:0 auto;padding:14px 16px;font-size:13px;line-height:1.85">'
      +'<div style="font-weight:700;margin-bottom:8px">⚠ SNSアプリの中で開いています</div>'
      +body
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap">'
      +'<label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer">'
      +'<input type="checkbox" id="iab-never"> このブラウザでは表示しない</label>'
      +'<button onclick="iabClose()" style="padding:7px 18px;font-size:12px;border-radius:7px;'
      +'border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-family:inherit">閉じる</button>'
      +'</div></div>';
    el.setAttribute('style',
      'display:block;background:#fff4d6;color:#5a4212;border-bottom:1px solid #e0c98a;'
      +'position:relative;z-index:400');
  }
  function init(){ if(isInApp()&&!hidden())show(); }
  init();
};
</script>
<!-- ここまで -->
<script>
function pick(a){window.__A=!!a;
 document.getElementById('ba').className='b'+(a?' on':'');
 document.getElementById('bb').className='b'+(a?'':' on');
 var el=document.getElementById('iab-bar'); el.innerHTML=''; el.removeAttribute('style');
 window.iabShow();}
window.__A=true; window.iabShow();
</script></body></html>
