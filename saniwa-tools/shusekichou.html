<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Googleドライブ同期（段階3）。稽古録・資源帳と同じ Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
/* ===== ダーク（既定） ===== */
:root{
  --bg0:#130f0b;--bg1:#1e1610;--bg2:#261d16;--bg3:#2f241b;
  --bd1:#342820;--bd2:#4a3a2c;
  --t1:#e8ddd0;--t2:#d0c4b0;--t3:#c0b0a0;--t4:#908070;
  --acc:#d9a960;--acc-dim:rgba(217,169,96,.15);
  --acc2:#5b9fe8;--ok:#7ec98a;--warn:#e08a8a;--warn-dim:rgba(224,138,138,.15);
  --shadow:rgba(0,0,0,.5);
  --cal-sat:#5b9fe8;--cal-sun:#e8874a; /* カレンダーの曜日色（土＝青／日＝橙） */
}
/* ===== ライト ===== */
.light{
  --bg0:#faf5ee;--bg1:#ffffff;--bg2:#f5ede2;--bg3:#efe4d4;
  --bd1:#e6dccc;--bd2:#d0c0a8;
  --t1:#1e1710;--t2:#3a2e20;--t3:#5a4a38;--t4:#8a7860;
  --acc:#b3822f;--acc-dim:rgba(179,130,47,.12);
  --acc2:#3a7fd0;--ok:#4fa860;--warn:#c85a5a;--warn-dim:rgba(200,90,90,.12);
  --shadow:rgba(90,70,40,.3);
  --cal-sat:#3a7fd0;--cal-sun:#c25f28; /* カレンダーの曜日色（土＝青／日＝橙） */
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;font-size:14px;background:var(--bg0);color:var(--t1);min-height:100vh;-webkit-tap-highlight-color:transparent;padding-bottom:60px;transition:background .2s,color .2s}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 2px 12px;border-bottom:1px solid var(--bd1);margin-bottom:14px}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:.12em}
.hdr h1 small{font-size:11px;font-weight:400;color:var(--t4);letter-spacing:.06em;display:block;margin-top:2px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mode-seg{display:flex;border:1px solid var(--bd1);border-radius:7px;overflow:hidden}
.mode-seg button{padding:4px 9px;font-size:11px;border:none;border-right:1px solid var(--bd1);background:transparent;color:var(--t4);cursor:pointer;font-family:inherit}
.mode-seg button:last-child{border-right:none}
.mode-seg button.on{background:var(--bg2);color:var(--acc)}
.hdr-ver{font-size:11px;color:var(--t4)}
/* ☁ボタンはテーマ切替と同じ行の右隣に置く */
.hdr-row{display:flex;align-items:center;gap:6px}

/* =========================================================
   バックアップまわり（丙案 段階2）
   ========================================================= */
/* ☁ボタン（モック shusekichou_cloud_mock.html のとおり）
     つながっているか … 塗りの有無と色（色だけに頼らない。⚠ で形も変える）
     新しいものがあるか … 右上の小さな青い点
     回線が無い … 全体を薄く（ログインの塗りは残す。回線とGoogleは別もの）  */
.cloud-btn{position:relative;padding:4px 10px;font-size:13px;border:1px solid var(--bd1);
  border-radius:7px;background:transparent;color:var(--t4);cursor:pointer;
  font-family:inherit;line-height:1.4;transition:border-color .15s,color .15s,background .15s}
.cloud-btn:not(.in):not(.ng):hover{border-color:var(--acc);color:var(--acc)}
.cloud-btn.in {background:var(--acc-dim); border-color:var(--acc); color:var(--acc)}
.cloud-btn.ng {background:var(--warn-dim);border-color:var(--warn);color:var(--warn)}
.cloud-btn.noline{opacity:.4}
.cloud-btn .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--acc2);border:2px solid var(--bg0);box-sizing:content-box}
.cloud-btn.open{box-shadow:0 0 0 2px var(--acc-dim)}

#cloudPanel{display:none;position:fixed;z-index:60;
  width:274px;max-width:calc(100vw - 16px);
  background:var(--bg1);border:1px solid var(--bd2);border-radius:10px;padding:13px;
  box-shadow:0 6px 20px var(--shadow)}
.cp-h{font-size:11px;color:var(--t4);letter-spacing:.08em;margin-bottom:8px}
.cp-state{font-size:12px;color:var(--t2);margin-bottom:10px;display:flex;align-items:flex-start;
  gap:7px;line-height:1.6}
.cp-dot{width:7px;height:7px;border-radius:50%;background:var(--t4);flex-shrink:0;margin-top:5px}
.cp-dot.on{background:var(--ok)}
.cp-dot.warn{background:var(--warn)}
.cp-sub{color:var(--t4);font-size:11px}
.cp-row{display:flex;gap:6px;margin-bottom:8px}
.cp-row .btn{flex:1;text-align:center;padding:7px 4px}
.cp-sep{border-top:1px solid var(--bd1);margin:11px 0 10px}
.cp-note{font-size:10px;color:var(--t4);line-height:1.6;margin-top:8px}
.cp-chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);cursor:pointer;
  margin-bottom:9px}
.cp-chk input{width:15px;height:15px;accent-color:var(--acc)}
.cp-seg{display:flex;border:1px solid var(--bd2);border-radius:7px;overflow:hidden;margin-top:5px}
.cp-seg button{flex:1;padding:6px 3px;font-size:11px;border:none;border-right:1px solid var(--bd2);
  background:transparent;color:var(--t4);cursor:pointer;font-family:inherit}
.cp-seg button:last-child{border-right:none}
.cp-seg button.on{background:var(--acc-dim);color:var(--acc)}
.cp-lbl{font-size:11px;color:var(--t3);line-height:1.6}
/* はじめて別の端末とやりとりする人への案内。読み飛ばされないよう少しだけ立たせる */
.cp-first{font-size:10px;color:var(--t3);line-height:1.7;margin-top:10px;
  background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:8px 9px}
.cp-first .cp-first-h{display:block;color:var(--acc);font-weight:600;margin-bottom:3px}
.cp-first b{color:var(--t1);font-weight:600}

/* 保険①：失われるものの知らせ */
.time-cmp{font-size:12px;color:var(--t3);line-height:1.9;background:var(--bg2);
  border:1px solid var(--bd1);border-radius:8px;padding:9px 11px;font-variant-numeric:tabular-nums}
.time-cmp b{color:var(--t1);font-weight:600}
.lose-box{background:var(--bg2);border:1px solid var(--warn);border-radius:8px;padding:11px 12px;margin:12px 0}
.lose-h{font-size:12px;color:var(--warn);font-weight:600;margin-bottom:8px;line-height:1.6}
.lose-list{list-style:none;font-size:12px;color:var(--t2);line-height:1.7}
.lose-list li{padding:5px 0 5px 14px;position:relative;border-top:1px solid var(--bd1)}
.lose-list li:first-child{border-top:none}
.lose-list li::before{content:'・';position:absolute;left:0;color:var(--t4)}
.lose-list b{color:var(--t1);font-weight:600}
.lose-sub{display:block;font-size:11px;color:var(--t4);margin-top:3px;line-height:1.6}
.safe-note{font-size:11px;color:var(--t4);line-height:1.7;margin-top:10px}

/* 保険②：読み込みを取り消せる間だけ出る帯 */
.undo-bar{position:sticky;top:0;z-index:40;
  background:var(--acc-dim);border:1px solid var(--acc);border-radius:9px;
  padding:9px 11px;margin-bottom:12px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.undo-txt{flex:1;min-width:150px;font-size:12px;color:var(--acc);line-height:1.6}
.undo-txt small{display:block;color:var(--t4);font-size:10px;margin-top:2px}
.undo-bar .btn{flex-shrink:0}

.card{background:var(--bg1);border:1px solid var(--bd1);border-radius:10px;padding:14px;margin-bottom:12px}
.card-h{font-size:12px;color:var(--t4);letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{padding:7px 14px;font-size:13px;border:1px solid var(--bd2);border-radius:7px;background:var(--bg2);color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{color:var(--t1);border-color:var(--acc)}
.btn.pri{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger:hover{background:rgba(224,138,138,.12)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{color:var(--t2);border-color:var(--bd2)}

/* 一覧 */
.ev-item{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--bd1);border-radius:9px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-family:inherit;color:var(--t1);transition:border-color .15s}
.ev-item:hover{border-color:var(--acc)}
.ev-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ev-name{font-size:15px;font-weight:600}
.ev-badge{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.ev-badge.live{background:var(--acc-dim);color:var(--acc);border:1px solid var(--acc)}
.ev-badge.done{background:var(--bg3);color:var(--t4);border:1px solid var(--bd2)}
.ev-sub{font-size:12px;color:var(--t4);margin-bottom:8px}
.ev-bar{height:6px;background:var(--bg0);border-radius:3px;overflow:hidden;margin-bottom:6px}
.ev-bar i{display:block;height:100%;border-radius:3px}
.ev-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--t3)}
.ev-stat b{color:var(--acc);font-weight:600}
.arch-h{font-size:12px;color:var(--t4);letter-spacing:.08em;margin:18px 0 8px;padding-left:2px}

.empty{text-align:center;color:var(--t4);padding:34px 16px;line-height:1.9}
.empty .big{font-size:15px;color:var(--t3);margin-bottom:4px}

/* 詳細（Phase1はスタブ） */
.back{background:none;border:none;color:var(--t4);font-size:13px;cursor:pointer;padding:4px 2px;margin-bottom:8px;font-family:inherit}
.back:hover{color:var(--t2)}
.dtl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.dtl-head h2{font-size:18px;font-weight:700}
.dtl-period{font-size:12px;color:var(--t4);margin-bottom:12px}
.meta-row{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid var(--bd1);font-size:13px}
.meta-row:last-child{border-bottom:none}
.meta-row .k{color:var(--t4)}
.meta-row .v{color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.stub-note{background:var(--acc-dim);border:1px dashed var(--acc);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--acc);line-height:1.7;margin-bottom:12px}

/* モーダル / フォーム */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:50}
.modal{background:var(--bg1);border:1px solid var(--bd2);border-radius:12px;width:100%;max-width:520px;padding:18px 16px;margin:auto}
.modal-h{font-size:16px;font-weight:700;margin-bottom:14px}
.fld{margin-bottom:13px}
.lbl{display:block;font-size:11px;color:var(--t4);margin-bottom:5px}
.lbl .opt{color:var(--t4);font-weight:400}
.fld input[type=text]{width:100%;padding:9px 10px;font-size:15px;border:1px solid var(--bd2);border-radius:7px;background:var(--bg0);color:var(--t1);font-family:inherit}
.fld input:focus{outline:none;border-color:var(--acc)}
.fld-row{display:flex;gap:8px}
.fld-row .fld{flex:1;margin-bottom:0}
.seg{display:flex;border:1px solid var(--bd2);border-radius:7px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;font-size:12px;border:none;border-right:1px solid var(--bd2);background:transparent;color:var(--t4);cursor:pointer;font-family:inherit}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--acc-dim);color:var(--acc)}
.hint{font-size:11px;color:var(--t4);margin-top:5px;line-height:1.6}
.hint b{color:var(--t3);font-weight:600}
.mat-edit{border:1px solid var(--bd1);border-radius:8px;padding:10px;background:var(--bg2)}
.mat-erow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.mat-erow:last-of-type{margin-bottom:0}
/* .fld input[type=text] より詳細度を高くして、行内の幅指定を確実に効かせる */
.mat-edit .mat-erow input[type=text]{padding:8px 9px;font-size:14px;border:1px solid var(--bd2);border-radius:6px;background:var(--bg0);color:var(--t1);font-family:inherit}
.mat-edit .mat-erow .mn{flex:1 1 auto;width:auto;min-width:0}
.mat-edit .mat-erow .mt{flex:0 0 116px;width:116px;min-width:0}
.mat-erow .mdel{background:none;border:none;color:var(--t4);font-size:15px;cursor:pointer;padding:2px 5px;flex-shrink:0}
.mat-erow .mdel:hover{color:var(--warn)}
.mat-erow .mspacer{width:23px;flex-shrink:0}
@media(max-width:400px){.mat-edit .mat-erow .mt{flex:0 0 96px;width:96px}}
.mat-add{margin-top:8px}
.err{color:var(--warn);font-size:12px;margin-top:4px;min-height:0}
.modal-foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;align-items:center}
.modal-foot .right{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}

/* 確認ダイアログ */
.confirm-box{max-width:380px;text-align:center}
.confirm-box .cmsg{font-size:14px;line-height:1.8;margin-bottom:16px;color:var(--t2)}
.confirm-box .cfoot{display:flex;gap:8px;justify-content:center}

/* ノルマ機能スイッチ */
.norma-sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px solid var(--bd1);border-radius:9px;padding:11px 14px;margin-bottom:12px}
.norma-sw-txt{font-size:13px}
.norma-sw-txt small{display:block;font-size:11px;color:var(--t4);margin-top:3px;line-height:1.5}
.switch{position:relative;width:46px;height:26px;flex-shrink:0;border-radius:13px;background:var(--bd2);cursor:pointer;transition:background .2s}
.switch.on{background:var(--acc)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on i{left:23px}

/* 記録入力行 */
.in-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.in-row .fld{flex:1;min-width:120px;margin-bottom:0}
.in-row input{width:100%;padding:8px 10px;font-size:15px;border:1px solid var(--bd2);border-radius:7px;background:var(--bg0);color:var(--t1);font-family:inherit}
.in-row input:focus{outline:none;border-color:var(--acc)}
/* ブラウザ標準の日付欄は、iPhone で指定した幅より縮まず、隣の欄に食い込んでいた。
   日付は下の「装飾カレンダー」に置き換えたので、ここは数値欄と
   「記録する日」の箱の高さをそろえるだけでよい。                          */
.in-row input,.in-row .rec-fixdate{height:38px}
.in-note{font-size:11px;color:var(--t4);margin-top:8px;line-height:1.7}
.in-note b{color:var(--acc);font-weight:600}
/* 「合計で入れる」の記録先の日（入力欄ではなく表示だけ・1行に収めて高さをそろえる） */
.rec-fixdate{display:flex;align-items:center;padding:0 10px;font-size:15px;border:1px dashed var(--bd2);border-radius:7px;background:var(--bg2);color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* 「今日にまとめて」を選んだとき、記録がないまま残る日の案内 */
.rec-left{font-size:11px;color:var(--t3);margin-top:8px;line-height:1.7;background:var(--bg2);border:1px solid var(--bd1);border-radius:7px;padding:8px 10px}
.rec-left b{color:var(--t1);font-weight:600}

/* =========================================================
   装飾カレンダー
   稽古録（keikoroku.html）から移植。集積帳の書き方（var / function）に
   直してある。見た目は稽古録・資源帳と同じ「日付が左・📅が右」。
   集積帳だけの上乗せは data-min / data-max による「選べる日の制限」。
   ========================================================= */
.cal-wrapper{position:relative;width:100%}
.cal-pick-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 10px;font-size:15px;font-family:inherit;line-height:1.2;text-align:left;
  border:1px solid var(--bd2);border-radius:7px;background:var(--bg0);color:var(--t1);
  cursor:pointer;user-select:none;white-space:nowrap;transition:border-color .15s}
.cal-pick-btn:hover{border-color:var(--acc)}
.cal-pick-btn.open{border-color:var(--acc)}
.cal-pick-btn .cal-val{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-pick-btn .cal-val.none{color:var(--t4)}
.cal-pick-btn .cal-ico{font-size:12px;opacity:.55;flex-shrink:0}
/* 記録行では隣の数値欄と高さをそろえる。
   この行は幅の取り合いが厳しい（390px の画面でちょうど埋まる）ので、
   余白・間隔・アイコンを少しずつ詰めて、日付が「…」で切れないようにしてある */
.in-row .cal-pick-btn{height:38px;padding:0 8px;gap:6px}
.in-row .cal-pick-btn .cal-ico{font-size:11px}

#calPicker{display:none;position:fixed;z-index:200;
  width:288px;max-width:calc(100vw - 16px);
  background:var(--bg1);border:1px solid var(--bd2);border-radius:10px;padding:12px;
  box-shadow:0 6px 20px var(--shadow)}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.cal-nav{padding:4px 9px;font-size:12px;border:1px solid var(--bd2);border-radius:6px;
  background:var(--bg2);color:var(--t2);cursor:pointer;font-family:inherit;flex-shrink:0}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-selwrap{flex:1;display:flex;gap:4px;justify-content:center}
.cal-sel{font-size:12px;font-weight:600;color:var(--t1);background:var(--bg2);
  border:1px solid var(--bd2);border-radius:6px;padding:4px 5px;font-family:inherit;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:10px;font-weight:600;color:var(--t4);text-align:center;padding:3px 0}
.cal-day{padding:8px 1px;text-align:center;border-radius:5px;cursor:pointer;font-size:13px;
  background:var(--bg2);color:var(--t1);border:1px solid var(--bd1);font-family:inherit;line-height:1.2;
  font-variant-numeric:tabular-nums}
.cal-day:hover{border-color:var(--bd2)}
.cal-day.other{opacity:.45}
.cal-day.sat{color:var(--cal-sat)}
.cal-day.sun{color:var(--cal-sun)}
/* 今日は枠で示す。太い枠にするとマスの大きさが変わるので、内側の線で描く */
.cal-day.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:700}
.cal-day.selected{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;box-shadow:none}
.cal-day.selected.sat,.cal-day.selected.sun{color:#fff}
/* 選べない日（イベント期間の外・まだ来ていない日） */
.cal-day:disabled{opacity:.22;cursor:default;background:transparent;box-shadow:none}
.cal-day:disabled:hover{border-color:var(--bd1)}

.mat-tab{padding:6px 13px;font-size:13px;border:1px solid var(--bd1);border-radius:16px;background:transparent;color:var(--t4);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;user-select:none;
  transition:background .15s,color .15s,border-color .15s,transform .12s,box-shadow .12s,opacity .12s}
.mat-tab.on{background:var(--acc-dim);color:var(--acc);border-color:var(--acc)}
.mat-tab.add{border-style:dashed}
/* 掴んでいる間: 影で持ち上げ、少し拡大して傾ける（沈ませない） */
.mat-tab.dragging{opacity:1;border-color:var(--acc);background:var(--bg3);
  transform:scale(1.08) rotate(-2deg);box-shadow:0 8px 20px var(--shadow);
  position:relative;z-index:5;cursor:grabbing}
/* 掴んでいる間、他のタブは控えめにして掴んだものを目立たせる */

/* つまみは濃く・大きめに。指で掴みやすいよう当たり判定も広げる */

<!-- ═══ SNSアプリの中で開いている人への案内 ═══════════════════
     Xなどのアプリ内でリンクを開くと、ブラウザ本体とは別の場所に
     データが保存される。同じ道具を開いても記録が見えず、
     Googleログインも通らないことがある。
     ここは案内を出すだけで、動きは何も変えない。 -->
<div id="iab-bar" style="display:none"></div>
<script>
(function(){
  var KEY='saniwa_iab_hide';
  /* ホーム画面に追加して開いている状態。SNSアプリの中ではないので案内を出さない。
     iOSは navigator.standalone、AndroidなどはCSSの display-mode で分かる。 */
  function isHomeScreen(){
    try{ if(navigator.standalone===true)return true; }catch(e){}
    try{ if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)return true; }catch(e){}
    return false;
  }
  function isInApp(){
    if(isHomeScreen())return false;
    var ua=navigator.userAgent||'';
    /* ①名乗っているアプリ ②AndroidのWebView ③iOSのWKWebView（Safari/の名乗りが無い） */
    if(/FBAN|FBAV|FB_IAB|Instagram|\bLine\/|MicroMessenger|KAKAOTALK/.test(ua))return true;
    if(/;\s*wv\)/.test(ua))return true;
    if(/iPhone|iPad|iPod/.test(ua)&&ua.indexOf('AppleWebKit')>=0&&!/Safari\//.test(ua))return true;
    return false;
  }
  function hidden(){ try{ return localStorage.getItem(KEY)==='1'; }catch(e){ return false; } }
  function hasData(){ return typeof gdLocalEmpty==="function" ? !gdLocalEmpty() : false; }
  function close(never){
    if(never){ try{ localStorage.setItem(KEY,'1'); }catch(e){} }
    var el=document.getElementById('iab-bar');
    if(el)el.style.display='none';
  }
  window.iabClose=function(){
    var c=document.getElementById('iab-never');
    close(c&&c.checked);
  };
  function show(){
    var el=document.getElementById('iab-bar');
    if(!el)return;
    var body = hasData()
      ? '<p style="margin:0 0 10px">ここでの記録は、<b>いま開いているアプリ（Xなど）の中</b>だけに保存されています。'
        +'この道具ではなくそのアプリが管理している場所なので、アプリ側の都合でまとめて消えることがあります。</p>'
        +'<p style="margin:0 0 10px"><b>いま画面に記録が見えているなら、先に書き出し（エクスポート）を取ってください。</b>'
        +'そのファイルを、SafariやChromeで開いた同じ道具に読み込めば、そのまま続けられます。</p>'
      : '<p style="margin:0 0 10px">このままでは記録が保存されない、以前の記録が見えない、Googleとつながらない、といったことが起きます。</p>'
        +'<p style="margin:0"><b>メニューの「ブラウザで開く」から、SafariやChromeで開き直してください。</b>以前の記録がそのまま見えることがあります。</p>';
    el.innerHTML=
      '<div style="max-width:640px;margin:0 auto;padding:14px 16px;font-size:13px;line-height:1.85">'
      +'<div style="font-weight:700;margin-bottom:8px">⚠ SNSアプリの中で開いています</div>'
      +body
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap">'
      +'<label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer">'
      +'<input type="checkbox" id="iab-never"> このブラウザでは表示しない</label>'
      +'<button onclick="iabClose()" style="padding:7px 18px;font-size:12px;border-radius:7px;'
      +'border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-family:inherit">閉じる</button>'
      +'</div></div>';
    el.setAttribute('style',
      'display:block;background:#fff4d6;color:#5a4212;border-bottom:1px solid #e0c98a;'
      +'position:relative;z-index:400');
  }
  function init(){ if(isInApp()&&!hidden())show(); }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

<script>
/* =========================================================
   集積帳 - 収集物ノルマ表
   Phase 1: 骨格（テーマ3モード / データ層CRUD / fmtN移植 /
            イベント一覧・新規作成・編集・削除 / 詳細スタブ）
   ========================================================= */

/* ---- データ層 ---------------------------------------- */
var SK='shuseki_data_v1';
/* バックアップまわり（段階2）。控えは1世代だけ別キーに置く */
var TOOL_ID='shuseki';
var UNDO_KEY=SK+'_undo';
var DB={events:[],settings:{}};

function load(){
  try{var d=localStorage.getItem(SK);if(d)DB=JSON.parse(d);}catch(e){}
  if(!DB||typeof DB!=='object')DB={};
  if(!Array.isArray(DB.events))DB.events=[];
  if(!DB.settings||typeof DB.settings!=='object')DB.settings={};
  /* ---- 丙案の下ごしらえ ----------------------------------
     この更新より前のデータには updatedAt も recAt も無い。
     無いものは「時刻0」として扱う＝いちばん古い、という約束にする。   */
  if(typeof DB.updatedAt!=='number')DB.updatedAt=0;
  (DB.events||[]).forEach(function(ev){
    /* ---- 手形（周回に使う券）の下ごしらえ --------------------
       手形はイベント共通のものなので、素材の中ではなく**イベント直下**に持つ。
       既にあるイベントには無いので、無い＝「手形を使わない」から始める。
       ここで埋めておかないと、あとから足したときにデータの引っ越しが要る。  */
    if(typeof ev.useTicket!=='boolean')ev.useTicket=false;
    if(ev.ticketName!=='提灯')ev.ticketName='手形';   /* 想定外の値も手形へ寄せる */
    if(typeof ev.ticketCost!=='number')ev.ticketCost=0;
    if(!ev.tickets||typeof ev.tickets!=='object')ev.tickets={};   /* {'2026-08-02':6} その日買った枚数 */
    if(!ev.ticketAt||typeof ev.ticketAt!=='object')ev.ticketAt={};/* 日ごとの更新時刻（recAt と同じ役目） */
    (ev.materials||[]).forEach(function(m){
      if(!m.records||typeof m.records!=='object')m.records={};
      if(!m.recAt||typeof m.recAt!=='object')m.recAt={};
    });
  });
}
/* 保存。丙案では「どちらが新しいか」を DB.updatedAt で比べるので、
   保存のたびに必ず時刻を打つ。これが無いと丙案は成り立たない。      */
function save(){
  DB.updatedAt=Date.now();
  saveKeepTime();
  dropUndo(); // 何か変わったら、読み込み前の控えはもう戻せる状態ではない
  scheduleAutoSync(); // 段階3-d。自動保存がONのときだけ、少し待ってからクラウドへ上げる
}
/* 時刻を打たずに保存する。クラウドや控えから読み込んだ塊を
   そのままの時刻で保つときに使う（段階2以降）。                    */
function saveKeepTime(){
  try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}
}
/* 見た目や入力の好みを保存する。記録は変わっていないので時刻は打たないし、
   読み込みの控えも捨てない。
   ここを save() にしてしまうと、テーマを切り替えただけでこの端末が
   「新しい方」に化けて、もう片方の端末で足した記録を押しのける立場になる。  */
function saveSetting(){saveKeepTime();}

/* ---- この端末だけの設定（同期しない） -------------------
   同期の設定は端末ごとのもの。Googleのログインそのものが端末ごとなので、
   「自動で保存する」が iPhone から届いても Windows が未ログインなら意味をなさない。
   なので DB とは別のキーに置いて、同期の対象から外す。                    */
var PK='shuseki_pref_v1';
var PREF={
  gdAuto:false,          /* 変わったら自動で保存する（段階3-d） */
  gdNotify:'dialog',     /* 起動時の知らせ方 dialog / dot / none（段階3-c） */
  gdWarnOff:false,       /* 自動保存を見送ったときの警告を出さない（段階3-d） */
  gdWasIn:false          /* 前にGoogleとつないでいた。開き直したとき裏で取り直す目印 */
};
function loadPref(){
  try{
    var s=localStorage.getItem(PK);
    if(!s)return;
    var p=JSON.parse(s);
    if(!p||typeof p!=='object')return;
    for(var k in PREF){
      if(PREF.hasOwnProperty(k)&&Object.prototype.hasOwnProperty.call(p,k))PREF[k]=p[k];
    }
    if(PREF.gdNotify!=='dialog'&&PREF.gdNotify!=='dot'&&PREF.gdNotify!=='none')PREF.gdNotify='dialog';
    PREF.gdAuto=!!PREF.gdAuto;
    PREF.gdWarnOff=!!PREF.gdWarnOff;
    PREF.gdWasIn=!!PREF.gdWasIn;
  }catch(e){}
}
function savePref(){
  try{localStorage.setItem(PK,JSON.stringify(PREF));}catch(e){}
}

/* ---- 合流（丙案の心臓部） ------------------------------
   まだ画面のどこからも呼んでいない。段階2で JSON 読み込みが、
   段階3で Drive の読み込みが、ここを通る。

   考え方（甲＋記録の合流）:
     ・全体の新旧は DB.updatedAt で比べ、**新しい側の構造にそのまま従う**
       （イベントの増減・素材の増減・名前・期間などは全部そちらのもの）
     ・ただし記録（records）だけは、**両方が持っているイベント・素材**について
       日付ごとに突き合わせて合流させる
     ・イベントも素材も id で見分ける。名前や期間では見ない。
       同じ名前でもぶつからない代わりに、両方の端末で別々に作ったものは
       別物として扱われる（片方は消える。保険①で数えて見せる予定）

   日付ひとつの決め方:
     1. recAt が違う → 新しい方に従う
        （新しい方に値が無ければ「そのとき消された」ので、消えたままにする）
     2. recAt が同じ（両方とも時刻なし＝0 を含む）
        a. 片方にしか値が無い → 値がある方を残す（消える方向には倒さない）
        b. 両方に値がある     → 全体の updatedAt が新しい側の値（案A）
*/
function _deepCopy(o){try{return JSON.parse(JSON.stringify(o));}catch(e){return null;}}

/* 記録ひと組ぶんの合流。a が「新しい側」。返すのは新しい入れ物 */
function mergeRecords(aRec,aAt,bRec,bAt,aIsNewer){
  aRec=aRec||{};aAt=aAt||{};bRec=bRec||{};bAt=bAt||{};
  var keys={};
  [aRec,aAt,bRec,bAt].forEach(function(o){
    Object.keys(o).forEach(function(k){keys[k]=1;});
  });
  var out={},outAt={};
  Object.keys(keys).forEach(function(d){
    var aHas=Object.prototype.hasOwnProperty.call(aRec,d);
    var bHas=Object.prototype.hasOwnProperty.call(bRec,d);
    var at=+aAt[d]||0, bt=+bAt[d]||0;
    var take;
    if(at!==bt)            take=(at>bt)?'a':'b';   // 1. 新しい方
    else if(aHas&&!bHas)   take='a';               // 2a. 値がある方
    else if(bHas&&!aHas)   take='b';
    else if(aHas&&bHas)    take=aIsNewer?'a':'b';  // 2b. 案A
    else                   take=null;              // どちらでも消えている
    if(take==='a'&&aHas)      out[d]=aRec[d];
    else if(take==='b'&&bHas) out[d]=bRec[d];
    /* 採る側に値が無い＝その時刻に消された、ということ。記録は入れない */
    var t=Math.max(at,bt);
    if(t>0)outAt[d]=t;   // 0 のままなら「時刻なし」を保つ（あとの書き込みに必ず負ける）
  });
  return {records:out,recAt:outAt};
}

/* 手元の塊と、外から来た塊を合流させて新しい塊を返す。
   引数はどちらも変更しない。片方が壊れていればもう片方をそのまま返す。 */
function mergeDB(local,cloud){
  var lOk=local&&typeof local==='object'&&Array.isArray(local.events);
  var cOk=cloud&&typeof cloud==='object'&&Array.isArray(cloud.events);
  if(!cOk)return _deepCopy(local);
  if(!lOk)return _deepCopy(cloud);

  var lAt=+local.updatedAt||0, cAt=+cloud.updatedAt||0;
  var cloudIsNewer=(cAt>=lAt);   // 同じときはクラウド側（読み込む操作なので）
  var base =_deepCopy(cloudIsNewer?cloud:local);
  var other=            cloudIsNewer?local:cloud;
  if(!base)return _deepCopy(cloudIsNewer?local:cloud);

  var otherEv={};
  (other.events||[]).forEach(function(e){if(e&&e.id)otherEv[e.id]=e;});

  (base.events||[]).forEach(function(ev){
    var oev=ev&&ev.id?otherEv[ev.id]:null;
    if(!oev)return;                       // 片方にしか無いイベントはそのまま
    /* 手形はイベント直下にあるので、素材の中の records とは別にもう一本合流させる。
       日付キーの塊であることしか見ていないので mergeRecords をそのまま使える。
       ここで新しい合流の規則を書かないこと（規則が二本になると必ず食い違う）。   */
    var tk=mergeRecords(ev.tickets,ev.ticketAt,oev.tickets,oev.ticketAt,true);
    ev.tickets=tk.records;
    ev.ticketAt=tk.recAt;
    var oMat={};
    (oev.materials||[]).forEach(function(m){if(m&&m.id)oMat[m.id]=m;});
    (ev.materials||[]).forEach(function(m){
      var om=m&&m.id?oMat[m.id]:null;
      if(!om)return;                      // 片方にしか無い素材はそのまま
      var r=mergeRecords(m.records,m.recAt,om.records,om.recAt,true);
      m.records=r.records;
      m.recAt=r.recAt;
    });
  });

  base.updatedAt=Math.max(lAt,cAt);
  return base;
}

/* ---- 記録の書き込み・削除 --------------------------------
   記録は必ずこの2つを通す。日付ごとの更新時刻（recAt）を打ち忘れると、
   別の端末と合流したときに「消したはずの記録」が蘇ってしまう。
   削除のときにも時刻を打つのが肝。                                */
function setRec(mat,d,n){
  if(!mat.records)mat.records={};
  if(!mat.recAt)mat.recAt={};
  mat.records[d]=n;
  mat.recAt[d]=Date.now();
}
function delRec(mat,d){
  if(!mat.records)mat.records={};
  if(!mat.recAt)mat.recAt={};
  delete mat.records[d];
  mat.recAt[d]=Date.now(); // 消したことも「いつ消したか」で覚えておく
}
/* ---- 手形の書き込み・削除 --------------------------------
   記録（records）と同じで、書き込みは必ずこの2つを通す。時刻を打ち忘れると
   別の端末と合流したときに「消したはずの手形」が蘇る。

   addTicket は**足し算**。朝に6枚、夕方に6枚買うことがあり、上書きだと
   夕方に 6 と入れた時点で朝の6枚が黙って消えてしまうため。
   setTicket は**上書き**（日別記録の編集画面から使う）。0 にしたら消す。    */
function addTicket(ev,d,n){
  if(!ev.tickets)ev.tickets={};
  if(!ev.ticketAt)ev.ticketAt={};
  var next=(+ev.tickets[d]||0)+(+n||0);
  if(next>0)ev.tickets[d]=next;
  else delete ev.tickets[d];
  ev.ticketAt[d]=Date.now();
}
function setTicket(ev,d,n){
  if(!ev.tickets)ev.tickets={};
  if(!ev.ticketAt)ev.ticketAt={};
  var v=+n||0;
  if(v>0)ev.tickets[d]=v;
  else delete ev.tickets[d];   /* 0 は「その日は買っていない」＝残さない */
  ev.ticketAt[d]=Date.now();   /* 消したときにも必ず打つ（ここが肝） */
}

/* ---- 手形の読み取り（表示用） ----------------------------
   小判は保存しない。表示のたびに「枚数 × 1枚の値段」で出す。
   こうしておくと、値段を打ち間違えて直したとき過去の分もまとめて直る。  */
function ticketName(ev){return (ev&&ev.ticketName==='提灯')?'提灯':'手形';}
function ticketUnit(ev){return (ev&&ev.ticketName==='提灯')?'個':'枚';}  /* 提灯は「個」で数える */
function ticketCost(ev){return Math.max(0,+((ev||{}).ticketCost)||0);}
function ticketOn(ev){return !!(ev&&ev.useTicket);}
/* その日買った枚数 */
function ticketOf(ev,d){return +(((ev||{}).tickets||{})[d])||0;}
/* イベント全体で買った枚数 */
function ticketTotal(ev){
  var t=(ev&&ev.tickets)||{},s=0;
  for(var k in t){if(t.hasOwnProperty(k))s+=(+t[k]||0);}
  return s;
}
/* イベント全体で使った小判 */
function kobanTotal(ev){return ticketTotal(ev)*ticketCost(ev);}
/* 「6枚（1,200小判）」のような書き方。値段が未設定なら小判は書かない */
function ticketTxt(ev,n){
  var s=n.toLocaleString('ja-JP')+ticketUnit(ev);
  var c=ticketCost(ev);
  if(c>0)s+='（'+(n*c).toLocaleString('ja-JP')+'小判）';
  return s;
}

function uid(prefix){
  return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

/* CRUD */
function getEvent(id){return DB.events.find(function(e){return e.id===id;})||null;}
function deleteEvent(id){DB.events=DB.events.filter(function(e){return e.id!==id;});save();}

/* ---- 日付ユーティリティ（ローカル時刻・TZずれ回避） ---- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return ymd(new Date());}
function parseYmd(s){var p=(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);}
function diffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);} // b - a （日数）
var WD=['日','月','火','水','木','金','土'];
function fmtDate(s){var d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate();}
function fmtDateFull(s){var d=parseYmd(s);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}

/* 期間まわり（includeEndDay を反映） */
/* 期間まわり
   spanDays  = 開始〜終了のカレンダー上の日数。記録・グラフはいつもこちらを使う
   periodDays= ノルマ計算の分母。includeEndDay=false なら最終日を数えない        */
function spanDays(ev){return diffDays(ev.start,ev.end)+1;}
function periodDays(ev){var base=diffDays(ev.start,ev.end);return ev.includeEndDay?base+1:base;} // ノルマの分母日数
function isEnded(ev){return todayStr()>ev.end;} // 終了日を過ぎたら終了区分
function remainDays(ev){var base=diffDays(todayStr(),ev.end);return ev.includeEndDay?base+1:base;}

/* 集計（累計は records から動的計算・保持しない） */
function matCum(mat){var s=0,r=mat.records||{};for(var k in r){if(r.hasOwnProperty(k))s+=(+r[k]||0);}return s;}
function evCum(ev){return (ev.materials||[]).reduce(function(a,m){return a+matCum(m);},0);}
function evTarget(ev){return (ev.materials||[]).reduce(function(a,m){return a+(+m.target||0);},0);}

/* 全角数字を半角へ。IMEの確定が届かず全角のまま残ることがあるため、
   画面表示だけでなく「値を読む側」でも必ず通す */
function toHalfDigits(s){
  return String(s==null?'':s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFF10+0x30);});
}
/* 入力欄から数値の文字列を取り出す（全角・カンマ・空白すべて吸収） */
function readNum(el){
  if(!el)return '';
  var v=toHalfDigits(el.value);
  var raw=v.replace(/[^\d]/g,'');
  if(!raw&&el.dataset&&el.dataset.val)raw=String(el.dataset.val).replace(/[^\d]/g,'');
  if(raw.length>NUM_MAXLEN)raw=raw.slice(0,NUM_MAXLEN);
  return raw;
}
/* IMEが確定イベントを返さない環境向けの保険。キーを離した時点で変換中でなければ整形し直す */
function fmtNKeyup(el,e){
  if(e&&e.isComposing)return;
  if(e&&(e.key==='Process'||e.keyCode===229))return;
  if(/[０-９]/.test(el.value))fmtN(el);
}

/* ---- カンマ区切り数値入力（稽古録から移植・そのまま） ---- */
var isBrave=false;
if(navigator.brave&&typeof navigator.brave.isBrave==='function'){
  navigator.brave.isBrave().then(function(b){isBrave=b;});
}
var NUM_MAXLEN=15; // 数値入力の桁数上限（JSの安全整数=16桁。15桁に収めて丸めを防ぐ）
function fmtN(el,e){
  if(isBrave)return;
  if(e&&e.isComposing)return; // IME変換中は割り込まない
  // 整形前にカーソル左側の「数字の桁数」を同期で記録（全角数字も数える）
  var _sel=el.selectionStart;
  var _digitsBefore=(_sel==null)?-1:el.value.slice(0,_sel).replace(/[^\d０-９]/g,'').length;
  requestAnimationFrame(function(){
    // 全角→半角に変換してから数字だけ抽出
    var v=el.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFF10+0x30);});
    var raw=v.replace(/[^\d]/g,'');
    if(raw.length>NUM_MAXLEN)raw=raw.slice(0,NUM_MAXLEN); // 桁数上限（丸め防止）
    el.dataset.val=raw;
    if(!raw){el.value='';return;}
    var formatted=parseInt(raw).toLocaleString('ja-JP');
    if(el.value!==formatted)el.value=formatted;
    // カーソルを「同じ桁数だけ進めた位置」に戻す（末尾固定をやめる）
    if(_digitsBefore<0){return;}
    var pos=0,seen=0;
    while(pos<formatted.length&&seen<_digitsBefore){
      var cc=formatted.charCodeAt(pos);
      if(cc>=48&&cc<=57)seen++; // 0-9
      pos++;
    }
    try{el.setSelectionRange(pos,pos);}catch(_e){}
  });
}
function fmtNFocus(el){
  var raw=el.dataset.val||el.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFF10+0x30);}).replace(/[^\d]/g,'');
  if(raw.length>NUM_MAXLEN)raw=raw.slice(0,NUM_MAXLEN);
  el.dataset.val=raw;
  el.value=raw||'';
}
function fmtNBlur(el){
  var v=el.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFF10+0x30);});
  var raw=v.replace(/[^\d]/g,'');
  if(raw.length>NUM_MAXLEN)raw=raw.slice(0,NUM_MAXLEN);
  el.dataset.val=raw;
  if(!raw){el.value='';return;}
  el.value=parseInt(raw).toLocaleString('ja-JP');
}
function numFromEl(el){if(!el)return 0;return parseInt((el.value||'').replace(/[^\d]/g,''))||0;}

/* ---- テーマ / モード（3択・system追従） ------------- */
function effMode(){
  var m=DB.settings.mode||'system';
  if(m==='light')return 'light';
  if(m==='dark')return 'dark';
  return (window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
}
function applyTheme(){
  document.body.className=(effMode()==='light')?'light':'';
  renderModeSeg();
  // グラフの配色はCSS変数/明暗依存なので、テーマ変更時に描き直す
  if(_chart&&document.getElementById('scr-detail')&&document.getElementById('scr-detail').className===''){
    drawChart();
  }
}
function renderModeSeg(){
  var cur=DB.settings.mode||'system';
  document.querySelectorAll('#modeSeg button').forEach(function(b){
    b.classList.toggle('on',b.dataset.mode===cur);
  });
}
function setMode(m){DB.settings.mode=m;saveSetting();applyTheme();}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){
    if((DB.settings.mode||'system')==='system')applyTheme();
  });
}

/* ---- 画面遷移 ---------------------------------------- */
function go(scr){
  document.getElementById('scr-list').className=(scr==='list')?'':'hide';
  document.getElementById('scr-detail').className=(scr==='detail')?'':'hide';
  window.scrollTo(0,0);
}

/* ---- 一覧描画 ---------------------------------------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function evBadge(ev){
  if(isEnded(ev))return '<span class="ev-badge done">終了</span>';
  var r=remainDays(ev);
  var txt='開催中';
  if(r>0)txt+='・残り'+r+'日';
  else if(r===0)txt+='・本日まで';
  return '<span class="ev-badge live">'+txt+'</span>';
}
function evSubLine(ev){
  var mats=ev.materials||[];
  var matTxt;
  if(ev.multi)matTxt='断片 '+mats.length+'種';
  else matTxt=(mats[0]&&mats[0].name)?esc(mats[0].name):'素材未設定';
  return fmtDateFull(ev.start)+' 〜 '+fmtDateFull(ev.end)+'（'+spanDays(ev)+'日間）・'+matTxt;
}
function evCardHtml(ev){
  var cum=evCum(ev),tgt=evTarget(ev);
  var barW,barColor,statL,statR;
  if(ev.normaOn&&tgt>0){
    // ノルマON: 収集進捗（累計/目標）を琥珀バーで。右肩は先取り/遅れ
    barW=Math.min(100,Math.round(cum/tgt*100));
    barColor='linear-gradient(90deg,var(--acc),#e8c88a)';
    statL=cum.toLocaleString('ja-JP')+' / '+tgt.toLocaleString('ja-JP')+' 個';
    var m0=(ev.materials||[])[0];
    var nc0=m0?normaCalc(ev,m0):null;
    if(!ev.multi&&nc0){
      if(nc0.done)statR='<b style="color:var(--ok)">達成 🎉</b>';
      else if(isEnded(ev))statR='<span>未達で終了</span>';
      else if(nc0.diff>0)statR='<b>＋'+nc0.diff+'日 先取り中</b>';
      else if(nc0.diff===0)statR='<b>ペース通り</b>';
      else statR='<b style="color:var(--warn)">−'+(-nc0.diff)+'日 遅れ</b>';
    }else{
      // 異去は素材ごとに進み方が違うので、いちばん遅れている素材を代表に出す
      var mats=(ev.materials||[]).filter(function(m){return (+m.target||0)>0;});
      statL='素材'+(ev.materials||[]).length+'種 合計 '+cum.toLocaleString('ja-JP')+' / '+tgt.toLocaleString('ja-JP')+' 個';
      if(!mats.length){statR='<span>'+barW+'%</span>';}
      else{
        var worst=mats.map(function(m){return normaCalc(ev,m);})
                      .sort(function(a,b){return a.diff-b.diff;})[0];
        if(mats.every(function(m){return normaCalc(ev,m).done;}))statR='<b style="color:var(--ok)">全素材 達成 🎉</b>';
        else if(isEnded(ev))statR='<span>未達で終了</span>';
        else if(worst.diff>0)statR='<b>いちばん遅い素材で ＋'+worst.diff+'日</b>';
        else if(worst.diff===0)statR='<b>ペース通り</b>';
        else statR='<b style="color:var(--warn)">いちばん遅い素材で −'+(-worst.diff)+'日</b>';
      }
    }
  }else{
    // ノルマOFF: 期間の経過（日付ベース）を青バーで。数値は累計のみ
    var total=Math.max(1,diffDays(ev.start,ev.end));
    var passed=Math.min(total,Math.max(0,diffDays(ev.start,todayStr())));
    barW=Math.round(passed/total*100);
    barColor='var(--acc2)';
    statL='累計 '+cum.toLocaleString('ja-JP')+' 個';
    statR='<span>グラフ記録のみ</span>';
  }
  return '<button class="ev-item" onclick="openDetail(\''+ev.id+'\')">'
    +'<div class="ev-top"><span class="ev-name">'+esc(ev.name)+'</span>'+evBadge(ev)+'</div>'
    +'<div class="ev-sub">'+evSubLine(ev)+'</div>'
    +'<div class="ev-bar"><i style="width:'+barW+'%;background:'+barColor+'"></i></div>'
    +'<div class="ev-stat"><span>'+statL+'</span>'+statR+'</div>'

/* ---- ノルマ計算（計画書3節） ------------------------- */
function addDaysStr(s,n){var d=parseYmd(s);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
function normaCalc(ev,mat){
  var target=+(mat&&mat.target)||0;
  var cum=mat?matCum(mat):0;
  var pdays=Math.max(1,periodDays(ev));
  var fixed=target>0?Math.ceil(target/pdays):0;      // 固定ノルマ = 目標 ÷ 分母日数
  var rem=remainDays(ev);                            // 残り日数（0以下は締切扱い）
  var left=Math.max(0,target-cum);
  var recovery=(left>0&&rem>0)?Math.ceil(left/rem):0; // リカバリー = 残り ÷ 残り日数
  var todayNo=diffDays(ev.start,todayStr())+1;        // 今日が何日目
  var achDay=fixed>0?Math.floor(cum/fixed):0;         // 何日目の分まで集まったか
  var achDayCap=Math.min(achDay,pdays);
  var achDate=achDayCap>=1?addDaysStr(ev.start,achDayCap-1):null;
  return {target:target,cum:cum,pdays:pdays,fixed:fixed,rem:rem,left:left,
          recovery:recovery,todayNo:todayNo,achDay:achDay,achDayCap:achDayCap,
          achDate:achDate,diff:achDay-todayNo,done:(target>0&&cum>=target)};
}

/* ヒーロー（先取り表示＋ゲージ） */
function heroHtml(ev,mat,nc){
  var cls='',lbl='現在のペース',main='',sub='';
  var ended=isEnded(ev);

  if(nc.done){
    cls=' doneall';
    main='🎉 目標達成';
    sub='累計 '+nc.cum.toLocaleString('ja-JP')+' 個。目標 '+nc.target.toLocaleString('ja-JP')+' 個を達成しました。';
    if(nc.cum>nc.target)sub+='（'+(nc.cum-nc.target).toLocaleString('ja-JP')+' 個 超過）';
  }else if(ended){
    cls=' behind';lbl='結果';
    main='未達で終了';
    sub='累計 '+nc.cum.toLocaleString('ja-JP')+' / '+nc.target.toLocaleString('ja-JP')+' 個。'
      +'あと '+nc.left.toLocaleString('ja-JP')+' 個 届きませんでした。';
  }else if(nc.achDay<1){
    cls=' behind';
    main='まだ1日目の分に届いていません';
    sub='固定ノルマは 1日 '+nc.fixed.toLocaleString('ja-JP')+' 個。'
      +'累計 '+nc.cum.toLocaleString('ja-JP')+' 個です。';
  }else{
    var d=nc.diff;
    if(d>0){main=fmtDate(nc.achDate)+' の分まで先取り中<small>（'+nc.achDayCap+'日目まで・＋'+d+'日）</small>';}
    else if(d===0){main=fmtDate(nc.achDate)+' の分まで<small>（'+nc.achDayCap+'日目まで・ぴったり）</small>';}
    else{cls=' behind';main=fmtDate(nc.achDate)+' の分まで<small>（'+nc.achDayCap+'日目まで・−'+(-d)+'日 遅れ）</small>';}
    sub='累計 '+nc.cum.toLocaleString('ja-JP')+' 個。固定ノルマ換算で、'
      +fmtDateFull(nc.achDate)+'（'+nc.achDayCap+'日目）のぶんまで集まっています。';
    if(d<0&&nc.recovery>0)sub+='<br>今日は リカバリーノルマ '+nc.recovery.toLocaleString('ja-JP')+' 個/日 が目安です。';
  }

  // ゲージ: 塗り=累計/目標、縦線=今日の位置
  var fillPct=nc.target>0?Math.min(100,nc.cum/nc.target*100):0;
  var todayPct=Math.min(100,Math.max(0,(nc.todayNo-.5)/nc.pdays*100));
  var lastDay=addDaysStr(ev.start,nc.pdays-1);
  var todayCap=ended?'終了済み':'今日 '+fmtDateFull(todayStr()).slice(5);

  return '<div class="hero'+cls+'">'
    +'<div class="hero-lbl">'+lbl+'</div>'
    +'<div class="hero-main">'+main+'</div>'
    +'<div class="hero-sub">'+sub+'</div>'
    +'<div class="gauge"><div class="gauge-track">'
      +'<div class="gauge-fill" style="width:'+fillPct.toFixed(1)+'%"></div>'
      +(ended?'':'<div class="gauge-today" style="left:'+todayPct.toFixed(1)+'%"></div>')
    +'</div>'
    +'<div class="gauge-cap"><span>'+fmtDateFull(ev.start).slice(5)+' 開始</span>'
      +'<span>'+todayCap+'</span>'
      +'<span>'+fmtDateFull(lastDay).slice(5)+' 締切</span></div></div>'
  +'</div>';
}

function msSorted(mat){
  return ((mat&&mat.milestones)||[]).slice().sort(function(a,b){
    if((+a.need||0)!==(+b.need||0))return (+a.need||0)-(+b.need||0);
    return (a.order||0)-(b.order||0);
  });
}
function achievedIds(mat){
  var cum=matCum(mat);
  return msSorted(mat).filter(function(m){return cum>=(+m.need||0);}).map(function(m){return m.id;});
}

    var body='<div class="ms-name'+(done?' done':'')+'">'+nameTxt+'</div>';

/* ドラッグ並べ替え（マウス・タッチ共通のポインタイベント）
   移動中に要素をDOMで動かすため、追跡は document で受ける
   （つまんだ要素自身に setPointerCapture すると、並べ替えの瞬間に追跡が切れてしまう） */
var _drag=null;
function tabDragStart(e,id){
  e.preventDefault();e.stopPropagation();
  var el=e.target.parentNode;
  if(!el||!el.classList.contains('mat-tab'))return;
  _drag={id:id,el:el,moved:false};
  el.classList.add('dragging');
  var wrap=document.getElementById('matTabs');
  if(wrap)wrap.classList.add('dragging-on'); // 掴んでいる間、他のタブを控えめにする
  if(navigator.vibrate){try{navigator.vibrate(12);}catch(_v){}} // 掴んだ合図（対応端末のみ）
  document.addEventListener('pointermove',tabDragMove,{passive:false});
  document.addEventListener('pointerup',tabDragEnd);
  document.addEventListener('pointercancel',tabDragEnd);
}
function tabDragMove(e){
  if(!_drag)return;
  e.preventDefault();
  var wrap=document.getElementById('matTabs');if(!wrap)return;
  var items=[].slice.call(wrap.querySelectorAll('.mat-tab[data-id]'));
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it===_drag.el)continue;
    var r=it.getBoundingClientRect();
    if(e.clientY<r.top||e.clientY>r.bottom)continue; // 折り返した場合は同じ行だけ見る
    var mid=r.left+r.width/2;
    var dragIsAfter=!!(it.compareDocumentPosition(_drag.el)&Node.DOCUMENT_POSITION_FOLLOWING);
    if(e.clientX<mid&&dragIsAfter){wrap.insertBefore(_drag.el,it);_drag.moved=true;break;}
    if(e.clientX>mid&&!dragIsAfter){wrap.insertBefore(_drag.el,it.nextSibling);_drag.moved=true;break;}
  }
}
function tabDragEnd(){
  document.removeEventListener('pointermove',tabDragMove);
  document.removeEventListener('pointerup',tabDragEnd);
  document.removeEventListener('pointercancel',tabDragEnd);
  if(!_drag)return;
  _drag.el.classList.remove('dragging');
  var wrapEl=document.getElementById('matTabs');
  if(wrapEl)wrapEl.classList.remove('dragging-on');
  var moved=_drag.moved;
  var tappedId=_drag.id;
  _drag=null;
  // 動かさずに離した＝ただのタップ。何も起きないと分かりにくいので、そのタブを選ぶ
  if(!moved){selectMat(tappedId);return;}
  var wrap=document.getElementById('matTabs');
  var ev=curEv();
  if(wrap&&ev){
    var ids=[].slice.call(wrap.querySelectorAll('.mat-tab[data-id]')).map(function(el){return el.getAttribute('data-id');});
    var byId={};(ev.materials||[]).forEach(function(m){byId[m.id]=m;});
    var next=ids.map(function(id){return byId[id];}).filter(Boolean);
    // 取りこぼしがあれば末尾に残す（記録を失わないため）
    (ev.materials||[]).forEach(function(m){if(next.indexOf(m)<0)next.push(m);});
    next.forEach(function(m,i){m.order=i;});
    ev.materials=next;ev.updatedAt=Date.now();save();
  }
  renderDetail();
}

      if(nc.done)d='<span class="sum-d" style="color:var(--ok)">達成</span>';
      else if(isEnded(ev))d='<span class="sum-d" style="color:var(--t4)">未達</span>';
      else if(nc.diff>0)d='<span class="sum-d" style="color:var(--acc)">＋'+nc.diff+'日</span>';
      else if(nc.diff===0)d='<span class="sum-d" style="color:var(--t4)">±0日</span>';
      else d='<span class="sum-d" style="color:var(--warn)">−'+(-nc.diff)+'日</span>';
    }else{
      v='累計 '+c.toLocaleString('ja-JP')+' 個';
    }
    return '<div class="sum-row'+(cur&&m.id===cur.id?' on':'')+'" onclick="selectMat(\''+m.id+'\')">'
      +'<span class="sum-n">'+esc(matName(m,i))+'</span>'
      +'<span class="sum-v">'+v+'</span>'+d+'</div>';
  }).join('');
  return '<div class="card"><div class="card-h">全素材まとめ '
    +'<span style="font-weight:400;color:var(--t4)">（押すとその素材に切り替わります）</span></div>'
    +rows+'</div>';
}

/* ---- 合計から差分入力（B） ---------------------------
   もとはモーダル「合計から入れる」だったが、記録入力そのものを
   「合計で入れる」を既定にする形へ作り替えたため、モーダルは廃止して
   記録カードの中に取り込んだ（描画は renderRecBody 以下）。
   ここに残るのは差分の配り方を決める計算だけ。                    */
var _recBulkMode='today'; // 差の配り方 'today'（今日にまとめて）| 'even'（未記録の日に均等割り）

/* 振り分け先の日: 最終記録日の翌日〜今日（なければ今日だけ） */
function bulkDays(ev,mat){
  var last=recordDates(mat)[0]||null;
  var end=maxRecDate(ev);
  var from=last?addDaysStr(last,1):ev.start;
  if(from<ev.start)from=ev.start;
  var out=[];
  for(var d=from;d<=end;d=addDaysStr(d,1))out.push(d);
  if(!out.length)out=[end];
  return out;
}
/* 差分の配り方を決める（プレビューと確定で同じ結果になるよう一本化） */
function bulkPlan(ev,mat,delta,mode){
  var days=bulkDays(ev,mat);
  if(mode==='even'&&days.length>1){
    var base=Math.floor(delta/days.length);
    var rest=delta-base*days.length;
    return days.map(function(d,i){
      return {date:d,add:base+(i===days.length-1?rest:0)}; // 端数は最後の日に寄せる
    });
  }
  return [{date:days[days.length-1],add:delta}]; // 今日（記録できる最終日）にまとめて
}

/* 記録のある日付を新しい順に */
function recordDates(mat){
  var r=(mat&&mat.records)||{};
  return Object.keys(r).sort(function(a,b){return b.localeCompare(a);});
}
/* 指定日までの累計 */
function cumUpTo(mat,date){
  var r=(mat&&mat.records)||{},s=0;
  for(var k in r){if(r.hasOwnProperty(k)&&k<=date)s+=(+r[k]||0);}
  return s;
}

/* 記録できる上限日: 終了日と今日の早いほう（未来の日には記録させない） */
function maxRecDate(ev){var t=todayStr();return (t<ev.end)?t:ev.end;}
/* 既定の記録日: 今日が期間内なら今日、期間前なら開始日、終了後なら終了日 */
function defaultRecDate(ev){
  var t=todayStr();
  if(t<ev.start)return ev.start;
  if(t>ev.end)return ev.end;
  return t;
}
/* ===== 収集数の入力（合計で入れる／その日の数で入れる） =====
   ゲーム画面には収集物の「合計」しか出ないため、既定は「合計で入れる」。
   入れた合計と記録済み累計の差を、記録できる最終日（ふつうは今日）に入れる。
   記録し忘れた日があるときだけ、差の配り方を選ばせる。               */
function recMode(){return (DB.settings.recMode==='daily')?'daily':'total';}
function setRecMode(m){
  DB.settings.recMode=(m==='daily')?'daily':'total';
  saveSetting();
  renderRecBody();
}
/* 記録が入る日（終了後のイベントなら最終日）と、その呼び名 */
function recLandDate(ev){return maxRecDate(ev);}
function recLandLabel(ev){
  var d=recLandDate(ev);
  if(d===todayStr())return '今日';
  return (d===ev.end)?'最終日':'';
}
/* 入力欄の文字から直接読む（カンマ整形の完了を待たずに済むよう dataset は使わない） */
function readTypedTotal(){
  var el=document.getElementById('recTotal');
  if(!el)return null;
  var raw=toHalfDigits(el.value||'').replace(/[^\d]/g,'');
  return (raw==='')?null:parseInt(raw,10);
}

function renderRecBody(){
  var host=document.getElementById('recBody');
  if(!host)return;
  var m=recMode();
  var btns=document.querySelectorAll('#recSeg button');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].dataset.v===m);
  host.innerHTML=(m==='total')?recTotalHtml():recDailyHtml();
  // 初回描画では入力欄を空のままにする（従来どおり）。日付を変えたときだけ onRecDateChange が現在値を出す
  if(m==='total')updateRecPreview();
  else updateRecNote();
}

/* --- 合計で入れる --- */
function recTotalHtml(){
  var ev=curEv(),mat=curMat();
  if(!ev||!mat)return '<div class="bulk-empty">素材が登録されていません。「⚙ 編集」から素材を追加してください。</div>';
  var land=recLandDate(ev),lab=recLandLabel(ev);
  var days=bulkDays(ev,mat);
  var h=''
   +'<div class="in-row">'
     +'<div class="fld" style="flex:0 0 auto;min-width:0"><label class="lbl">記録する日'+(lab?'（'+lab+'）':'')+'</label>'
       +'<div class="rec-fixdate">'+fmtDateFull(land)+'</div></div>'
     +'<div class="fld"><label class="lbl">いまの合計</label>'
       +'<input type="text" id="recTotal" inputmode="numeric" placeholder="例: 8,680" '
         +'oninput="fmtN(this,event);updateRecPreview()" oncompositionend="fmtN(this);updateRecPreview()" '
         +'onfocus="fmtNFocus(this)" onblur="fmtNBlur(this);updateRecPreview()" '
         +'onkeyup="fmtNKeyup(this,event);updateRecPreview()" '
         +'onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229)submitTotal()"></div>'
     +ticketInputHtml(ev)
     +'<button class="btn pri" onclick="submitTotal()">記録する</button>'
   +'</div>';
  if(days.length>1){
    h+='<div class="fld" style="margin-top:12px"><label class="lbl">'
      +'記録がない日が '+days.length+' 日あります。差の分をどう入れますか</label>'
      +'<div class="seg" id="recBulkSeg">'
        +'<button data-v="today"'+(_recBulkMode==='today'?' class="on"':'')+' onclick="setRecBulkMode(\'today\')">今日にまとめて</button>'
        +'<button data-v="even"'+(_recBulkMode==='even'?' class="on"':'')+' onclick="setRecBulkMode(\'even\')">未記録の日に均等割り</button>'
      +'</div></div>';
  }
  h+='<div class="err" id="recErr"></div>'
    +'<div id="recPrev"></div>'
    +'<div class="in-note" id="recNote"></div>';
  return h;
}
function setRecBulkMode(m){
  _recBulkMode=(m==='even')?'even':'today';
  var btns=document.querySelectorAll('#recBulkSeg button');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].dataset.v===_recBulkMode);
  updateRecPreview();
}
/* 「今日にまとめて」を選ぶと記録がないまま残る日を、選ぶ前から見せる */
function leftOverHtml(ev,mat){
  var days=bulkDays(ev,mat);
  if(days.length<2||_recBulkMode!=='today')return '';
  var left=days.slice(0,days.length-1);
  var txt=(left.length===1)
    ? mdwTxt(left[0])
    : mdwTxt(left[0])+'〜'+mdwTxt(left[left.length-1])+' の '+left.length+'日';
  return '<div class="rec-left">この入れ方だと、<b>'+txt+'</b>は記録がないまま残ります。<br>'
    +'その日ぶんも形に残したいときは「未記録の日に均等割り」を選んでください。</div>';
}
function mdwTxt(d){return fmtDateFull(d).slice(5)+'（'+WD[parseYmd(d).getDay()]+'）';}

/* 合計モードの手形の案内。
   合計モードは「差」を日に振り分けるが、手形にはそれができない。何日に何枚買ったかが
   合計からは分からないため（ゲームに「これまでに買った合計」という数字も無い）。
   なので手形だけは、記録する日にまとめて足す。挙動が違うので必ず一言添える。   */
function ticketTotalNote(ev){
  if(!ticketOn(ev))return '';
  var nm=esc(ticketName(ev));
  var s='<br>※'+nm+'は日ごとに振り分けず、<b>'+fmtDateFull(recLandDate(ev))+'</b> にまとめて<b>足します</b>。';
  var t=ticketOf(ev,recLandDate(ev));
  if(t>0)s+='（この日はいま '+ticketTxt(ev,t)+'）';
  return s;
}
function updateRecPreview(){
  var ev=curEv(),mat=curMat();
  var err=document.getElementById('recErr');
  var prev=document.getElementById('recPrev');
  var note=document.getElementById('recNote');
  if(!ev||!mat||!prev||!note)return;
  var cur=matCum(mat);
  var typed=readTypedTotal();
  var multiMat=((ev.materials||[]).length>1)
    ? '<br>※素材タブを切り替えて素材ごとに入力します。グラフ・ノルマ・マイルストーンも素材ごとです。' : '';
  multiMat=ticketTotalNote(ev)+multiMat;
  if(err)err.textContent='';

  if(typed===null){
    prev.innerHTML=leftOverHtml(ev,mat);
    note.innerHTML='※いま記録されている累計は <b>'+cur.toLocaleString('ja-JP')+'</b> 個です。'
      +'ゲーム画面に出ている合計をそのまま入れてください。差の分だけが記録されます。'+multiMat;
    return;
  }
  var delta=typed-cur;
  if(delta<0){
    prev.innerHTML='';
    if(err)err.innerHTML='入力した合計（'+typed.toLocaleString('ja-JP')+'）が、記録済みの累計（'
      +cur.toLocaleString('ja-JP')+'）より少ないです。数を減らすときは、下の「日別記録」から直してください。';
    note.innerHTML='';
    return;
  }
  if(delta===0){
    prev.innerHTML='';
    note.innerHTML=(ticketOn(ev)
      ? '※記録済みの累計と同じです。集めた数として入れるものはありません。'
      : '※記録済みの累計と同じです。入れるものはありません。')+multiMat;
    return;
  }
  var plan=bulkPlan(ev,mat,delta,_recBulkMode);
  if(plan.length>1){
    prev.innerHTML='<div class="fld" style="margin-top:12px"><label class="lbl">こう入ります（確認）</label>'
      +'<div class="bulk-prev">'+plan.map(function(p){
          var old=(mat.records&&mat.records[p.date])?(+mat.records[p.date]||0):0;
          return '<div class="bulk-prow"><span class="pd">'+mdwTxt(p.date)+'</span>'
            +'<span class="pv">'+(old?old.toLocaleString('ja-JP')+' → ':'')+'<b>'+(old+p.add).toLocaleString('ja-JP')+'</b> 個</span></div>';
        }).join('')+'</div>'
      +'<div class="bulk-warn">※均等割りは実際の日ごとの数とは違うので、グラフの形は実態と変わります。</div></div>';
  }else{
    prev.innerHTML=leftOverHtml(ev,mat);
  }
  note.innerHTML='※差の <b>'+delta.toLocaleString('ja-JP')+'</b> 個を'
    +(plan.length>1?'上の'+plan.length+'日に':' '+mdwTxt(plan[0].date)+' に')+'入れます。'+multiMat;
}

function submitTotal(){
  var ev=curEv(),mat=curMat();
  var err=document.getElementById('recErr');
  if(err)err.textContent='';
  if(!ev||!mat){if(err)err.textContent='素材が登録されていません。「⚙ 編集」から素材を追加してください。';return;}
  var typed=readTypedTotal();
  var tn=readTicketInput();   /* 買い足した手形。合計モードでも欄はそのまま出す */
  if(typed===null){
    /* 手形だけ入っているなら、それだけ記録する */
    if(tn>0){applyTicketOnly(ev,mat,tn);return;}
    if(err)err.textContent=ticketOn(ev)
      ? '「いまの合計」か、買い足した'+ticketName(ev)+'のどちらかを入力してください。'
      : '「いまの合計」を入力してください。';
    return;
  }
  var delta=typed-matCum(mat);
  /* 数が食い違っているときは手形も入れない。先に数のほうを直してもらう */
  if(delta<0){if(err)err.textContent='記録済みの累計より少ない数は入れられません。減らすときは下の「日別記録」から直してください。';return;}
  if(delta===0){
    if(tn>0){applyTicketOnly(ev,mat,tn);return;}
    if(err)err.textContent='記録済みの累計と同じです。入れるものはありません。';return;
  }
  var plan=bulkPlan(ev,mat,delta,_recBulkMode);
  if(!mat.records)mat.records={};
  var before=achievedIds(mat);
  var beforeDone=(+mat.target>0)&&(matCum(mat)>=+mat.target);
  plan.forEach(function(p){
    setRec(mat,p.date,(+mat.records[p.date]||0)+p.add);
  });
  /* 手形は振り分けない。何日に何枚買ったかは合計からは分からないので、
     記録する日（ふつうは今日）にまとめて足す。                        */
  if(tn>0)addTicket(ev,recLandDate(ev),tn);
  ev.updatedAt=Date.now();
  save();
  _recBulkMode='today';
  renderDetail();renderList();
  if(!celebrate(ev,mat,before,beforeDone)){
    var msg=delta.toLocaleString('ja-JP')+' 個を'+(plan.length>1?plan.length+'日に振り分けて':'')+'記録しました';
    if(tn>0)msg=delta.toLocaleString('ja-JP')+' 個／'+ticketName(ev)+' '+tn.toLocaleString('ja-JP')+ticketUnit(ev)+'を記録しました';
    toast(msg);
  }
}
/* 合計モードで、手形だけを記録する */
function applyTicketOnly(ev,mat,tn){
  addTicket(ev,recLandDate(ev),tn);
  ev.updatedAt=Date.now();
  save();
  renderDetail();renderList();
  toast(fmtDateFull(recLandDate(ev))+' に '+ticketName(ev)+' '+tn.toLocaleString('ja-JP')+ticketUnit(ev)+'を記録しました');
}

/* --- その日の数で入れる（従来の入力） --- */
function recDailyHtml(){
  var ev=curEv();
  if(!ev)return '';
  return '<div class="in-row">'
      +'<div class="fld"><label class="lbl">日付</label>'
        /* 選べるのは イベント開始日 〜（今日と終了日の早いほう）。範囲外はカレンダーで押せない */
        +calField('recDate',defaultRecDate(ev),ev.start,maxRecDate(ev),'onRecDateChange')+'</div>'
      +'<div class="fld"><label class="lbl" id="recNumLbl">その日集めた数</label>'
        +'<input type="text" id="recNum" inputmode="numeric" placeholder="例: 1200" '
          +'oninput="fmtN(this,event)" oncompositionend="fmtN(this)" '
          +'onfocus="fmtNFocus(this)" onblur="fmtNBlur(this)" onkeyup="fmtNKeyup(this,event)" '
          +'onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229)submitRecord()"></div>'
      +ticketInputHtml(ev)
      +'<button class="btn pri" onclick="submitRecord()">記録する</button>'
    +'</div>'
    +'<div class="err" id="recErr"></div>'
    +'<div class="in-note" id="recNote"></div>';
}

/* 手形の入力欄。隣の収集物の欄と挙動が違う（あちらは上書き、こちらは足し算）ので、
   ラベルを「買い足した◯◯」にして、下の案内でも毎回そう言い続ける。          */
function ticketInputHtml(ev){
  if(!ticketOn(ev))return '';
  return '<div class="fld"><label class="lbl">買い足した'+esc(ticketName(ev))+'</label>'
    +'<input type="text" id="recTicket" inputmode="numeric" placeholder="例: 6" '
      +'oninput="fmtN(this,event)" oncompositionend="fmtN(this)" '
      +'onfocus="fmtNFocus(this)" onblur="fmtNBlur(this)" onkeyup="fmtNKeyup(this,event)" '
      +'onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229)'
        +(recMode()==='daily'?'submitRecord()':'submitTotal()')+'"></div>';
}
/* 手形の欄から枚数を読む。欄が無い・空・0 はすべて 0（＝買っていない）扱い */
function readTicketInput(){
  var el=document.getElementById('recTicket');
  if(!el)return 0;
  var raw=readNum(el);
  if(raw==='')return 0;
  var n=parseInt(raw,10);
  return (isNaN(n)||n<0)?0:n;
}

function onRecDateChange(){
  updateRecNote();
  // その日にすでに記録があれば、入力欄に現在値を出しておく（上書き前提が見えるように）
  var mat=curMat(),d=(document.getElementById('recDate')||{}).value;
  var el=document.getElementById('recNum');
  if(!mat||!el)return;
  var has=mat.records&&mat.records.hasOwnProperty(d);
  if(has){el.value=(+mat.records[d]).toLocaleString('ja-JP');el.dataset.val=String(+mat.records[d]);}
  else{el.value='';el.dataset.val='';}
  /* 手形の欄には**触らない**。ここで今の枚数を出すと、そのまま記録したときに
     足し算なので二重に足されてしまう。打った数もそのまま残す（日付を選び直した
     だけで消えると、入れ直しになるため）。今その日に何枚あるかは下の案内で見せる。 */
}
function updateRecNote(){
  var ev=curEv(),mat=curMat();
  var d=(document.getElementById('recDate')||{}).value;
  var note=document.getElementById('recNote');
  var lbl=document.getElementById('recNumLbl');
  if(!ev||!note)return;
  var isToday=(d===todayStr());
  if(lbl)lbl.textContent=isToday?'今日集めた数':'その日集めた数';
  var msg='';
  if(mat&&d&&mat.records&&mat.records.hasOwnProperty(d)){
    msg='※'+fmtDateFull(d)+' はすでに <b>'+(+mat.records[d]).toLocaleString('ja-JP')+'</b> 個で記録済みです。記録すると上書きされます。';
  }else{
    msg='※日付を変えれば、記録し忘れた過去の日にも入力できます。入れるのは「その日に集めた数」（累計ではありません）。';
  }
  if(ticketOn(ev)){
    var nm=esc(ticketName(ev));
    var t=ticketOf(ev,d);
    /* 隣の欄は上書き、この欄は足し算。同じ行で挙動が違うので、毎回そう書き続ける */
    msg+='<br>※'+nm+'の欄は、入れた数が<b>足されます</b>（上書きではありません）。買っていない日は空のままで大丈夫です。';
    if(t>0){
      msg+='<br>※'+(isToday?'今日':fmtDateFull(d)+' に')+'買った'+nm+' <b>'+ticketTxt(ev,t)+'</b>。'
        +'打ち間違いは下の「日別記録」から直せます。';
    }
  }
  if((ev.materials||[]).length>1){
    msg+='<br>※素材タブを切り替えて素材ごとに入力します。グラフ・ノルマ・マイルストーンも素材ごとです。';
  }
  note.innerHTML=msg;
}

function submitRecord(){
  var ev=curEv(),mat=curMat();
  var err=document.getElementById('recErr');
  if(err)err.textContent='';
  if(!ev||!mat){if(err)err.textContent='素材が登録されていません。「⚙ 編集」から素材を追加してください。';return;}
  var d=(document.getElementById('recDate')||{}).value;
  var el=document.getElementById('recNum');
  var raw=readNum(el);

  if(!d){if(err)err.textContent='日付を選んでください。';return;}
  if(d<ev.start||d>ev.end){
    if(err)err.textContent='イベント期間（'+fmtDateFull(ev.start)+'〜'+fmtDateFull(ev.end)+'）の中の日付を選んでください。';return;
  }
  if(d>todayStr()){
    if(err)err.textContent='まだ来ていない日には記録できません。';return;
  }
  var tn=readTicketInput();   /* 買い足した手形。欄が無い・空・0 なら 0 */

  if(raw===''){
    /* 手形だけ入っているなら、それだけ記録する。
       朝に手形を買って、集めた数は夜に入れる、という順番があるため。 */
    if(tn>0){applyRecord(d,null,tn);return;}
    if(err)err.textContent=ticketOn(ev)
      ? '集めた数か、買い足した'+ticketName(ev)+'のどちらかを入力してください。'
      : '集めた数を入力してください（0でも記録できます）。';
    return;
  }
  var n=parseInt(raw,10);
  if(isNaN(n)){if(err)err.textContent='数字で入力してください。';return;}

  if(mat.records&&mat.records.hasOwnProperty(d)&&(+mat.records[d])!==n){
    var old=(+mat.records[d]).toLocaleString('ja-JP');
    /* 手形も一緒に入っているときは、そちらは足し算だと確認文にも書いておく */
    var addTxt=(tn>0)
      ? '<br><span style="font-size:12px;color:var(--t4)">買い足した'+esc(ticketName(ev))+' '
        +tn.toLocaleString('ja-JP')+ticketUnit(ev)+' も一緒に記録されます（こちらは足し算です）。</span>'
      : '';
    askConfirm(fmtDateFull(d)+' はすでに <b>'+old+'</b> 個で記録されています。<br>'
      +'<b>'+n.toLocaleString('ja-JP')+'</b> 個で上書きしますか？'+addTxt,
      function(){applyRecord(d,n,tn);},'上書きする');
    return;
  }
  applyRecord(d,n,tn);
}
/* n が null なら収集数は触らず、手形だけ記録する */
function applyRecord(d,n,tn){
  var ev=curEv(),mat=curMat();
  if(!ev||!mat)return;
  if(!mat.records)mat.records={};
  var before=achievedIds(mat);
  var beforeDone=(+mat.target>0)&&(matCum(mat)>=+mat.target);
  if(n!==null&&n!==undefined)setRec(mat,d,n);
  if(tn>0)addTicket(ev,d,tn);   /* 上書きではなく足し算。時刻は addTicket が打つ */
  ev.updatedAt=Date.now();
  save();
  var el=document.getElementById('recNum');
  if(el){el.value='';el.dataset.val='';}
  /* 手形の欄は renderDetail が描き直すことで空に戻る（記録欄ごと作り直されるため） */
  renderDetail();
  if(!celebrate(ev,mat,before,beforeDone)){
    var msg;
    if(n===null||n===undefined){
      msg=fmtDateFull(d)+' に '+ticketName(ev)+' '+tn.toLocaleString('ja-JP')+ticketUnit(ev)+'を記録しました';
    }else{
      msg=fmtDateFull(d)+' に '+n.toLocaleString('ja-JP')+' 個';
      if(tn>0)msg+='／'+ticketName(ev)+' '+tn.toLocaleString('ja-JP')+ticketUnit(ev);
      msg+='を記録しました';
    }
    toast(msg);
  }
}

/* 記録の前後で達成状況を比べ、新たに到達したものだけ演出する */
function celebrate(ev,mat,before,beforeDone){
  if(!ev.normaOn||!ev.milestoneToast)return false;
  var afterDone=(+mat.target>0)&&(matCum(mat)>=+mat.target);
  if(afterDone&&!beforeDone){
    toast('🎉 目標 '+(+mat.target).toLocaleString('ja-JP')+' 個を達成しました！',true);
    return true;
  }
  var after=achievedIds(mat);
  var fresh=after.filter(function(id){return before.indexOf(id)<0;});
  if(!fresh.length)return false;
  var list=msSorted(mat);
  var hit=fresh.map(function(id){return list.find(function(m){return m.id===id;});})
               .filter(Boolean)
               .sort(function(a,b){return (+b.need||0)-(+a.need||0)})[0]; // 一度に複数なら大きい方を主役に
  if(!hit)return false;
  var msg='🎉 '+(+hit.need).toLocaleString('ja-JP')+'個 到達'+(hit.reward?' ― '+hit.reward:'')+'！';
  if(fresh.length>1)msg+='（他'+(fresh.length-1)+'件も同時に到達）';
  toast(msg,true);
  return true;
}

/* 日別記録リスト */
/* 日別記録に並べる日付。記録のある日に加えて、**手形しか入っていない日**も出す。
   手形だけ記録できるようにした以上、ここに出さないと打ち間違いを直す入口が無くなる。 */
function dayListDates(ev,mat){
  var s={};
  Object.keys((mat&&mat.records)||{}).forEach(function(d){s[d]=1;});
  if(ticketOn(ev))Object.keys((ev&&ev.tickets)||{}).forEach(function(d){s[d]=1;});
  return Object.keys(s).sort(function(a,b){return b.localeCompare(a);});
}
function renderDayList(){
  var ev=curEv(),mat=curMat();
  var host=document.getElementById('dayList');
  if(!host)return;
  var dates=dayListDates(ev,mat);
  if(!dates.length){
    host.innerHTML='<div class="empty" style="padding:20px 8px">まだ記録がありません。<br>上の欄から、ゲーム画面に出ている合計を入れてみてください。</div>';
    return;
  }
  var tkOn=ticketOn(ev);
  /* 列見出し。「日別」「累計」はグラフの凡例と同じ言葉。
     見出しは記録の行ではないので .day-row を付けない（行数の数え方を変えないため）。
     単位（個・枚）は出さない。収集物の行も元から単位なしで、枚数は小判カードに出る。 */
  var head='<div class="day-hd">'
    +'<span class="day-d"></span>'
    +'<span class="day-got">日別</span>'
    +'<span class="day-cum">累計</span>'
    +(tkOn?'<span class="day-tk">'+esc(ticketName(ev))+'</span>':'')
    +'</div>';
  host.innerHTML=head+dates.map(function(d){
    var has=mat&&mat.records&&mat.records.hasOwnProperty(d);
    var g=+((mat&&mat.records)||{})[d]||0;
    var c=cumUpTo(mat,d);
    var wd=WD[parseYmd(d).getDay()];
    var t=tkOn?ticketOf(ev,d):0;
    return '<div class="day-row">'
      +'<span class="day-d">'+fmtDateFull(d).slice(5)+'（'+wd+'）</span>'
      /* 手形しか入っていない日は「＋0」だと 0 個記録したように見えるので「―」にする */
      +(has?'<span class="day-got">＋<b>'+g.toLocaleString('ja-JP')+'</b></span>'
           :'<span class="day-got none">―</span>')
      +'<span class="day-cum">'+c.toLocaleString('ja-JP')+'</span>'
      +(tkOn?'<span class="day-tk">'+(t>0?'<b>'+t.toLocaleString('ja-JP')+'</b>':'')+'</span>':'')
      +'<button class="day-edit" onclick="openDayEdit(\''+d+'\')" title="修正">✎</button>'
      +'</div>';
  }).join('');
}

function saveDayEdit(d){
  var ev=curEv(),mat=curMat();if(!ev||!mat)return;
  var el=document.getElementById('dayNum');
  var raw=readNum(el);
  var err=document.getElementById('dayErr');
  if(err)err.textContent='';
  var hadRec=!!(mat.records&&mat.records.hasOwnProperty(d));
  var tEl=document.getElementById('dayTicket');
  var hasTicketField=ticketOn(ev)&&!!tEl;
  if(raw===''){
    /* もともと記録があった日で空にされたら、消すつもりなのか分からないので断る。
       消したいときは下の「削除」を通す。                                        */
    if(hadRec){
      if(err)err.textContent='数を入力してください（0でも記録できます）。この日の記録を消すときは「この日の記録を削除」を押してください。';
      return;
    }
    /* もともと記録が無い日（手形だけの日）は、空のままでよい */
    if(!hasTicketField){if(err)err.textContent='数を入力してください（0でも記録できます）。';return;}
  }
  var before=achievedIds(mat);
  var beforeDone=(+mat.target>0)&&(matCum(mat)>=+mat.target);
  if(raw!=='')setRec(mat,d,parseInt(raw,10));
  if(hasTicketField){
    /* ここは上書き。0 や空にしたらその日の手形を消す（setTicket が時刻も打つ） */
    var traw=readNum(tEl);
    var tn=(traw==='')?0:(parseInt(traw,10)||0);
    var hadTk=!!(ev.tickets&&ev.tickets.hasOwnProperty(d));
    /* 元から無く、入れた数も 0 なら何もしない。ここで setTicket を呼ぶと
       「この日は消された」という時刻だけが残り、別の端末の記録を消しにいく。 */
    if(tn>0||hadTk)setTicket(ev,d,tn);
  }
  ev.updatedAt=Date.now();save();closeModal();renderDetail();
  if(!celebrate(ev,mat,before,beforeDone)){
    toast(fmtDateFull(d)+' の記録を更新しました');
  }
}
function confirmDeleteDay(d){
  closeModal();
  var ev0=curEv();
  var tk=ticketOn(ev0)?ticketOf(ev0,d):0;
  var msg=fmtDateFull(d)+' の記録を削除します。';
  if(tk>0)msg+='<br>この日の'+esc(ticketName(ev0))+' <b>'+tk.toLocaleString('ja-JP')+ticketUnit(ev0)+'</b> も一緒に消えます。';
  msg+='<br>よろしいですか？';
  askConfirm(msg,function(){
    var ev=curEv(),mat=curMat();if(!ev||!mat)return;
    /* 無いものに時刻を打たないこと。打つと「そのとき消された」印になって、
       別の端末にある同じ日の記録まで消しにいく。                          */
    if(mat.records&&mat.records.hasOwnProperty(d))delRec(mat,d);
    if(ev.tickets&&ev.tickets.hasOwnProperty(d))setTicket(ev,d,0);
    ev.updatedAt=Date.now();save();renderDetail();
    toast(fmtDateFull(d)+' の記録を削除しました');
  },'削除する',true);
}

/* 軸を揃えるとき、目盛りが半端な数にならないよう上限をきりのいい値へ丸める */
function niceMax(v){
  if(!(v>0))return 10;
  var e=Math.pow(10,Math.floor(Math.log10(v)));
  var n=v/e;
  var m=(n<=1)?1:(n<=1.2)?1.2:(n<=1.5)?1.5:(n<=2)?2:(n<=2.5)?2.5:(n<=3)?3:(n<=4)?4:(n<=5)?5:(n<=6)?6:(n<=8)?8:10;
  return m*e;
}

/* マイルストーンの水平線を描くプラグイン（annotation非依存） */
var msLinePlugin={
  id:'msLines',
  afterDatasetsDraw:function(chart,args,opts){
    var lines=(opts&&opts.lines)||[];
    if(!lines.length)return;
    var sc=chart.scales.yCum;if(!sc)return;
    var ctx=chart.ctx,area=chart.chartArea;
    lines.forEach(function(L){
      var py=sc.getPixelForValue(L.value);
      if(py<area.top-1||py>area.bottom+1)return; // 表示範囲外は描かない
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([5,3]);
      ctx.lineWidth=1.5;
      ctx.strokeStyle=L.color;
      ctx.moveTo(area.left,py);ctx.lineTo(area.right,py);
      ctx.stroke();
      ctx.setLineDash([]);
      if(L.label){
        ctx.font='10px -apple-system,BlinkMacSystemFont,sans-serif';
        var tw=ctx.measureText(L.label).width;
        var tx=area.right-tw-6,ty=py-4;
        if(ty<area.top+9)ty=py+11;
        ctx.fillStyle=L.bg;
        ctx.fillRect(tx-4,ty-9,tw+8,13);
        ctx.fillStyle=L.color;
        ctx.fillText(L.label,tx,ty+1);
      }
      ctx.restore();
    });
  }
};

/* ---- グラフ描画（Chart.js） -------------------------- */
function drawChart(){
  var cv=document.getElementById('chartCv');
  if(!cv||typeof Chart==='undefined')return;
  var ev=curEv(),mat=curMat();
  if(_chart){_chart.destroy();_chart=null;}
  if(!ev||!mat)return;

  var dark=(effMode()==='dark');
  var gridCol=dark?'rgba(200,180,140,.12)':'rgba(100,80,50,.1)';
  var textCol=dark?'#a09070':'#7a6a58';
  var cs=getComputedStyle(document.documentElement);
  var accCol=(cs.getPropertyValue('--acc')||'').trim()||'#d9a960';
  var acc2Col=(cs.getPropertyValue('--acc2')||'').trim()||'#5b9fe8';
  var okCol=(cs.getPropertyValue('--ok')||'').trim()||'#7ec98a';
  var bg1Col=(cs.getPropertyValue('--bg1')||'').trim()||'#1e1610';

  // ラベル＝開始〜終了の全日（ノルマの分母ではなくカレンダー日数。前日まで設定でも最終日を描く）
  var n=Math.max(1,spanDays(ev));
  var labels=[],dates=[],start=parseYmd(ev.start);
  for(var i=0;i<n;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    dates.push(ymd(d));
    labels.push((d.getMonth()+1)+'/'+d.getDate());
  }
  var t=todayStr();
  var gains=dates.map(function(d){
    return (mat.records&&mat.records.hasOwnProperty(d))?(+mat.records[d]||0):null;
  });
  // 累計は今日までを繋いで描く（未来はnullで伸ばさない）
  var run=0;
  var cums=dates.map(function(d){
    if(mat.records&&mat.records.hasOwnProperty(d))run+=(+mat.records[d]||0);
    return (d<=t)?run:null;
  });

  // ノルマONかつ目標ありのときだけ、理想ペース線とマイルストーン線を用意する
  var nc=normaCalc(ev,mat);
  var showNorma=(ev.normaOn&&nc.target>0);
  var datasets=[
    {label:'日別収集数',data:gains,yAxisID:'yGain',order:3,
     backgroundColor:accCol,borderRadius:2,barPercentage:.72,categoryPercentage:.86},
    {label:'累計',data:cums,type:'line',yAxisID:'yCum',order:1,
     borderColor:acc2Col,backgroundColor:acc2Col,borderWidth:2.5,
     pointRadius:3,pointHoverRadius:5,tension:.1,spanGaps:true}
  ];
  if(showNorma&&gTog('ideal')){
    // 理想ペース = 固定ノルマ × 日数（目標で頭打ち）
    var ideal=dates.map(function(_d,i){return Math.min(nc.target,nc.fixed*(i+1));});
    datasets.push({label:'理想ペース',data:ideal,type:'line',yAxisID:'yCum',order:2,
      borderColor:textCol,borderWidth:1.5,borderDash:[5,4],
      pointRadius:0,pointHoverRadius:0,tension:0,fill:false});
  }
  var msLines=[];
  if(showNorma&&gTog('ms')){
    msLines=msSorted(mat).map(function(m){
      var need=+m.need||0;
      var done=nc.cum>=need;
      return {value:need,color:okCol,bg:bg1Col,
              label:(done?'✓ ':'')+need.toLocaleString('ja-JP')+(m.reward?' '+m.reward:'')};
    });
  }

  // 「日別と累計を合わせる」がONなら、左右の軸を同じ目盛りにして高さを見比べられるようにする
  var align=gTog('align');
  // マイルストーン線を出しているときは、未達のものが軸の外に出て消えないよう上限を確保する
  var msMax=0;
  msLines.forEach(function(l){if(l.value>msMax)msMax=l.value;});
  var axMax=null;
  if(align){
    var mg=0,mc=0;
    gains.forEach(function(v){if(v!=null&&v>mg)mg=v;});
    cums.forEach(function(v){if(v!=null&&v>mc)mc=v;});
    if(showNorma&&gTog('ideal'))mc=Math.max(mc,nc.target);
    axMax=niceMax(Math.max(mg,mc,msMax));
  }

  _chart=new Chart(cv,{
    type:'bar',
    plugins:[msLinePlugin],
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      scales:{
        x:{grid:{color:gridCol},ticks:{color:textCol,font:{size:10},maxTicksLimit:14,autoSkip:true}},
        yGain:{type:'linear',position:'left',beginAtZero:true,
          max:align?axMax:undefined,
          title:{display:true,text:'日別',color:textCol,font:{size:10}},
          grid:{color:gridCol},
          ticks:{color:textCol,font:{size:10},callback:function(v){return (+v).toLocaleString('ja-JP');}}},
        yCum:{type:'linear',position:'right',beginAtZero:true,
          max:align?axMax:undefined,
          suggestedMax:(!align&&msMax>0)?msMax:undefined,
          title:{display:true,text:'累計',color:textCol,font:{size:10}},
          grid:{display:false},
          ticks:{color:textCol,font:{size:10},callback:function(v){return (+v).toLocaleString('ja-JP');}}}
      },
      plugins:{
        msLines:{lines:msLines},
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:function(ctx){
              if(ctx.parsed.y==null)return null;
              return ctx.dataset.label+': '+(+ctx.parsed.y).toLocaleString('ja-JP')+' 個';
            }
          }
        }
      }
    }
  });
}

var _toastTimer=null;
function toast(msg,big){
  var el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}
  el.textContent=msg;
  el.classList.toggle('big',!!big);
  el.classList.add('show');
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){el.classList.remove('show');},big?3400:2200);
}
