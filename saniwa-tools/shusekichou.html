   あわせて、終了日の下限（開始日より前は押せない）を今の開始日に合わせ直す。
   フォームは開くときに一度しか描かないので、ここで更新しないと古いままになる。
   なお、開始日を終了日より後ろへ動かした場合は終了日が古いまま残るが、
   その組み合わせは今までどおり保存のときに弾いて理由を出す。                  */
function onFormDateChange(){
  _form.start=calVal('fStart');
  _form.end=calVal('fEnd');
  var fe=document.getElementById('fEnd');
  if(fe)fe.setAttribute('data-min',_form.start||'');
}
function syncFormToggles(){
  var f=_form;
  document.querySelectorAll('#segEnd button').forEach(function(b){b.classList.toggle('on',b.dataset.v===(f.includeEndDay?'1':'0'));});
  document.querySelectorAll('#segType button').forEach(function(b){b.classList.toggle('on',b.dataset.v===(f.multi?'1':'0'));});
  var th=document.getElementById('typeHint');
  if(th)th.textContent=f.multi?'異去の断片など、複数の素材を1イベントで並行して記録します。':'ひとつの素材を記録します（多くのイベントはこちら）。';
  document.querySelectorAll('#segTicketName button').forEach(function(b){
    b.classList.toggle('on',b.dataset.v===((f.ticketName==='提灯')?'提灯':'手形'));
  });
}
function setIncludeEnd(v){_form.includeEndDay=v;syncFormToggles();}
function setMulti(v){
  _form.multi=v;
  if(!v){
    // 単一へ: 先頭の1素材だけ残す（他はフォーム上では捨てる／編集時の実データ側は保存時に判断）
    _form.mats=[_form.mats[0]||{id:null,name:'',target:''}];
  }else if(!_form.mats.length){
    _form.mats=[{id:null,name:'',target:''}];
  }
  redrawMatSection();
  syncFormToggles();
}
function addMat(){_form.mats.push({id:null,name:'',target:''});redrawMatSection();}
function removeMat(i){_form.mats.splice(i,1);if(!_form.mats.length)_form.mats=[{id:null,name:'',target:''}];redrawMatSection();}
function redrawMatSection(){
  var box=document.getElementById('matRows');
  if(box)box.innerHTML=matEditRowsHtml();
  var lbl=document.getElementById('matOptLbl');
  if(lbl)lbl.textContent=_form.multi?'（断片ごとに登録・目標は任意）':'（名前・目標とも任意）';
  // 追加ボタンの有無を更新
  var addBtn=document.querySelector('.mat-add');
  if(_form.multi&&!addBtn&&box){
    var b=document.createElement('button');b.className='btn sm mat-add';b.textContent='＋ 断片を追加';b.onclick=addMat;
    box.parentNode.appendChild(b);
  }else if(!_form.multi&&addBtn){addBtn.remove();}
}

function submitForm(){
  var f=_form;
  var eName=document.getElementById('errName');
  var eDate=document.getElementById('errDate');
  if(eName)eName.textContent='';if(eDate)eDate.textContent='';
  var name=(f.name||'').trim();
  if(!name){if(eName)eName.textContent='イベント名を入力してください。';return;}
  if(!f.start||!f.end){if(eDate)eDate.textContent='開始日と終了日を入力してください。';return;}
  if(f.end<f.start){if(eDate)eDate.textContent='終了日は開始日より後にしてください。';return;}

  // 素材を組み立て（単一は先頭1件のみ）
  var srcMats=f.multi?f.mats:[f.mats[0]||{id:null,name:'',target:''}];
  var mats=srcMats.map(function(m,i){
    var tgt=parseInt((m.target||'').replace(/[^\d]/g,''))||0;
    return {id:m.id||uid('smat'),name:(m.name||'').trim(),target:tgt,order:i,records:{},recAt:{},milestones:[]};
  });

  var tCost=parseInt((f.ticketCost||'').replace(/[^\d]/g,''))||0;
  var tName=(f.ticketName==='提灯')?'提灯':'手形';

  if(f.editingId){
    var ev=getEvent(f.editingId);
    if(ev){
      ev.name=name;ev.start=f.start;ev.end=f.end;ev.includeEndDay=f.includeEndDay;ev.multi=f.multi;
      /* 手形の「設定」だけを入れ替える。買った枚数（tickets / ticketAt）には触らない。
         スイッチを切っても記録は残す＝入れ直せばそのまま戻る。ここで消すと、
         切り替えを試しただけで買った記録が消えてしまう。                        */
      ev.useTicket=!!f.useTicket;ev.ticketName=tName;ev.ticketCost=tCost;
      // 既存素材の records / milestones を id で引き継ぐ
      var byId={};(ev.materials||[]).forEach(function(m){byId[m.id]=m;});
      ev.materials=mats.map(function(m){
        var old=byId[m.id];
        if(old){m.records=old.records||{};m.recAt=old.recAt||{};m.milestones=old.milestones||[];}
        return m;
      });
      ev.updatedAt=Date.now();
      save();closeModal();
      if(document.getElementById('scr-detail').className===''){renderDetail();}
      renderList();
    }
  }else{
    var nev={id:uid('sev'),name:name,start:f.start,end:f.end,includeEndDay:f.includeEndDay,
             multi:f.multi,normaOn:false,milestoneToast:true,
             useTicket:!!f.useTicket,ticketName:tName,ticketCost:tCost,tickets:{},ticketAt:{},
             createdAt:Date.now(),updatedAt:Date.now(),materials:mats};
    DB.events.push(nev);save();closeModal();
    go('list');renderList();
  }
}

/* =========================================================
   装飾カレンダー
   稽古録（keikoroku.html）の openCalPicker / renderGenCal 一式を移植し、
   集積帳の書き方（var / function。アロー関数・テンプレート文字列は使わない）に
   直したもの。日付の道具（ymd / todayStr / fmtDateFull / WD / esc）は
   集積帳に元からあるものをそのまま使っている。

   集積帳だけの上乗せが2つ:
     ・data-min / data-max による「選べる日の制限」（範囲外の日は押せない）
     ・選んだあとに data-cb の関数を呼ぶ（欄の値が変わったときの追従用）

   値は見えない input に入れて持つので、読むときは今までどおり
   document.getElementById(id).value（または calVal(id)）でよい。
   ========================================================= */
var _calTarget=null;      // いま開いている日付欄の id
var _calDate=new Date();  // カレンダーが表示している月
var _calBtn=null;         // いま開いているボタン（枠の色を戻すため）

/* 日付欄をつくる。min / max / cb は無ければ '' でよい */
function calField(id,val,min,max,cb){
  var has=!!val;
  return '<div class="cal-wrapper">'
    +'<button type="button" class="cal-pick-btn" id="'+esc(id)+'-btn" onclick="openCalPicker(\''+esc(id)+'\',this)">'
      +'<span class="cal-val'+(has?'':' none')+'" id="'+esc(id)+'-text">'+(has?fmtDateFull(val):'日付を選ぶ')+'</span>'
      +'<span class="cal-ico">📅</span>'
    +'</button>'
    +'<input type="hidden" id="'+esc(id)+'" value="'+esc(val||'')+'"'
      +(min?' data-min="'+esc(min)+'"':'')
      +(max?' data-max="'+esc(max)+'"':'')
      +(cb?' data-cb="'+esc(cb)+'"':'')
    +'></div>';
}
/* 日付欄の値を読む */
function calVal(id){var el=document.getElementById(id);return el?el.value:'';}

function _calMin(){var el=document.getElementById(_calTarget);return (el&&el.getAttribute('data-min'))||'';}
function _calMax(){var el=document.getElementById(_calTarget);return (el&&el.getAttribute('data-max'))||'';}
/* その日が選べる範囲の外か */
function _calOut(ds){
  var lo=_calMin(),hi=_calMax();
  if(lo&&ds<lo)return true;
  if(hi&&ds>hi)return true;
  return false;
}
/* その月がまるごと範囲の外か（◀▶ を止めるため） */
function _monthOut(y,m){
  var last=new Date(y,m+1,0).getDate();
  var mm=String(m+1).padStart(2,'0');
  var s=y+'-'+mm+'-01';
  var e=y+'-'+mm+'-'+String(last).padStart(2,'0');
  var lo=_calMin(),hi=_calMax();
  if(lo&&e<lo)return true;
  if(hi&&s>hi)return true;
  return false;
}

function openCalPicker(targetId,anchorEl){
  document.removeEventListener('click',_calOutside,true);
  var picker=document.getElementById('calPicker');
  if(!picker)return;
  /* 同じボタンをもう一度押したら閉じる */
  if(picker.style.display==='block'&&_calTarget===targetId){closeCal();return;}
  if(_calBtn)_calBtn.classList.remove('open');
  _calTarget=targetId;
  _calBtn=anchorEl;
  if(_calBtn)_calBtn.classList.add('open');

  var el=document.getElementById(targetId);
  var base=(el&&el.value)?el.value:todayStr();
  /* 値が無い／範囲の外なら、選べる範囲の中へ寄せて開く */
  if(_calOut(base))base=_calMin()||_calMax()||base;
  _calDate=parseYmd(base);

  renderCal();
  picker.style.display='block';
  positionCal(anchorEl);
  /* 開いたこのクリックでそのまま閉じてしまわないよう、次の周回から外側を見張る */
  setTimeout(function(){document.addEventListener('click',_calOutside,true);},0);
}

function positionCal(anchorEl){
  var picker=document.getElementById('calPicker');
  if(!picker||!anchorEl)return;
  var rect=anchorEl.getBoundingClientRect();
  var pw=picker.offsetWidth||288;
  var ph=picker.offsetHeight||320;
  var left=Math.min(rect.left,window.innerWidth-pw-8);
  var top=rect.bottom+4;
  if(top+ph>window.innerHeight)top=rect.top-ph-4; // 下に入りきらないときは上に出す
  picker.style.left=Math.max(4,left)+'px';
  picker.style.top=Math.max(4,top)+'px';
}

function _calOutside(e){
  var picker=document.getElementById('calPicker');
  if(picker&&!picker.contains(e.target)&&!e.target.closest('.cal-pick-btn'))closeCal();
}
function closeCal(){
  var picker=document.getElementById('calPicker');
  if(picker)picker.style.display='none';
  if(_calBtn)_calBtn.classList.remove('open');
  _calBtn=null;
  _calTarget=null;
  document.removeEventListener('click',_calOutside,true);
}
function shiftCalMonth(d){_calDate.setDate(1);_calDate.setMonth(_calDate.getMonth()+d);renderCal();}
function setCalYear(v){_calDate.setDate(1);_calDate.setFullYear(+v);renderCal();}
function setCalMonth(v){_calDate.setDate(1);_calDate.setMonth(+v);renderCal();}

function selectCalDate(ds){
  if(_calOut(ds))return;
  var inp=document.getElementById(_calTarget);
  if(inp)inp.value=ds;
  var txt=document.getElementById(_calTarget+'-text');
  if(txt){txt.textContent=fmtDateFull(ds);txt.classList.remove('none');}
  var cb=inp?inp.getAttribute('data-cb'):'';
  closeCal();
  if(cb&&typeof window[cb]==='function')window[cb]();
}

function renderCal(){
  var body=document.getElementById('calBody');
  var selWrap=document.getElementById('calSelWrap');
  var foot=document.getElementById('calFoot');
  if(!body||!selWrap)return;

  var y=_calDate.getFullYear(),m=_calDate.getMonth();
  var mNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var lo=_calMin(),hi=_calMax();

  /* 年の候補。制限があればその範囲だけ、無ければ 2015（とうらぶ開始年）〜今年 */
  var nowY=new Date().getFullYear();
  var loY=lo?parseInt(lo.slice(0,4),10):Math.min(2015,y);
  var hiY=hi?parseInt(hi.slice(0,4),10):Math.max(nowY,y);
  if(loY>y)loY=y;
  if(hiY<y)hiY=y;
  var yOpts='';
  for(var yy=hiY;yy>=loY;yy--){
    yOpts+='<option value="'+yy+'"'+(yy===y?' selected':'')+'>'+yy+'年</option>';
  }
  var mOpts='';
  for(var mm=0;mm<12;mm++){
    mOpts+='<option value="'+mm+'"'+(mm===m?' selected':'')+(_monthOut(y,mm)?' disabled':'')+'>'+mNames[mm]+'</option>';
  }
  selWrap.innerHTML=
     '<select class="cal-sel" onchange="setCalYear(this.value)" onclick="event.stopPropagation()">'+yOpts+'</select>'
    +'<select class="cal-sel" onchange="setCalMonth(this.value)" onclick="event.stopPropagation()">'+mOpts+'</select>';

  /* ◀▶ は、行った先の月がまるごと範囲の外なら止める */
  var pv=new Date(y,m-1,1),nx=new Date(y,m+1,1);
  var bp=document.getElementById('calPrev'),bn=document.getElementById('calNext');
  if(bp)bp.disabled=_monthOut(pv.getFullYear(),pv.getMonth());
  if(bn)bn.disabled=_monthOut(nx.getFullYear(),nx.getMonth());

  var first=new Date(y,m,1);
  var cur=new Date(first);
  cur.setDate(cur.getDate()-first.getDay());
  var inp=document.getElementById(_calTarget);
  var sel=(inp&&inp.value)?inp.value:'';
  var today=todayStr();

  var html='<div class="cal-grid">';
  for(var i=0;i<7;i++){
    var c=(i===0)?'color:var(--cal-sun)':(i===6)?'color:var(--cal-sat)':'';
    html+='<div class="cal-dow" style="'+c+'">'+WD[i]+'</div>';
  }
  for(var k=0;k<42;k++){   // 6週ぶん固定。月によって高さが変わらないように
    var ds=ymd(cur);
    var cls='cal-day'
      +((cur.getMonth()!==m)?' other':'')
      +((cur.getDay()===6)?' sat':(cur.getDay()===0)?' sun':'')
      +((ds===today)?' today':'')
      +((ds===sel)?' selected':'');
    if(_calOut(ds)){
      html+='<button type="button" class="'+cls+'" disabled>'+cur.getDate()+'</button>';
    }else{
      html+='<button type="button" class="'+cls+'" onclick="selectCalDate(\''+ds+'\');event.stopPropagation()">'+cur.getDate()+'</button>';
    }
    cur.setDate(cur.getDate()+1);
  }
  html+='</div>';
  body.innerHTML=html;

  /* 制限があるときだけ、選べる範囲を下に書く */
  if(foot){
    if(lo&&hi){
      foot.style.display='block';
      foot.textContent='選べるのは '+fmtDateFull(lo)+' 〜 '+fmtDateFull(hi)+' です';
    }else if(lo){
      foot.style.display='block';
      foot.textContent=fmtDateFull(lo)+' 以降が選べます';
    }else if(hi){
      foot.style.display='block';
      foot.textContent=fmtDateFull(hi)+' までが選べます';
    }else{
      foot.style.display='none';
      foot.textContent='';
    }
  }
}

/* =========================================================
   バックアップ（丙案 段階2）
     ・ファイルへの書き出し／ファイルからの読み込み
     ・保険① 読み込む前に「この端末にしかないもの」を数えて見せる
     ・保険② 読み込む直前に1世代だけ控えを取り、「取り消す」を出す
   段階3の Drive の読み込みも、ここと同じ道（保険①→控え→合流）を通す。
   ========================================================= */

/* 時刻の見せ方（07/29 15:20） */
function fmtStamp(t){
  if(!t)return '（記録なし）';
  var d=new Date(t);
  return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')
    +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
/* イベントの記録が何日ぶんあるか。素材をまたいで同じ日は1日と数える */
function evDayCount(ev){
  var s={};
  ((ev&&ev.materials)||[]).forEach(function(m){
    Object.keys((m&&m.records)||{}).forEach(function(d){s[d]=1;});
  });
  /* 手形しか入っていない日も「記録のある日」に数える。
     数えないと、手形だけ入れたイベントが失われるときに「記録0日ぶん」と出て、
     中身が軽いものに見えてしまう。                                       */
  Object.keys((ev&&ev.tickets)||{}).forEach(function(d){s[d]=1;});
  return Object.keys(s).length;
}
/* 読み込むと失われる「この端末にしかないもの」を数える。
   実際に合流させた結果と手元を見比べるので、合流のルールと食い違わない。 */
function countLosses(local,incoming){
  var out=[];
  var merged=mergeDB(local,incoming);
  if(!merged||!Array.isArray(merged.events))return out;
  var mEv={};
  merged.events.forEach(function(e){if(e&&e.id)mEv[e.id]=e;});
  var inNames={};
  ((incoming&&incoming.events)||[]).forEach(function(e){if(e&&e.name)inNames[e.name]=1;});

  ((local&&local.events)||[]).forEach(function(ev){
    if(!ev||!ev.id)return;
    var me=mEv[ev.id];
    if(!me){
      out.push({kind:'event',name:ev.name||'（名前なし）',days:evDayCount(ev),
                sameName:!!inNames[ev.name]});
      return;
    }
    var mMat={};
    ((me.materials)||[]).forEach(function(m){if(m&&m.id)mMat[m.id]=m;});
    ((ev.materials)||[]).forEach(function(m){
      if(!m||!m.id||mMat[m.id])return;
      out.push({kind:'mat',ev:ev.name||'（名前なし）',name:m.name||'（名前なし）',
                days:Object.keys(m.records||{}).length});
    });
  });
  return out;
}

/* ---- 書き出し ---------------------------------------- */
function exportJson(){
  closeCloud();
  var d=new Date();

    +String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';

/* ---- 読み込み ---------------------------------------- */
function pickImport(){
  closeCloud();
  var el=document.getElementById('importFile');
  if(el){el.value='';el.click();}
}
/* 読み込もうとしている中身が集積帳のものか確かめる。
   問題があれば理由の文を、問題なければ '' を返す。

   ここは厳しくしてある。ほかの道具のバックアップにも events という配列が
   あることがあり（稽古録の同期データがそう）、キーの名前だけでは見分けられない。
   なので集積帳が書き出した目印 tool:'shuseki' が無いものは受け取らない。
   段階3で Drive から読むファイルにも同じ目印を入れて、ここを通す。      */
function checkIncoming(d){
  if(!d||typeof d!=='object'||Array.isArray(d))
    return 'このファイルは集積帳のバックアップではありません';
  if(d.tool!==TOOL_ID){
    if(typeof d.tool==='string'&&d.tool)
      return 'これは「'+d.tool+'」のデータです。集積帳のバックアップではありません';
    return 'このファイルは集積帳のバックアップではありません（集積帳の目印が入っていません）';
  }
  if(!Array.isArray(d.events))return '中身が集積帳の形をしていません';
  for(var i=0;i<d.events.length;i++){
    var e=d.events[i];
    if(!e||typeof e!=='object'||!e.id||!Array.isArray(e.materials))
      return '中身が集積帳の形をしていません（'+(i+1)+'件目のイベント）';
  }
  return '';
}
function onImportPicked(el){
  var f=el&&el.files&&el.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var d;
    try{d=JSON.parse(r.result);}catch(e){toast('このファイルは読み取れませんでした',true);return;}
    var ng=checkIncoming(d);
    if(ng){toast(ng,true);return;}
    askLoad(d,'ファイル');
  };
  r.onerror=function(){toast('ファイルを読めませんでした',true);};
  r.readAsText(f);
}

/* 目印を落とした塊を返す（合流の結果に tool や exportedAt を混ぜないため） */
function stripMeta(o){
  var c=_deepCopy(o)||{};
  delete c.tool;delete c.exportedAt;delete c.syncedAt;
  return c;
}

/* ---- 保険①：読み込む前に見せる -------------------------- */
var _pendingIn=null;      // 読み込みを待っている塊
var _pendingFrom='';      // どこから来たか（'ファイル' / 'クラウド'）
var _pendingStartup=false; // 起動時の知らせから開いたダイアログか（段階3-c）
function _clearPending(){_pendingIn=null;_pendingFrom='';_pendingStartup=false;}
/* 起動時の知らせで「次からは出さない」に印が入っていたら、
   いきなり無音にはせず「印だけ」に下げる（モックで決めたとおり）。
   画面を消す前に読むこと。                                          */
function _takeStartupOff(){

}
function askLoad(incoming,fromLabel,isStartup){

      +'ここに出ていないものは消えません。<br>'
      +'読み込む直前に、この端末の状態を1つだけ控えておきます。あとから取り消せます。</div>';
  }else{
    body+='<div class="safe-note">読み込むと、この端末の新しい記録が古いものに戻ります。'
      +'ふつうは「この端末のデータを保つ」を選んでください。</div>';
  }

  if(_pendingStartup){

   +'</div></div>';

function cancelLoad(){_takeStartupOff();_clearPending();closeModal();}

/* ---- 保険②：1世代だけの控え ---------------------------- */
function saveUndo(){
  try{
    localStorage.setItem(UNDO_KEY,JSON.stringify({savedAt:Date.now(),label:'読み込み前',data:DB}));
    return true;
  }catch(e){return false;}
}
function loadUndo(){
  try{var s=localStorage.getItem(UNDO_KEY);return s?JSON.parse(s):null;}catch(e){return null;}
}
/* 控えを捨てる。save() から毎回呼ばれるので、余計な描き直しをしないよう有無を見てから */
function dropUndo(){
  try{
    if(localStorage.getItem(UNDO_KEY)===null)return;
    localStorage.removeItem(UNDO_KEY);
  }catch(e){return;}
  drawUndoBar();
}
function drawUndoBar(){
  var host=document.getElementById('undoHost');
  if(!host)return;
  var u=loadUndo();
  if(!u||!u.data){host.innerHTML='';return;}
  host.innerHTML='<div class="undo-bar">'
    +'<div class="undo-txt">読み込みました'
      +'<small>読み込む前の状態に戻せます（次に何か記録すると消えます）</small></div>'
    +'<button class="btn sm pri" onclick="doUndo()">↩ 取り消す</button>'
   +'</div>';
}
function doUndo(){
  var u=loadUndo();
  if(!u||!u.data){toast('戻せる控えがありません');drawUndoBar();return;}
  DB=u.data;
  saveKeepTime();                 // 控えの時刻をそのまま保つ
  try{localStorage.removeItem(UNDO_KEY);}catch(e){}
  drawUndoBar();
  go('list');renderList();
  toast('読み込む前の状態に戻しました',true);
}

/* ---- 読み込みの実行 ------------------------------------ */
function doLoadPending(){
  var incoming=_pendingIn;
  var from=_pendingFrom;
  _takeStartupOff();              // 画面を消す前に「次からは出さない」を拾う
  if(!incoming){_clearPending();closeModal();return;}
  /* 控えが取れなければ読み込まない。控え無しで上書きはしない */
  if(!saveUndo()){
    closeModal();_clearPending();
    toast('控えを取れなかったので読み込みを中止しました。端末の空き容量を確かめてください',true);
    return;
  }
  var merged=mergeDB(DB,stripMeta(incoming));
  if(!merged){
    closeModal();_clearPending();
    toast('読み込めませんでした');
    return;
  }
  DB=merged;
  saveKeepTime();                 // 合流の結果の時刻をそのまま保つ
  _clearPending();
  closeModal();
  drawUndoBar();
  go('list');renderList();        // 開いていたイベントが無くなっている場合があるので一覧へ
  /* 合流した結果は、クラウドにもファイルにも無い形になっている。
     自動では上げ直さないと決めたので、上げれば反映できることだけ伝える（段階3-b）。 */
  _gdNeedUp=true;
  _gdDiff=false;
  autoHoldClear();   /* 合流したので、見送りの知らせは用済み（段階3-d） */
  gdRefreshUI();
  toast((from==='クラウド'&&_gdToken)
    ?'読み込みました。⬆保存でクラウドにも反映できます'
    :'読み込みました',true);
}

}
/* ☁ボタンの見た目を描き直す */
function drawCloudBtn(){
  var b=document.getElementById('cloudBtn');
  if(!b)return;
  var wasOpen=b.classList.contains('open');
  b.className='cloud-btn'
    +(_gdToken?' in':(_gdReconnect?' ng':''))
    +(gdOnline()?'':' noline')
    +(wasOpen?' open':'');
  /* 点を出す条件は2つ。
     ・クラウドに新しいものがある（起動時の知らせ方が「知らせない」なら出さない）
     ・自動保存を見送っている（段階3-d。こちらは起動時の話ではなく、
       自分が記録したものが上がっていないという知らせなので、設定で消さない） */
  b.innerHTML=(_gdReconnect?'⚠':'☁')
    +((_gdAutoHeld||(_gdDiff&&PREF.gdNotify!=='none'))?'<span class="dot"></span>':'');
}
/* ボタンと、開いていればパネルの中身も描き直す */
function gdRefreshUI(){
  drawCloudBtn();
  var p=document.getElementById('cloudPanel');
  if(p&&p.style.display==='block')p.innerHTML=cloudPanelHtml();
}

/* トークン受け取りの一本化。
   通常のログイン・裏での取り直し・遅れて届いた分の復帰、すべてここを通す。 */
function _gdAcceptToken(tok){
  _gdToken=tok;
  _gdTokenAt=Date.now();
  _gdReconnect=false;
  gdKeepToken();
  if(!PREF.gdWasIn){PREF.gdWasIn=true;savePref();}
  gdRefreshUI();
}
/* 接続が切れた状態へ。ログアウトにはしない（記録はこの端末に無事）。
   ここでログアウト扱いにすると、再ログインが一度失敗する症状が出る。 */
function _gdEnterReconnect(){
  if(_gdReconnect)return;  /* トーストとUI更新の連発を防ぐ */
  _gdToken=null;_gdTokenAt=0;_gdReconnect=true;
  gdForgetToken();   /* 鍵は捨てるが gdWasIn は下ろさない。次に開いたとき取り直す */
  gdRefreshUI();
  toast('接続が切れました。「⚠ 再接続」で戻れます',true);
}
/* あきらめた後に遅れて届いたトークンで復帰する
   （アカウント選択の画面が出て、人が選ぶのに時間がかかったとき） */
function _gdLateRecover(){
  gdRefreshUI();
  toast('Googleに再接続しました');
  gdStartupCheck();   /* 中断していたチェックの続きへ */
}
/* トークンが古いか。押された時点で先回りして取り直すための判定 */
function gdTokenStale(){
  if(!_gdToken)return false;
  if(!_gdTokenAt)return true;   /* 受け取った時刻が分からない＝古い扱い（安全側） */
  return (Date.now()-_gdTokenAt)>GD_STALE_MS;
}
function gdReady(){
  return !!(window.google&&window.google.accounts&&window.google.accounts.oauth2);
}
/* Googleの読み込み待ち。asyncのまま使う */
async function gdWaitReady(maxWaitMs){
  var limit=maxWaitMs||5000;
  var start=Date.now();
  while(!gdReady()){
    if(Date.now()-start>limit)throw new Error('Google Sign-In library timeout');
    await new Promise(function(r){setTimeout(r,100);});
  }
}

function gdSignIn(){
  if(!gdReady()){
    /* まだ読めていないだけかもしれないので、少し待ってから出直す */
    gdWaitReady().then(function(){gdSignIn();}).catch(function(){
      toast('Googleの読み込みに失敗しました。ページを開き直してください',true);
    });
    return;
  }
  try{
    var client=google.accounts.oauth2.initTokenClient({
      client_id:GD_CLIENT_ID,
      scope:GD_SCOPE,
      callback:function(resp){
        if(resp.error){
          toast('Googleログインに失敗しました：'+resp.error,true);
          return;
        }
        _gdAcceptToken(resp.access_token);
        toast('Googleにログインしました');
        gdStartupCheck();   /* つないだ直後にクラウドとの新旧を確かめる */
      }
    });
    client.requestAccessToken();
  }catch(e){
    toast('Googleログインを始められませんでした',true);
  }
}

function gdSignOut(){
  if(_gdToken&&gdReady()){
    try{google.accounts.oauth2.revoke(_gdToken,function(){});}catch(e){}
  }
  _gdToken=null;_gdFileId=null;_gdTokenAt=0;_gdReconnect=false;
  _gdLastSync=null;_gdDiff=false;_gdCloudAt=null;_gdNeedUp=false;
  _gdLastAuto=false;
  clearTimeout(_autoTimer);_autoTimer=null;   /* 待っている自動保存は取り消す（段階3-d） */
  autoHoldClear();
  gdForgetToken();
  PREF.gdWasIn=false;savePref();   /* 開き直しても取り直さない */
  gdRefreshUI();
  toast('Googleからログアウトしました');
}

/* 裏でのトークン取り直し。
   prompt:'' なのでふつうは画面なしで終わるが、ブラウザによってはアカウント選択が
   出ることがあり、人が選ぶ時間がかかる。
   10秒の見切りは「呼んだ側が待つのをやめる」ためだけのもので、受け取り口は閉めない。
   遅れて届いた分は _gdLateRecover() で拾ってログインを復帰させる。          */
var _gdRefreshP=null;   /* 走っている取り直し。多重起動＝窓の連発を防ぐ */
/* 走っている印を外す。いま走っているものと同じなら、という念を入れてある */
function _gdClearRefresh(p){if(_gdRefreshP===p)_gdRefreshP=null;}
function gdSilentRefresh(){
  if(_gdRefreshP)return _gdRefreshP;   /* すでに走っていれば相乗り */
  var p=new Promise(function(resolve,reject){
    if(!gdReady()){reject(new Error('Library not loaded'));return;}
    var settled=false;   /* 呼んだ側へ返事をしたか。トークンの受け取りとは別 */
    var timer=setTimeout(function(){
      if(!settled){settled=true;reject(new Error('timeout'));}
    },10000);
    try{
      var client=google.accounts.oauth2.initTokenClient({
        client_id:GD_CLIENT_ID,
        scope:GD_SCOPE,
        callback:function(resp){
          clearTimeout(timer);
          if(resp.error){
            if(!settled){settled=true;reject(new Error(resp.error));}
            return;
          }
          _gdAcceptToken(resp.access_token);
          if(settled)_gdLateRecover();                      /* 見切った後に届いた */
          else{settled=true;resolve(_gdToken);}
        },
        error_callback:function(err){
          clearTimeout(timer);
          if(!settled){
            settled=true;
            reject(new Error((err&&err.type)||'silent_failed'));
          }
        }
      });
      client.requestAccessToken({prompt:''});
    }catch(e){
      clearTimeout(timer);
      if(!settled){settled=true;reject(e);}
    }
  });
  _gdRefreshP=p;
  /* 決着したら印を外す。ここが肝。
     Promise の中身はその場で走るので、中で _gdRefreshP=null をすると
     コールバックが同期で返ってきたときだけ、この上の代入で印が復活してしまう。
     そうなると以後ずっと古い Promise に相乗りし続けて、401のやり直しも
     再接続も効かなくなる（移植元の稽古録も同じ形。実機では本物のGoogleが
     必ず非同期で返すので表に出ないが、脆いので外側で外すことにした）。     */
  p.then(function(){_gdClearRefresh(p);},function(){_gdClearRefresh(p);});
  return p;
}

/* Driveへの通信。401が来たら裏で取り直して一度だけやり直す。
   取り直せなければログアウトにはせず「⚠ 再接続」に留める。 */
async function gdFetch(url,opts,isRetry){
  opts=opts||{};
  var headers={};
  var k;
  for(k in (opts.headers||{})){
    if(Object.prototype.hasOwnProperty.call(opts.headers,k))headers[k]=opts.headers[k];
  }
  headers['Authorization']='Bearer '+_gdToken;
  var o={};
  for(k in opts){if(Object.prototype.hasOwnProperty.call(opts,k))o[k]=opts[k];}
  o.headers=headers;
  var res;
  try{
    res=await fetch(url,o);
  }catch(e){
    /* 回線が無い・遮断された・CORSで止められた など。
       生のメッセージ（Failed to fetch など）は読めないので言い換える。 */
    throw new Error(gdOnline()
      ?'通信できませんでした（回線か、ブラウザの設定を確かめてください）'
      :'回線につながっていません');
  }
  if(res.status===401&&!isRetry){
    if(_gdReconnect)throw new Error('401 Unauthorized');  /* 再接続待ちの間は試さない */
    try{
      await gdSilentRefresh();
    }catch(refreshErr){
      _gdEnterReconnect();
      throw new Error('401 Unauthorized');
    }
    return gdFetch(url,opts,true);
  }
  return res;
}

/* 「⚠ 再接続」を押したとき。窓が通りやすいクリック起点なので、ここで取り直す */
function gdReconnectNow(){
  if(!gdReady()){toast('Googleの読み込みが終わっていません',true);return;}
  gdSilentRefresh().then(function(){
    _gdReconnect=false;
    gdRefreshUI();
    toast('Googleに再接続しました');
  }).catch(function(){
    /* 裏で取り直せなかった＝ふつうのログインの窓を出す */
    gdSignIn();
  });
}

/* =========================================================
   段階3-b: Driveとのやりとり
     ⬇読み込みは、段階2で出来ている道（保険①→控え→合流）を
     そのまま通す。新しく書いたのは通信の部分だけ。

     新旧の比べ方は DB.updatedAt 一本。Driveのファイル更新時刻は使わない。
     丙案が最初から「新旧は DB.updatedAt で比べる」で通しているので、
     ここだけ別のものさしにすると説明できなくなるため。
   ========================================================= */
var _gdBusy=false;      /* やりとり中。二度押しを防ぐ */
var _gdCloudAt=null;    /* 最後に見たクラウドの updatedAt。null＝まだ知らない */
var _gdNeedUp=false;    /* クラウドへ上げ直すと反映できるものがある */

/* クラウドへ上げる塊。目印を添える。
   appDataFolder は道具箱の全ツールが共有しているので、取り違えても
   中身で気づけるように tool:'shuseki' を必ず入れる。読むときは checkIncoming() を通す。 */
function gdPayload(){
  var p=_deepCopy(DB)||{};
  p.tool=TOOL_ID;
  p.syncedAt=Date.now();
  return p;
}
/* クラウドへ上げ直すと反映できるものがあるか。
   ・読み込んだ直後は、合流した結果がクラウドより多いので必ず true
     （このとき updatedAt はクラウドと同じ値になることがあるので、印を別に持つ）
   ・そのあと記録を足したときは updatedAt の比較で拾う                    */
function gdNeedUp(){
  if(!_gdToken)return false;
  if(_gdNeedUp)return true;
  if(_gdCloudAt===null)return false;   /* クラウドの状態を知らない */
  return (+DB.updatedAt||0)>_gdCloudAt;
}

/* 集積帳のファイルを探す。無ければ null。
   探せなかったときは throw する（ここを黙って null で返すと「無い」と
   区別が付かず、同じ名前のファイルを二重に作ってしまう）。            */
async function gdFindFile(){
  var res=await gdFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder'
    +'&q='+encodeURIComponent("name='"+GD_FILENAME+"'")
    +'&fields=files(id,name)',{headers:{}});
  if(!res.ok)throw new Error('クラウドを探せませんでした（'+res.status+'）');
  var d=await res.json();
  return (d&&d.files&&d.files.length)?d.files[0].id:null;
}
async function gdDownload(fid){
  var res=await gdFetch('https://www.googleapis.com/drive/v3/files/'
    +encodeURIComponent(fid)+'?alt=media',{headers:{}});
  if(!res.ok)throw new Error('クラウドから受け取れませんでした（'+res.status+'）');
  var d;
  try{d=await res.json();}catch(e){throw new Error('クラウドのデータを読み取れませんでした');}
  return d;
}
/* fid があれば上書き、無ければ新しく作る。返すのはファイルの札 */
async function gdUpload(fid){
  var body=JSON.stringify(gdPayload());
  if(fid){
    var up=await gdFetch('https://www.googleapis.com/upload/drive/v3/files/'
      +encodeURIComponent(fid)+'?uploadType=media',
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
    if(!up.ok)throw new Error('クラウドへ保存できませんでした（'+up.status+'）');
    return fid;
  }
  var meta={name:GD_FILENAME,parents:['appDataFolder']};
  var form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',new Blob([body],{type:'application/json'}));
  var res=await gdFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
    {method:'POST',headers:{},body:form});
  if(!res.ok)throw new Error('クラウドに置けませんでした（'+res.status+'）');
  var d=await res.json();
  if(!d||!d.id)throw new Error('クラウドに置けませんでした（札が返りませんでした）');
  return d.id;
}

/* やりとりを始める前の共通の関門。始めてよければ '' を返す。
   ここで回線は見ない。navigator.onLine は嘘をつくことがあり、
   つながっているのに「回線なし」と言われたら同期する手立てが無くなってしまう。
   本当に回線が無ければ、通信そのものが失敗して理由が出る。          */
function gdGate(){
  if(_gdBusy)return 'busy';
  if(_gdReconnect)return '接続が切れています。「⚠ 再接続」でつなぎ直してください';
  if(!_gdToken)return '先にGoogleへログインしてください';
  return '';
}

/* ---- ⬇ 読み込む ---------------------------------------- */
async function gdSyncDown(){
  var ng=gdGate();
  if(ng){if(ng!=='busy')toast(ng,true);return false;}
  /* 押された時点でトークンが古ければ先に取り直す（クリック起点なので窓が通りやすい） */
  if(gdTokenStale()){
    try{await gdSilentRefresh();}catch(e){_gdEnterReconnect();return false;}
  }
  _gdBusy=true;closeCloud();gdRefreshUI();
  try{
    toast('クラウドから受け取っています…');
    var fid=await gdFindFile();
    if(!fid){
      /* クラウドにまだ何も無い＝初回。手元のものを置いておく */
      _gdFileId=await gdUpload(null);
      _gdLastSync=Date.now();
      _gdCloudAt=+DB.updatedAt||0;
      _gdNeedUp=false;
      toast('クラウドにまだ何もなかったので、この端末のものを保存しました',true);
      return true;
    }
    _gdFileId=fid;
    var d=await gdDownload(fid);
    var bad=checkIncoming(d);
    if(bad){toast('クラウドのデータを読めませんでした：'+bad,true);return false;}
    _gdLastSync=Date.now();
    _gdCloudAt=+d.updatedAt||0;
    /* 読み込まずに閉じられたときは、クラウドが新しいままなので印は残す */
    _gdDiff=(_gdCloudAt>(+DB.updatedAt||0));
    /* ここから先は段階2と同じ道。保険①→控え→合流 */
    askLoad(d,'クラウド');
    return true;
  }catch(e){
    toast('読み込めませんでした：'+e.message,true);
    return false;
  }finally{
    _gdBusy=false;gdRefreshUI();
  }
}

/* ---- ⬆ 保存 -------------------------------------------- */
/* force=true は「上書きする」を押されたとき。新旧の確かめを飛ばす
   auto=true  は自動保存から呼ばれたとき（段階3-d）。違いは3つだけ:
     ・声を出さない（「保存しています…」も「保存しました」も出さない）
     ・失敗しても文句を言わない。次に何か記録すればまた走るので
     ・クラウドの方が新しかったら3択を出さず、見送って知らせる       */
/* ── 手元が空のまま上書きするのを止める ──────────────
   機種変更・ブラウザの乗り換え・サイトデータの削除・アプリ内ブラウザなどで
   この端末の記録が空になっていることがある。その状態で保存すると
   クラウドの記録まで空で塗りつぶされ、元に戻せない。
   既存の updatedAt の比較より手前に置く（空のあと1件でも足すと
   updatedAt が今になり、比較を素通りしてしまうため）。 */
function gdLocalEmpty(){
  return !(DB.events||[]).length;
}
function gdForceSaveAnyway(){
  closeModal();
  gdSyncUp(true);
}
async function gdAskIfEmpty(){
  if(!gdLocalEmpty())return false;
  var fid=null;
  try{ fid=_gdFileId||await gdFindFile(); }catch(e){ return false; }
  if(!fid)return false;   /* クラウドに何も無いなら、空を保存しても失うものが無い */
  askConfirm(
    '<b>手元に記録がありません</b><br><br>'
    +'このまま保存すると、クラウドに残っている記録が空の状態で上書きされます。元に戻せません。<br><br>'
    +'以前この道具に記録していた場合は、先に「⬇ 読み込む」を押してください。'
    +'<div style="text-align:center;margin-top:14px">'
    +'<a href="#" onclick="gdForceSaveAnyway();return false;" '
    +'style="font-size:11px;color:var(--t4);text-decoration:underline">それでも保存する</a></div>',
    gdSyncDown, '⬇ 読み込む', false);
  return true;
}

async function gdSyncUp(force,auto){
  var ng=gdGate();
  if(ng){if(!auto&&ng!=='busy')toast(ng,true);return false;}
  if(gdTokenStale()){
    try{await gdSilentRefresh();}catch(e){if(!auto)_gdEnterReconnect();return false;}
  }
  if(!auto&&!force&&await gdAskIfEmpty())return false;
  _gdBusy=true;if(!auto)closeCloud();gdRefreshUI();
  try{
    if(!auto)toast('クラウドへ保存しています…');
    var fid=await gdFindFile();
    if(fid&&!force){
      _gdFileId=fid;
      var d=await gdDownload(fid);
      var bad=checkIncoming(d);
      if(bad){
        /* 読めないものが置かれている。黙って上書きはしない */
        if(auto)return false;   /* 自動のときは静かに見送る。人が押したときに理由を出す */
        askConfirm('クラウドのデータを読み取れませんでした。<br>'
          +'この端末のもので上書きしますか？',
          function(){gdSyncUp(true);},'クラウドを上書きする',true);
        return false;
      }
      var cAt=+d.updatedAt||0;
      _gdCloudAt=cAt;
      if(cAt>(+DB.updatedAt||0)){
        if(auto)autoHold(d,cAt);      /* 自動は上書きしない。見送って知らせる */
        else askOverwrite(d,cAt);     /* 手動は警告して止める。押し切れば上書き */
        return false;
      }
    }
    _gdFileId=await gdUpload(fid);
    _gdLastSync=Date.now();
    _gdLastAuto=!!auto;
    _gdCloudAt=+DB.updatedAt||0;
    _gdNeedUp=false;
    _gdDiff=false;
    autoHoldClear();   /* 見送っていた状態は解けた */
    if(!auto)toast('クラウドへ保存しました',true);
    return true;
  }catch(e){
    if(!auto)toast('保存できませんでした：'+e.message,true);
    return false;
  }finally{
    _gdBusy=false;gdRefreshUI();
  }
}

/* クラウドの方が新しいときの3択。
   「先に読み込む」があると、押し間違いで上書きせずに合流へ回せる。 */
var _gdUpPending=null;
function askOverwrite(cloudData,cAt){
  _gdUpPending=cloudData;
  var lAt=+DB.updatedAt||0;
  document.getElementById('modalHost').innerHTML=
   '<div class="modal-ov" id="_upOv"><div class="modal" style="max-width:440px">'
    +'<div class="modal-h">クラウドの方が新しいようです</div>'
    +'<div class="time-cmp">クラウドのデータの方が新しいです<br>'
      +'クラウド <b>'+fmtStamp(cAt)+'</b> ／ この端末 <b>'+fmtStamp(lAt)+'</b></div>'
    +'<div class="safe-note">このまま上書きすると、クラウドにしかない記録が失われます。<br>'
      +'「先に読み込む」を選ぶと、クラウドの記録とこの端末の記録を合流させてから'
      +'保存できます。失われるものがあれば、そのときに数えて見せます。</div>'
    +'<div class="modal-foot"><div class="right">'
      +'<button class="btn" onclick="cancelOverwrite()">クラウドをそのままにする</button>'
      +'<button class="btn pri" onclick="loadBeforeUp()">先に読み込む</button>'
      +'<button class="btn danger" onclick="forceUp()">上書きする</button>'
    +'</div></div>'
   +'</div></div>';
  document.getElementById('_upOv').addEventListener('click',function(e){
    if(e.target.id==='_upOv')cancelOverwrite();
  });
}
function cancelOverwrite(){_gdUpPending=null;closeModal();}
function loadBeforeUp(){
  var d=_gdUpPending;_gdUpPending=null;closeModal();
  if(d)askLoad(d,'クラウド');
}
function forceUp(){_gdUpPending=null;closeModal();gdSyncUp(true);}

/* =========================================================
   段階3-d: 自動保存
     ・上げるだけ。読み込みは絶対に自動でしない。
       黙って手元のデータが書き換わるのは怖いので、読み込みは必ず人が押す。
     ・save()（＝記録が変わったとき）から約4秒後に走る。
       saveKeepTime() / saveSetting() では走らせない
       （合流の適用と、見た目・設定の保存なので記録は変わっていない）。
     ・打ち直すたびに4秒を数え直す（デバウンス）。合計から振り分けるような
       まとまった操作でも、手が止まってから1回だけ上がる。
     ・クラウドの方が新しければ上書きせず見送る。同じ見送りのあいだ
       ダイアログは1回だけで、あとは☁の点とパネルの一行に任せる。
     ・失敗は静かに見送る。次に何か記録すればまた走るので文句は言わない。
   ========================================================= */
var AUTO_DELAY=4000;     /* 記録が変わってから上げるまでの待ち時間 */
var _autoTimer=null;     /* 待っている最中のタイマー */
var _gdLastAuto=false;   /* 最後の同期が自動だったか（パネルの「（自動）」） */
var _gdAutoHeld=false;   /* いま見送っている。パネルの一行と☁の点を出す */
var _gdAutoWarned=false; /* この見送りについては、もうダイアログを出した */

/* 「変わったら自動でクラウドに保存する」の切り替え */
function setAuto(on){
  PREF.gdAuto=!!on;
  savePref();
  if(!PREF.gdAuto){
    clearTimeout(_autoTimer);_autoTimer=null;
    autoHoldClear();   /* 自動をやめたなら、見送りの知らせも用済み */
  }
  gdRefreshUI();
}
/* 「見送ったときに知らせない」の切り替え。
   この☑はダイアログで印を入れたあとだけパネルに現れる。               */
function setWarnOff(on){
  PREF.gdWarnOff=!!on;
  savePref();
  gdRefreshUI();
}

/* 記録が変わった。少し待ってから上げる。
   打ち直すたびにここへ来るので、そのたびに数え直す（デバウンス）。   */
function scheduleAutoSync(){
  if(!PREF.gdAuto)return;
  if(!_gdToken||_gdReconnect)return;
  clearTimeout(_autoTimer);
  _autoTimer=setTimeout(function(){
    _autoTimer=null;
    gdAutoSync();
  },AUTO_DELAY);
}
/* 実際に上げるところ。中身は ⬆保存 と同じものを使う */
function gdAutoSync(){
  if(!PREF.gdAuto||!_gdToken||_gdReconnect)return;
  /* 人が押した⬆⬇の最中なら、それが終わってから改めて */
  if(_gdBusy){scheduleAutoSync();return;}
  gdSyncUp(false,true);
}

/* 見送りの状態が解けたとき（保存できた・読み込んで合流した・自動をやめた） */
function autoHoldClear(){
  _gdAutoHeld=false;
  _gdAutoWarned=false;
}
/* モーダルが開いているか。開いているところへ割り込むと、
   書きかけの編集フォームを消してしまうので、そのときはダイアログを出さない。 */
function _modalOpen(){
  var h=document.getElementById('modalHost');
  return !!(h&&h.innerHTML);
}
/* クラウドの方が新しかったので、自動保存を見送った */
function autoHold(cloudData,cAt){
  _gdAutoHeld=true;
  /* ☁の点。「起動したときの知らせ方」は起動時の話なので、ここでは見ない。
     自分で記録したものが上がっていない、という知らせは別のもの。       */
  _gdDiff=true;
  gdRefreshUI();
  if(PREF.gdWarnOff)return;   /* 点とパネルの一行だけにする、と決めてある */
  if(_gdAutoWarned)return;    /* 同じ見送りのあいだは1回だけ */
  if(_modalOpen())return;     /* 開いている画面を消さない。次の見送りで出す */
  _gdAutoWarned=true;
  askAutoHold(cloudData,cAt);
}
/* 見送ったことを知らせるダイアログ。ボタンの並びは ⬆保存 の3択と同じ */
function askAutoHold(cloudData,cAt){
  closeCal();   /* カレンダーはモーダルより上に出るので、開いていたら先に閉じる */
  _gdUpPending=cloudData;
  var lAt=+DB.updatedAt||0;
  document.getElementById('modalHost').innerHTML=
   '<div class="modal-ov" id="_holdOv"><div class="modal" style="max-width:440px">'
    +'<div class="modal-h">クラウドの方が新しいので、自動保存を見送りました</div>'
    +'<div class="time-cmp">クラウドのデータの方が新しいです<br>'
      +'クラウド <b>'+fmtStamp(cAt)+'</b> ／ この端末 <b>'+fmtStamp(lAt)+'</b></div>'
    +'<div class="safe-note">一度「⬇ 読み込む」でデータを合流させてください。<br>'
      +'このまま上書きすると、クラウドにしかない記録が失われます。</div>'
    +'<label class="cp-chk" style="margin-top:14px;margin-bottom:0">'
      +'<input type="checkbox" id="autoWarnOff">'
      +'次からはこの知らせを出さない（☁ の印だけにします）</label>'
    +'<div class="modal-foot"><div class="right">'
      +'<button class="btn" onclick="autoHoldKeep()">クラウドをそのままにする</button>'
      +'<button class="btn pri" onclick="autoHoldLoad()">先に読み込む</button>'
      +'<button class="btn danger" onclick="autoHoldForce()">上書きする</button>'
    +'</div></div>'
   +'</div></div>';
  document.getElementById('_holdOv').addEventListener('click',function(e){
    if(e.target.id==='_holdOv')autoHoldKeep();
  });
}
/* 画面を消す前に「次からは出さない」を拾う */
function _takeWarnOff(){
  var c=document.getElementById('autoWarnOff');
  if(c&&c.checked){PREF.gdWarnOff=true;savePref();}
}
function autoHoldKeep(){_takeWarnOff();cancelOverwrite();gdRefreshUI();}
function autoHoldLoad(){_takeWarnOff();loadBeforeUp();}
function autoHoldForce(){_takeWarnOff();forceUp();}

/* =========================================================
   段階3-c: 起動したときのクラウド差分チェックと知らせ方
     知らせ方は3択（ダイアログ／印だけ／知らせない）。端末ごとの設定。
     ダイアログはこれ専用のものを作らず、段階2の読み込みダイアログを
     そのまま使う。専用のものを挟むと、押したあとに保険①がもう一度出て
     二段になり、毎日開く道具では煩わしくなるため。
   ========================================================= */
/* 知らせ方を変える。「知らせない」でも点の出し方は drawCloudBtn 側で抑える */
function setNotify(v){
  PREF.gdNotify=(v==='dot'||v==='none')?v:'dialog';
  savePref();
  gdRefreshUI();
}
function notifyNote(){
  if(PREF.gdNotify==='dot')return '☁ に小さな印を付けるだけにします。';
  if(PREF.gdNotify==='none')
    return '何も出しません。自分で「⬇ 読み込む」を押したときだけ見に行きます。';
  return '開いたときに知らせて、☁ にも印を付けます。';
}
function notifySegHtml(){
  var opts=[['dialog','ダイアログ'],['dot','印だけ'],['none','知らせない']];
  var h='<div class="cp-lbl">起動したとき、クラウドの方が新しかったら</div><div class="cp-seg">';
  for(var i=0;i<opts.length;i++){
    h+='<button'+(PREF.gdNotify===opts[i][0]?' class="on"':'')
      +' onclick="setNotify(\''+opts[i][0]+'\')">'+opts[i][1]+'</button>';
  }
  return h+'</div><div class="cp-note">'+notifyNote()+'</div>';
}

/* 起動したとき・ログインしたときに、クラウドとの新旧を確かめる。
   静かに失敗する。回線が無いだけのことも多く、起動のたびに文句を出さない。 */
async function gdStartupCheck(){
  if(!_gdToken)return;
  if(PREF.gdNotify==='none')return;   /* 知らせないなら見に行かない */
  if(_gdBusy)return;
  try{
    var fid=await gdFindFile();
    if(!fid){
      /* クラウドにまだ何も無い。黙って上げると驚きになるので、
         「この端末の方が新しい」＝⬆保存で反映できる、という促しに任せる */
      _gdCloudAt=0;
      _gdDiff=false;
      gdRefreshUI();
      return;
    }
    _gdFileId=fid;
    var d=await gdDownload(fid);
    if(checkIncoming(d))return;   /* 読めないものは起動時は黙って見送る */
    var cAt=+d.updatedAt||0;
    _gdCloudAt=cAt;
    _gdDiff=(cAt>(+DB.updatedAt||0));
    gdRefreshUI();
    if(_gdDiff&&PREF.gdNotify==='dialog'){
      /* 段階2の読み込みダイアログをそのまま使う。
         第3引数で「次からは出さない」の印を足す */
      askLoad(d,'クラウド',true);
    }
  }catch(e){
    /* 静かに見送る */
  }
}

/* 開き直したときの復帰。
   ・鍵がまだ新しい（1時間以内）→ そのまま使う。Googleには問い合わせない
   ・鍵が古い／消えているが、前につないでいた → 裏で取り直す
   ・取り直せなければ、静かに未ログインへ戻す（⚠ にはしない。
     切れているのはこちらの都合で、あかりが何かを失ったわけではないので）  */
async function gdBootRestore(){
  if(_gdToken&&!gdTokenStale()){
    gdRefreshUI();
    return true;
  }
  if(!_gdToken&&!PREF.gdWasIn)return false;   /* 一度もつないでいない */
  try{
    await gdWaitReady(8000);   /* Googleの読み込みは async なので待つ */
    await gdSilentRefresh();
    return true;
  }catch(e){
    /* iOSのSafariなど、裏での取り直しが弾かれる環境がある。
       そのときは今までどおり、押してログインしてもらう。 */
    _gdToken=null;_gdTokenAt=0;_gdReconnect=false;
    gdForgetToken();
    gdRefreshUI();
    return false;
  }
}

/* ---- ☁ パネル ------------------------------------------ */
function cloudPanelHtml(){
  return cloudSyncSectionHtml()
    +'<div class="cp-sep"></div>'
    +'<div class="cp-h">ファイルで持ち出す</div>'
    +'<div class="cp-row">'
      +'<button class="btn" onclick="exportJson()">⬇ 書き出す</button>'
      +'<button class="btn" onclick="pickImport()">⬆ 読み込む</button>'
    +'</div>'
    +'<div class="cp-note">記録をファイルとして残せます。読み込むときは、'
    +'失われるものを先に数えて見せて、直前の控えも取ります。</div>'
    +firstTimeNoteHtml();
}
/* クラウド同期の欄。
   回線とGoogleのつながりは別ものとして扱う。状態の行はGoogleの話だけを言い、
   回線の話はボタンの下に一行だけ添える。回線が無く見えてもボタンは消さない
   （navigator.onLine は嘘をつくことがあり、消すと行き止まりになるため）。   */
function cloudSyncSectionHtml(){
  var h='<div class="cp-h">クラウド同期</div>';
  if(_gdReconnect){
    h+='<div class="cp-state"><span class="cp-dot warn"></span>接続が切れています</div>'
      +'<div class="cp-row"><button class="btn pri" onclick="gdReconnectNow()">⚠ 再接続</button></div>'
      +'<div class="cp-note">記録はこの端末に残っています。押すとつなぎ直します。</div>'
      +gdOfflineNote()
      +'<div class="cp-sep"></div>'+notifySegHtml()
      +'<div class="cp-sep"></div>'
      +'<div class="cp-row" style="margin-bottom:0">'
      +'<button class="btn sm" onclick="gdSignOut()">ログアウト</button></div>';
    return h;
  }
  if(!_gdToken){
    h+='<div class="cp-state"><span class="cp-dot"></span>未ログイン</div>'
      +'<div class="cp-row"><button class="btn" onclick="gdSignIn()">Googleでログイン</button></div>'
      +gdOfflineNote();
    return h;
  }
  h+='<div class="cp-state"><span class="cp-dot on"></span>つながっています'
    +(_gdLastSync?'<br><span class="cp-sub">最後の同期 '+fmtStamp(_gdLastSync)
      +(_gdLastAuto?'（自動）':'')+'</span>':'')
    +'</div>';
  h+='<div class="cp-row">'
    +'<button class="btn"'+(_gdBusy?' disabled':'')+' onclick="gdSyncUp()">⬆ 保存</button>'
    +'<button class="btn"'+(_gdBusy?' disabled':'')+' onclick="gdSyncDown()">⬇ 読み込む</button>'
   +'</div>';
  if(_gdBusy){
    h+='<div class="cp-note">クラウドとやりとりしています…</div>';
  }else if(_gdAutoHeld){
    /* 段階3-d: 自動保存を見送っている。人が押した⬇読み込みで合流してもらう */
    h+='<div class="cp-note" style="color:var(--warn)">'
      +'クラウドの方が新しいので、自動保存を見送りました。<br>'
      +'「⬇ 読み込む」で合流させてから保存してください。</div>';
  }else if(_gdDiff&&PREF.gdNotify!=='none'){
    h+='<div class="cp-note" style="color:var(--acc2)">'
      +'クラウドに、この端末より新しいものがあります</div>';
  }else if(gdNeedUp()){
    /* 読み込んだ結果はクラウドより中身が多い。自動では上げず、ここで促す */
    h+='<div class="cp-note" style="color:var(--acc)">'
      +'この端末の方が新しいです。⬆保存でクラウドにも反映できます</div>';
  }
  h+=gdOfflineNote();
  /* 段階3-d: 変わったら自動で保存する。
     説明は入れたときだけ出す。切っている人に、していないことの説明は要らない。 */
  h+='<div class="cp-sep"></div>'
    +'<label class="cp-chk"><input type="checkbox"'+(PREF.gdAuto?' checked':'')
    +' onchange="setAuto(this.checked)">変わったら自動でクラウドに保存する</label>';
  if(PREF.gdAuto){
    h+='<div class="cp-note">記録を変えてから数秒後に、そっと保存します。'
      +'クラウドの方が新しいときは保存を見送ります（上書きしません）。</div>';
    /* この☑は、見送りのダイアログで印を入れたあとだけ現れる。
       まだ起きていないことの設定を最初から並べない（3-cの「次からは出さない」と同じ）。 */
    if(PREF.gdWarnOff){
      h+='<label class="cp-chk" style="margin-top:9px">'
        +'<input type="checkbox" checked onchange="setWarnOff(this.checked)">'
        +'見送ったときに知らせない</label>';
    }
  }
  /* 起動時の知らせ方。未ログインのときは出さない（この下の分岐に入らない） */
  h+='<div class="cp-sep"></div>'+notifySegHtml();
  /* ログアウトは区切り線を挟んで下に。そう何度も押すものではないので */
  h+='<div class="cp-sep"></div>'
    +'<div class="cp-row" style="margin-bottom:0">'
    +'<button class="btn sm"'+(_gdBusy?' disabled':'')
    +' onclick="gdSignOut()">ログアウト</button></div>';
  return h;
}
/* 回線が無いと見えるときの一行。「ようです」と言い切らないのは、
   navigator.onLine が当てにならないことがあるため */
function gdOfflineNote(){
  if(gdOnline())return '';
  return '<div class="cp-note" style="color:var(--warn)">'
    +'回線につながっていないようです。記録はこの端末に残っています。<br>'
    +'押してみることはできますが、失敗するかもしれません。</div>';
}
/* はじめて別の端末とやりとりする人へ。クラウドでもファイルでも同じ落とし穴なので、
   パネルの一番下に1つだけ置く。
   イベントは名前や期間ではなく札（id）で見分けるので、両方の端末で別々に作ると
   同じ名前でも別物になる。それを先に知らせておく。                        */
function firstTimeNoteHtml(){
  return '<div class="cp-first">'
    +'<span class="cp-first-h">はじめの1回だけ注意</span>'
    +'片方の端末から先に保存して、もう片方は<b>それを読み込んでから</b>使ってください。'
    +'両方の端末で同じイベントを作ると、名前が同じでも別のものとして扱われます。'
    +'</div>';
}
function toggleCloud(btn){
  var p=document.getElementById('cloudPanel');
  if(!p)return;
  if(p.style.display==='block'){closeCloud();return;}
  p.innerHTML=cloudPanelHtml();
  p.style.display='block';
  var r=btn.getBoundingClientRect();
  var pw=p.offsetWidth||270;
  p.style.left=Math.max(4,Math.min(r.right-pw,window.innerWidth-pw-8))+'px';
  p.style.top=(r.bottom+6)+'px';
  btn.classList.add('open');
  setTimeout(function(){document.addEventListener('click',_cloudOutside,true);},0);
}
function _cloudOutside(e){
  var p=document.getElementById('cloudPanel');
  /* ☁ボタンの中の青い点を押したときも「ボタンを押した」と見なす
     （e.target が span になるので id では拾えない）                */
  var onBtn=e.target&&e.target.closest&&e.target.closest('.cloud-btn');
  if(p&&!p.contains(e.target)&&!onBtn)closeCloud();
}
function closeCloud(){
  var p=document.getElementById('cloudPanel');
  if(p)p.style.display='none';
  var b=document.getElementById('cloudBtn');
  if(b)b.classList.remove('open');
  document.removeEventListener('click',_cloudOutside,true);
}

/* ---- 起動 -------------------------------------------- */
function boot(){
  load();
  loadPref();     // この端末だけの設定（同期の好み）
  applyTheme();
  renderList();
  go('list');
  drawUndoBar(); // 読み込み後に画面を閉じても、次に何か記録するまでは戻せる
  drawCloudBtn(); // 残っている鍵があれば「つながっている」で出る
  /* 鍵を戻してから、クラウドとの新旧を確かめる（段階3-c）。
     戻せなかったときは確かめに行かない                        */
  gdBootRestore().then(function(okIn){if(okIn)gdStartupCheck();});
  /* 回線が切れた・戻ったで☁の濃さを変える。Googleのつながりとは別もの */
  try{
    window.addEventListener('online',gdRefreshUI);
    window.addEventListener('offline',gdRefreshUI);
  }catch(e){}
}
boot();
</script>
