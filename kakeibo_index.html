.side-logo {
  position: fixed;
  left: 0; top: 0;
  width: 52px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
  background: rgba(255,252,245,0.18);
  backdrop-filter: blur(3px);
  border-right: 0.5px solid rgba(160,135,100,0.25);
}

.logo-text {
  writing-mode: vertical-rl;
  font-size: 13px;
  color: #5a4a35;
  letter-spacing: 0.18em;
}

.logo-text.en {
  font-style: italic;
  font-size: 12px;
  color: #8a7560;
  letter-spacing: 0.08em;
}

.logo-divider {
  width: 22px; height: 0.5px;
  background: rgba(90,74,53,0.3);
}

.back-link {
  position: fixed;
  top: 20px; left: 64px;
  font-size: 11px;
  color: rgba(90,74,53,0.55);
  text-decoration: none;
  letter-spacing: 0.1em;
  z-index: 100;
  transition: color 0.15s;
}

.back-link:hover { color: rgba(90,74,53,0.9); }

.pc-main {
  margin-left: 52px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
}

.pc-cards {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 60px 40px 80px 40px;
}

.app-card {
  background: rgba(255,252,245,0.70);
  backdrop-filter: blur(10px);
  border: 0.5px solid rgba(170,145,105,0.35);
  border-radius: 3px;
  padding: 32px 24px 26px;
  width: 220px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 20px rgba(80,60,30,0.07);
}

.app-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 3px;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 5px,
    rgba(160,135,95,0.04) 5px, rgba(160,135,95,0.04) 6px
  );
  pointer-events: none;
}

.app-card:hover {
  transform: translateY(-5px);
  background: rgba(255,252,245,0.88);
  box-shadow: 0 8px 28px rgba(80,60,30,0.12);
}

.card-version {
  font-style: italic;
  font-size: 11px;
  color: #b0997a;
  letter-spacing: 0.1em;
  margin-bottom: 8px;

.sp-layout::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(235,228,215,0.45);
}

.sp-inner {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 28px 24px 48px;
}

.sp-header { margin-bottom: 36px; }

.sp-back {
  display: inline-block;
  font-size: 11px;
  color: rgba(90,74,53,0.6);
  text-decoration: none;
  letter-spacing: 0.1em;
  margin-bottom: 12px;
}

.sp-logo-ja {
  font-size: 22px;
  color: #3a2e20;
  letter-spacing: 0.14em;
}

.sp-logo-sub {
  font-size: 11px;
  color: #7a6a52;
  letter-spacing: 0.1em;
  margin-top: 4px;
  font-style: italic;
}

.sp-cards {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}

.sp-card {
  background: rgba(255,252,245,0.75);
  backdrop-filter: blur(12px);
  border: 0.5px solid rgba(170,145,105,0.35);
  border-radius: 3px;
  padding: 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-decoration: none;
  position: relative;
  transition: background 0.15s, transform 0.15s;
  box-shadow: 0 2px 16px rgba(80,60,30,0.07);
}

.sp-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 3px;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 5px,
    rgba(160,135,95,0.04) 5px, rgba(160,135,95,0.04) 6px
  );
  pointer-events: none;
}

.sp-card:hover {
  background: rgba(255,252,245,0.92);
  transform: translateX(4px);
}

.sp-card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.sp-card-version {
  font-style: italic;
  font-size: 11px;
  color: #b0997a;
  letter-spacing: 0.08em;
}

.sp-card-arrow {
  font-size: 18px;
  color: #b0997a;
}

.sp-card-ja {
  font-size: 18px;
  color: #3a2e20;
  letter-spacing: 0.12em;
}

.sp-card-desc {
  font-size: 11px;
  color: #7a6a52;
  line-height: 1.7;
  letter-spacing: 0.04em;
}

@media (max-width: 680px) {
  .pc-layout, .side-logo, .back-link { display: none !important; }
  .sp-layout { display: block; }
}
</style>
